<script>
  (function() {
    "use strict";
    // Define the exact project storage lookup path signature
    const projectUrlHash = "lrbimrlbskjweynxlgas"; 
    const sessionTokenKey = `sb-${projectUrlHash}-auth-token`;
    
    // Synchronously check local storage cache arrays before browser can paint any HTML elements
    const rawSessionJson = localStorage.getItem(sessionTokenKey);
    let isAuthenticated = false;
    let userRole = null;

    if (rawSessionJson) {
      try {
        const sessionData = JSON.parse(rawSessionJson);
        if (sessionData && sessionData.access_token) {
          isAuthenticated = true;
          // Extract nested metadata flags out of JWT payload context securely
          if (sessionData.user && sessionData.user.user_metadata) {
            userRole = sessionData.user.user_metadata.role;
          }
          if (sessionData.user && !userRole && sessionData.user.email) {
            if (sessionData.user.email.toLowerCase().endsWith('@filings4u.com')) {
              userRole = 'admin';
            }
          }
        }
      } catch (e) {
        console.error("Security parsing failure:", e);
      }
    }

    // Determine current view file track rules path parameters
    const pagePathString = window.location.pathname.toLowerCase();
    const isAdminViewPage = pagePathString.includes('/admin-');

    if (!isAuthenticated) {
      // 🚨 CRITICAL REDIRECT: Halt thread and eject out-of-bounds requests immediately
      alert("🔒 Access Denied: Authentication required. Redirecting to secure login desk portal...");
      window.location.replace(isAdminViewPage ? "admin-login.html" : "portal-login.html");
      
      // Inject CSS rule to hide everything in case browser delays routing
      document.documentElement.style.display = "none";
      throw new Error("🔒 Execution Halted: Unauthorized navigation attempt terminated.");
    }

    // Role Enforcement Shield: Blocks non-admins from hitting administrative paths
    if (isAdminViewPage && userRole !== 'admin') {
      alert("🛡️ Security Exception: Restricted Administrative Territory. Access Refused.");
      window.location.replace("client-dashboard.html");
      document.documentElement.style.display = "none";
      throw new Error("🛡️ Execution Halted: Insufficient role permissions clearance.");
    }
  })();
</script>

    </thead>
    <tbody id="admin-compliance-target-box">
      <tr><td colspan="6" style="padding:30px; text-align:center; color:#64748b; font-style:italic;">Syncing regulatory compliance audits...</td></tr>
    </tbody>

<!-- MODERN MODAL NOTIFICATION OVERLAY WITH GLASS BLUR BACKGROUND -->
<div id="complianceCustomModalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 99999; justify-content: center; align-items: center;">
  <div style="background: #ffffff; padding: 28px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); max-width: 420px; width: 90%; text-align: center; border: 1px solid #e2e8f0; transform: scale(0.95); transition: transform 0.2s ease;">
    <div id="modalIconBox" style="font-size: 2.5rem; margin-bottom: 12px;">✅</div>
    <h3 id="modalHeaderTitle" style="margin: 0 0 10px 0; font-size: 1.2rem; font-weight: 700; color: #0f172a;">Action Success</h3>
    <p id="modalMessageContent" style="margin: 0 0 20px 0; font-size: 0.9rem; color: #475569; line-height: 1.5; text-align: center;"></p>
    <button onclick="closeComplianceModal()" style="width: 100%; padding: 10px; background: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: background 0.15s;"> Acknowledge & Continue </button>
  </div>
</div>

  </main> 
</div>


 <!-- 1. The Global Library Core MUST load absolute first -->
  
  
  <!-- 3. The unified master script processes pricing ledgers, filters, metrics, and navigation -->
  <script src="assets/js/admin-master-ledger.js"></script>

   <!-- 3. The unified master script processes pricing ledgers, filters, metrics, and navigation -->
  <script src="assets/js/admin-navigation.js"></script>


<script>
(function () {
  "use strict";

  /*
   * COMPLIANCE AUDIT DESK — WIRED TO THE SUPPLIED SCHEMA
   *
   * Tables:
   *   client_profiles
   *   client_entities
   *   compliance_deadlines
   *   client_vault
   *
   * Storage:
   *   client_documents_vault
   */

  const DB_URL = "https://lrbimrlbskjweynxlgas.supabase.co";
  const DB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyYmltcmxic2tqd2V5bnhsZ2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjQ0NTYsImV4cCI6MjA5NDEwMDQ1Nn0.I8fQ6ZjA9oaTqJCF-7Z7vUboXC8zv2cogBv4PC_1ihU";
  const STORAGE_BUCKET = "client_documents_vault";

  let dbClient = null;
  let clientProfileCache = new Map();

  function resolveSupabaseClient() {
    if (window.supabaseInstance) return window.supabaseInstance;
    if (window.supabaseClient) return window.supabaseClient;
    if (window.chatAdminCoreClient) return window.chatAdminCoreClient;

    if (window.supabase && typeof window.supabase.createClient === "function") {
      return window.supabase.createClient(DB_URL, DB_KEY);
    }

    if (typeof supabase !== "undefined" && typeof supabase.createClient === "function") {
      return supabase.createClient(DB_URL, DB_KEY);
    }

    return null;
  }

  function normalizeEmail(value) {
    return String(value || "").trim().toLowerCase();
  }

  function escapeDataString(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#x27;");
  }

  function formatDate(value) {
    if (!value) return "N/A";
    const date = new Date(`${value}T00:00:00`);
    return Number.isNaN(date.getTime()) ? "N/A" : date.toLocaleDateString();
  }

  function getStatusStyle(status) {
    const normalized = String(status || "").toLowerCase();

    if (normalized.includes("overdue") || normalized.includes("expired")) {
      return "background:#fee2e2;color:#991b1b;";
    }

    if (normalized.includes("resolved") || normalized.includes("completed") || normalized.includes("active")) {
      return "background:#dcfce7;color:#166534;";
    }

    return "background:#fef3c7;color:#b45309;";
  }

  async function loadClientProfiles() {
    const clientMenu = document.getElementById("uploadTargetClientSelector");
    if (!clientMenu) return;

    const { data, error } = await dbClient
      .from("client_profiles")
      .select("id,email_address,first_name,last_name,company_name")
      .order("email_address", { ascending: true });

    if (error) throw error;

    clientProfileCache = new Map();

    clientMenu.innerHTML =
      '<option value="">-- Choose Target Account Profile Email --</option>';

    (data || []).forEach((profile) => {
      const email = normalizeEmail(profile.email_address);
      if (!email) return;

      clientProfileCache.set(email, profile);

      const name = `${profile.first_name || ""} ${profile.last_name || ""}`.trim();
      const label = name
        ? `${email} (${name})`
        : `${email} (${profile.company_name || "Client"})`;

      const option = document.createElement("option");
      option.value = email;
      option.textContent = label;
      clientMenu.appendChild(option);
    });
  }

  function hydrateClientFormFields() {
    const clientMenu = document.getElementById("uploadTargetClientSelector");
    const profile = clientProfileCache.get(normalizeEmail(clientMenu?.value));

    const entityInput = document.getElementById("formEntityName");
    const filingInput = document.getElementById("formFilingType");

    if (!profile) {
      if (entityInput) entityInput.value = "";
      if (filingInput) filingInput.value = "";
      return;
    }

    if (entityInput) entityInput.value = profile.company_name || "";
    if (filingInput) filingInput.value = "";
  }

  async function loadComplianceLedger() {
    const tableElement = document.getElementById("admin-compliance-target-box");
    if (!tableElement) return;

    tableElement.innerHTML =
      '<tr><td colspan="6" style="padding:30px;text-align:center;color:#64748b;font-style:italic;">Syncing regulatory compliance audits...</td></tr>';

    const [entitiesRes, deadlinesRes, vaultRes] = await Promise.all([
      dbClient
        .from("client_entities")
        .select("id,entity_name,filing_description,client_email,state_of_formation,formation_date,registry_document_url,created_at")
        .order("created_at", { ascending: false }),

      dbClient
        .from("compliance_deadlines")
        .select("id,client_email,client_name,filing_name,company_name,expiration_date,status,created_at")
        .order("created_at", { ascending: false }),

      dbClient
        .from("client_vault")
        .select("id,target_client_email,email_address,file_name,storage_bucket_path,asset_vault_category,created_at")
        .order("created_at", { ascending: false })
    ]);

    if (entitiesRes.error) throw entitiesRes.error;
    if (deadlinesRes.error) throw deadlinesRes.error;
    if (vaultRes.error) throw vaultRes.error;

    const deadlinesByEmail = new Map();
    (deadlinesRes.data || []).forEach((row) => {
      const email = normalizeEmail(row.client_email);
      if (email && !deadlinesByEmail.has(email)) deadlinesByEmail.set(email, row);
    });

    const vaultByEmail = new Map();
    (vaultRes.data || []).forEach((row) => {
      const email = normalizeEmail(row.target_client_email || row.email_address);
      if (email && !vaultByEmail.has(email)) vaultByEmail.set(email, row);
    });

    const entities = entitiesRes.data || [];

    if (!entities.length) {
      tableElement.innerHTML =
        '<tr><td colspan="6" style="padding:30px;text-align:center;color:#64748b;font-style:italic;">No compliance entity records found.</td></tr>';
      return;
    }

    tableElement.innerHTML = entities.map((entity) => {
      const email = normalizeEmail(entity.client_email);
      const deadline = deadlinesByEmail.get(email);
      const vault = vaultByEmail.get(email);

      const filingType = deadline?.filing_name || entity.filing_description || "Compliance Record";
      const renewalDate = deadline?.expiration_date || entity.formation_date || null;
      const status = deadline?.status || entity.standing_status || "ACTIVE";

      const documentIndicator = vault
        ? `<div style="font-size:.68rem;color:#64748b;margin-top:3px;">📎 ${escapeDataString(vault.file_name)}</div>`
        : "";

      return `
        <tr style="border-bottom:1px solid #e2e8f0;background:#fff;">
          <td style="padding:14px 12px;color:#475569;font-family:monospace;">${escapeDataString(email)}</td>
          <td style="padding:14px 12px;color:#1e293b;font-weight:600;">
            ${escapeDataString(entity.entity_name)}
            ${documentIndicator}
          </td>
          <td style="padding:14px 12px;color:#1e293b;">${escapeDataString(filingType)}</td>
          <td style="padding:14px 12px;color:#475569;font-weight:700;text-transform:uppercase;">${escapeDataString(entity.state_of_formation || "N/A")}</td>
          <td style="padding:14px 12px;color:#475569;font-family:monospace;">${formatDate(renewalDate)}</td>
          <td style="padding:14px 12px;text-align:right;">
            <span style="display:inline-block;padding:4px 8px;border-radius:4px;font-size:.75rem;font-weight:700;${getStatusStyle(status)}">
              ${escapeDataString(status)}
            </span>
          </td>
        </tr>
      `;
    }).join("");
  }

  function computeVaultCategory(slug) {
    const value = String(slug || "").toLowerCase().trim();

    if ([
      "llc-formation","corporations","sole-proprietorship","dba-registration",
      "nonprofits","series-llc","llc-reinstatement","foreign-qualification","dissolution"
    ].includes(value)) return "formation";

    if ([
      "operating-agreement","corporate-bylaws","certificate-of-good-standing","apostille-services"
    ].includes(value)) return "governance";

    if ([
      "federal-tax","state-tax","franchise-tax","payroll-tax-940-941",
      "sales-tax-registration","heavy-use-tax-2290","employer-id-ein"
    ].includes(value)) return "tax";

    return "logistics";
  }

  async function getCurrentOperator() {
    const { data, error } = await dbClient.auth.getUser();
    if (error) throw error;
    if (!data?.user) throw new Error("Your administrative session is no longer active.");
    return data.user;
  }

  async function notifyDocumentUpload(record) {
    try {
      const response = await fetch(
        "https://lrbimrlbskjweynxlgas.supabase.co/functions/v1/document-notification",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ record })
        }
      );

      if (!response.ok) {
        console.warn("Document notification returned HTTP", response.status);
      }
    } catch (error) {
      console.warn("Optional document notification failed:", error);
    }
  }

  async function handleComplianceUpload(event) {
    event.preventDefault();

    const uploadForm = document.getElementById("complianceUploadForm");
    const clientMenu = document.getElementById("uploadTargetClientSelector");
    const fileInput = document.getElementById("uploadFileReference");
    const submitBtn = uploadForm?.querySelector('button[type="submit"]');

    if (!dbClient || !uploadForm || !clientMenu || !fileInput) return;

    const targetEmail = normalizeEmail(clientMenu.value);
    const entityName = document.getElementById("formEntityName")?.value.trim();
    const filingType = document.getElementById("formFilingType")?.value.trim();
    const renewalDate = document.getElementById("formRenewalDate")?.value;
    const stateJurisdiction = document.getElementById("formStateJurisdiction")?.value;
    const fulfillmentSlug = document.getElementById("formFulfillmentSlug")?.value;
    const auditStatus = document.getElementById("formAuditStatus")?.value;

    if (!targetEmail) {
      return showCustomBlurModal("⚠️", "Client Required", "Select a client profile before committing a compliance asset.");
    }

    if (!entityName || !filingType || !renewalDate || !stateJurisdiction) {
      return showCustomBlurModal("⚠️", "Required Fields", "Complete the client, entity, filing type, due date, and jurisdiction fields.");
    }

    if (!fileInput.files?.length) {
      return showCustomBlurModal("⚠️", "File Missing", "Attach the compliance verification PDF before continuing.");
    }

    const targetFile = fileInput.files[0];

    if (
      targetFile.type !== "application/pdf" &&
      !targetFile.name.toLowerCase().endsWith(".pdf")
    ) {
      return showCustomBlurModal("❌", "Invalid File Type", "Only PDF documents can be committed to the compliance vault.");
    }

    const profile = clientProfileCache.get(targetEmail);
    if (!profile) {
      return showCustomBlurModal("❌", "Client Profile Not Found", "The selected email no longer maps to a client profile.");
    }

    const operator = await getCurrentOperator();
    const category = computeVaultCategory(fulfillmentSlug);
    const entityId = crypto.randomUUID();
    const fileId = crypto.randomUUID();
    const deadlineId = crypto.randomUUID();
    const cleanFileName = targetFile.name.replace(/[^a-z0-9._-]/gi, "_").toLowerCase();
    const secureStoragePath = `compliance_audits/${targetEmail}/${entityId}_${cleanFileName}`;

    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerText = "Syncing Vault Asset...";
    }

    let entityCreated = false;
    let vaultCreated = false;
    let deadlineCreated = false;
    let storageUploaded = false;

    try {
      const { error: entityError } = await dbClient
        .from("client_entities")
        .insert([{
          id: entityId,
          entity_name: entityName,
          filing_description: filingType,
          standing_status: auditStatus === "Resolved" ? "RESOLVED" : "ACTIVE",
          state_of_formation: stateJurisdiction,
          client_email: targetEmail,
          registry_document_url: null
        }]);

      if (entityError) throw entityError;
      entityCreated = true;

      const { error: storageError } = await dbClient.storage
        .from(STORAGE_BUCKET)
        .upload(secureStoragePath, targetFile, {
          cacheControl: "3600",
          upsert: false,
          contentType: "application/pdf"
        });

      if (storageError) throw storageError;
      storageUploaded = true;

      const { error: vaultError } = await dbClient
        .from("client_vault")
        .insert([{
          id: fileId,
          uploaded_by: operator.id,
          file_name: targetFile.name,
          storage_bucket_path: secureStoragePath,
          file_size_bytes: targetFile.size,
          bucket_id: STORAGE_BUCKET,
          storage_path: secureStoragePath,
          content_type: "application/pdf",
          admin_name: operator.user_metadata?.full_name || operator.email || "System Administrator",
          asset_vault_category: category,
          target_client_email: targetEmail,
          email_address: targetEmail,
          first_name: profile.first_name || null,
          last_name: profile.last_name || null
        }]);

      if (vaultError) throw vaultError;
      vaultCreated = true;

      const clientName =
        `${profile.first_name || ""} ${profile.last_name || ""}`.trim() ||
        profile.company_name ||
        "Valued Client";

      const { error: deadlineError } = await dbClient
        .from("compliance_deadlines")
        .insert([{
          id: deadlineId,
          client_email: targetEmail,
          client_name: clientName,
          filing_name: filingType,
          company_name: profile.company_name || entityName,
          expiration_date: renewalDate,
          status: auditStatus === "Resolved" ? "Resolved" : "Active"
        }]);

      if (deadlineError) throw deadlineError;
      deadlineCreated = true;

      const { error: entityPointerError } = await dbClient
        .from("client_entities")
        .update({ registry_document_url: secureStoragePath })
        .eq("id", entityId);

      if (entityPointerError) {
        console.warn("Document pointer update failed:", entityPointerError);
      }

      await notifyDocumentUpload({
        user_email: targetEmail,
        entity_name: entityName,
        filing_type: filingType,
        renewal_date: renewalDate,
        state_jurisdiction: stateJurisdiction,
        asset_vault_category: category,
        audit_status: auditStatus,
        storage_bucket: STORAGE_BUCKET,
        storage_path: secureStoragePath
      });

      showCustomBlurModal(
        "✅",
        "Asset Synchronized",
        "The compliance entity, deadline, PDF vault record, and document pointer were successfully synchronized."
      );

      uploadForm.reset();
      await loadClientProfiles();
      await loadComplianceLedger();
    } catch (error) {
      console.error("Compliance transaction failed:", error);

      if (deadlineCreated) {
        await dbClient.from("compliance_deadlines").delete().eq("id", deadlineId);
      }

      if (vaultCreated) {
        await dbClient.from("client_vault").delete().eq("id", fileId);
      }

      if (entityCreated) {
        await dbClient.from("client_entities").delete().eq("id", entityId);
      }

      if (storageUploaded) {
        await dbClient.storage.from(STORAGE_BUCKET).remove([secureStoragePath]);
      }

      showCustomBlurModal(
        "❌",
        "Execution Interrupted",
        `The compliance transaction could not be completed: ${error.message || error}`
      );

      await loadComplianceLedger().catch(() => {});
    } finally {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerText = "Commit Vault Asset";
      }
    }
  }

  async function initAdminConsole() {
    try {
      dbClient = resolveSupabaseClient();

      if (!dbClient) {
        throw new Error("Supabase could not be initialized. Check supabase-config.js and the Supabase library.");
      }

      await loadClientProfiles();
      await loadComplianceLedger();

      const clientMenu = document.getElementById("uploadTargetClientSelector");
      const uploadForm = document.getElementById("complianceUploadForm");

      if (clientMenu && !clientMenu.hasAttribute("data-client-listener")) {
        clientMenu.addEventListener("change", hydrateClientFormFields);
        clientMenu.setAttribute("data-client-listener", "true");
      }

      if (uploadForm && !uploadForm.hasAttribute("data-live-listener")) {
        uploadForm.addEventListener("submit", handleComplianceUpload);
        uploadForm.setAttribute("data-live-listener", "true");
      }

      console.log("✓ Compliance Audit Desk connected to supplied database schema.");
    } catch (error) {
      console.error("Compliance Engine Setup Failure:", error);

      const tableElement = document.getElementById("admin-compliance-target-box");
      if (tableElement) {
        tableElement.innerHTML = `
          <tr>
            <td colspan="6" style="padding:30px;text-align:center;color:#ef4444;font-weight:700;background:#fef2f2;">
              ✕ Database synchronization failed: ${escapeDataString(error.message)}
            </td>
          </tr>
        `;
      }
    }
  }

  window.showCustomBlurModal = function (icon, title, message) {
    const overlay = document.getElementById("complianceCustomModalOverlay");
    if (!overlay) return;

    const iconBox = document.getElementById("modalIconBox");
    const titleBox = document.getElementById("modalHeaderTitle");
    const messageBox = document.getElementById("modalMessageContent");

    if (iconBox) iconBox.textContent = icon;
    if (titleBox) titleBox.textContent = title;
    if (messageBox) messageBox.textContent = message;

    overlay.style.display = "flex";

    setTimeout(() => {
      if (overlay.children[0]) {
        overlay.children[0].style.transform = "scale(1)";
      }
    }, 10);
  };

  window.closeComplianceModal = function () {
    const overlay = document.getElementById("complianceCustomModalOverlay");
    if (!overlay) return;

    if (overlay.children[0]) {
      overlay.children[0].style.transform = "scale(0.95)";
    }

    overlay.style.display = "none";
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initAdminConsole);
  } else {
    initAdminConsole();
  }
})();
</script>

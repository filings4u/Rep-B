<script>
  (function() {
    "use strict";
    // Define the exact project storage lookup path signature
    const projectUrlHash = "lrbimrlbskjweynxlgas"; 
    const sessionTokenKey = `sb-${projectUrlHash}-auth-token`;
    
    // Synchronously check local storage cache arrays before browser can paint any HTML elements
    const rawSessionJson = localStorage.getItem(sessionTokenKey);
    let isAuthenticated = false;
    let userRole = null;

    if (rawSessionJson) {
      try {
        const sessionData = JSON.parse(rawSessionJson);
        if (sessionData && sessionData.access_token) {
          isAuthenticated = true;
          // Extract nested metadata flags out of JWT payload context securely
          if (sessionData.user && sessionData.user.user_metadata) {
            userRole = sessionData.user.user_metadata.role;
          }
          if (sessionData.user && !userRole && sessionData.user.email) {
            if (sessionData.user.email.toLowerCase().endsWith('@filings4u.com')) {
              userRole = 'admin';
            }
          }
        }
      } catch (e) {
        console.error("Security parsing failure:", e);
      }
    }

    // Determine current view file track rules path parameters
    const pagePathString = window.location.pathname.toLowerCase();
    const isAdminViewPage = pagePathString.includes('/admin-');

    if (!isAuthenticated) {
      // 🚨 CRITICAL REDIRECT: Halt thread and eject out-of-bounds requests immediately
      alert("🔒 Access Denied: Authentication required. Redirecting to secure login desk portal...");
      window.location.replace(isAdminViewPage ? "admin-login.html" : "portal-login.html");
      
      // Inject CSS rule to hide everything in case browser delays routing
      document.documentElement.style.display = "none";
      throw new Error("🔒 Execution Halted: Unauthorized navigation attempt terminated.");
    }

    // Role Enforcement Shield: Blocks non-admins from hitting administrative paths
    if (isAdminViewPage && userRole !== 'admin') {
      alert("🛡️ Security Exception: Restricted Administrative Territory. Access Refused.");
      window.location.replace("client-dashboard.html");
      document.documentElement.style.display = "none";
      throw new Error("🛡️ Execution Halted: Insufficient role permissions clearance.");
    }
  })();
</script>

          <input type="file" id="uploadFileReference" style="padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px; background:#f8fafc; font-size:0.85rem; flex-grow: 1; cursor: pointer; height: 42px; box-sizing: border-box; display: flex; align-items: center;" required>
          <button type="submit" style="padding: 0 24px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size:0.9rem; font-weight: 600; cursor: pointer; height: 42px; transition: background 0.15s ease; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center;">

<div style="overflow-x:auto; border: 1px solid #e2e8f0; border-radius: 8px;">

<!-- MODERN MODAL NOTIFICATION OVERLAY WITH GLASS BLUR BACKGROUND -->
<div id="complianceCustomModalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 99999; justify-content: center; align-items: center;">
  <div style="background: #ffffff; padding: 28px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); max-width: 420px; width: 90%; text-align: center; border: 1px solid #e2e8f0; transform: scale(0.95); transition: transform 0.2s ease;">
    <div id="modalIconBox" style="font-size: 2.5rem; margin-bottom: 12px;">✅</div>
    <h3 id="modalHeaderTitle" style="margin: 0 0 10px 0; font-size: 1.2rem; font-weight: 700; color: #0f172a;">Action Success</h3>
    <p id="modalMessageContent" style="margin: 0 0 20px 0; font-size: 0.9rem; color: #475569; line-height: 1.5; text-align: center;"></p>

 <!-- 1. The Global Library Core MUST load absolute first -->

   <!-- 3. The unified master script processes pricing ledgers, filters, metrics, and navigation -->
  <script src="assets/js/admin-navigation.js"></script>


<script>
(function () {
  "use strict";

  const DB_URL = "https://lrbimrlbskjweynxlgas.supabase.co";
  const DB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyYmltcmxic2tqd2V5bnhsZ2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjQ0NTYsImV4cCI6MjA5NDEwMDQ1Nn0.I8fQ6ZjA9oaTqJCF-7Z7vUboXC8zv2cogBv4PC_1ihU";

  let dbClient = null;
  let clientProfileCache = new Map();
  let editingAuditId = null;
  let realtimeChannel = null;

  function resolveSupabaseClient() {
    if (window.supabaseInstance) return window.supabaseInstance;
    if (window.supabaseClient) return window.supabaseClient;
    if (window.chatAdminCoreClient) return window.chatAdminCoreClient;
    if (window.supabase && typeof window.supabase.createClient === "function") {
      return window.supabase.createClient(DB_URL, DB_KEY);
    }
    if (typeof supabase !== "undefined" && typeof supabase.createClient === "function") {
      return supabase.createClient(DB_URL, DB_KEY);
    }
    return null;
  }

  function normalizeEmail(value) {
    return String(value || "").trim().toLowerCase();
  }

  function escapeDataString(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
      .replace(/'/g, "&#x27;");
  }

  function formatDate(value) {
    if (!value) return "N/A";
    const date = new Date(`${value}T00:00:00`);
    return Number.isNaN(date.getTime()) ? "N/A" : date.toLocaleDateString();
  }

  function getStatusStyle(status) {
    const s = String(status || "").toLowerCase();
    if (s.includes("resolved") || s.includes("completed") ||
        s.includes("expired") || s.includes("overdue")) {
      return "background:#fee2e2;color:#991b1b;";
    }
    if (s.includes("active")) return "background:#dcfce7;color:#166534;";
    return "background:#fef3c7;color:#b45309;";
  }

  function val(id) {
    return document.getElementById(id)?.value?.trim() || "";
  }

  function setVal(id, value) {
    const el = document.getElementById(id);
    if (el) el.value = value ?? "";
  }

  function resetComplianceForm() {
    editingAuditId = null;
    const form = document.getElementById("complianceUploadForm");
    if (form) form.reset();
    setVal("formAuditStatus", "Active");
    const button = form?.querySelector('button[type="submit"]');
    if (button) button.innerText = "Commit Compliance Audit";
    const heading = form?.previousElementSibling;
    if (heading) heading.innerHTML = "Upload New Compliance Asset";
    const fileInput = document.getElementById("uploadFileReference");
    if (fileInput) {
      fileInput.value = "";
      fileInput.required = false;
    }
  }

  async function loadClientProfiles() {
    const menu = document.getElementById("uploadTargetClientSelector");
    if (!menu) return;

    const { data, error } = await dbClient
      .from("client_profiles")
      .select("id,email_address,first_name,last_name,company_name")
      .order("email_address", { ascending: true });

    if (error) throw error;

    clientProfileCache = new Map();
    menu.innerHTML = '<option value="">-- Choose Target Client Account --</option>';

    (data || []).forEach(profile => {
      const email = normalizeEmail(profile.email_address);
      if (!email) return;
      clientProfileCache.set(email, profile);

      const name = `${profile.first_name || ""} ${profile.last_name || ""}`.trim();
      const label = name ? `${email} (${name})` : `${email} (${profile.company_name || "Client"})`;

      const option = document.createElement("option");
      option.value = email;
      option.textContent = label;
      menu.appendChild(option);
    });
  }

  function hydrateClientFormFields() {
    const menu = document.getElementById("uploadTargetClientSelector");
    const profile = clientProfileCache.get(normalizeEmail(menu?.value));
    setVal("formEntityName", profile?.company_name || "");
  }

  async function loadComplianceLedger() {
    const target = document.getElementById("admin-compliance-target-box");
    if (!target) return;

    target.innerHTML =
      '<tr><td colspan="7" style="padding:30px;text-align:center;color:#64748b;font-style:italic;">Syncing administrative compliance ledger...</td></tr>';

    const { data, error } = await dbClient
      .from("admin_compliance_audit")
      .select("admin_audit_id,email_address,entity_name,filing_type,renewal_date,state_jurisdiction,fulfillment_slug,audit_status,created_at,asset_vault_category,framework_scope")
      .order("renewal_date", { ascending: true })
      .order("created_at", { ascending: false });

    if (error) throw error;

    if (!data?.length) {
      target.innerHTML =
        '<tr><td colspan="7" style="padding:30px;text-align:center;color:#64748b;font-style:italic;">No compliance audit records found.</td></tr>';
      return;
    }

    target.innerHTML = data.map(row => `
      <tr style="border-bottom:1px solid #e2e8f0;background:#fff;">
        <td style="padding:12px;color:#475569;font-family:monospace;font-size:.78rem;">${escapeDataString(row.email_address)}</td>
        <td style="padding:12px;color:#1e293b;font-weight:700;">${escapeDataString(row.entity_name)}</td>
        <td style="padding:12px;color:#1e293b;">${escapeDataString(row.filing_type)}</td>
        <td style="padding:12px;color:#475569;font-weight:700;">${escapeDataString(row.state_jurisdiction)}</td>
        <td style="padding:12px;color:#475569;font-family:monospace;">${formatDate(row.renewal_date)}</td>
        <td style="padding:12px;text-align:right;">
          <span style="display:inline-block;padding:4px 8px;border-radius:4px;font-size:.72rem;font-weight:700;${getStatusStyle(row.audit_status)}">${escapeDataString(row.audit_status)}</span>
        </td>
        <td style="padding:12px;text-align:right;white-space:nowrap;">
          <button type="button" onclick="editComplianceAudit('${escapeDataString(row.admin_audit_id)}')" style="padding:6px 10px;background:#0f172a;color:#fff;border:0;border-radius:5px;font-size:.72rem;font-weight:700;cursor:pointer;margin-right:5px;">Edit</button>
          <button type="button" onclick="deleteComplianceAudit('${escapeDataString(row.admin_audit_id)}')" style="padding:6px 10px;background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:5px;font-size:.72rem;font-weight:700;cursor:pointer;">Delete</button>
        </td>
      </tr>
    `).join("");
  }

  function computeVaultCategory(slug) {
    const s = String(slug || "").toLowerCase().trim();
    if (["llc-formation","corporations","sole-proprietorship","dba-registration","nonprofits","series-llc","llc-reinstatement","foreign-qualification","dissolution"].includes(s)) return "formation";
    if (["operating-agreement","corporate-bylaws","certificate-of-good-standing","apostille-services"].includes(s)) return "governance";
    if (["federal-tax","state-tax","franchise-tax","payroll-tax-940-941","sales-tax-registration","heavy-use-tax-2290","employer-id-ein"].includes(s)) return "tax";
    return "logistics";
  }

  async function getCurrentOperator() {
    const { data, error } = await dbClient.auth.getUser();
    if (error) throw error;
    if (!data?.user) throw new Error("Your administrative session is no longer active.");
    return data.user;
  }

  async function handleComplianceUpload(event) {
    event.preventDefault();

    const form = document.getElementById("complianceUploadForm");
    const menu = document.getElementById("uploadTargetClientSelector");
    const button = form?.querySelector('button[type="submit"]');
    if (!form || !menu || !dbClient) return;

    const email = normalizeEmail(menu.value);
    const profile = clientProfileCache.get(email);

    if (!email || !profile) {
      return showCustomBlurModal("⚠️", "Client Required", "Select a valid client account before saving the audit.");
    }

    const entityName = val("formEntityName");
    const filingType = val("formFilingType");
    const renewalDate = val("formRenewalDate");
    const stateJurisdiction = val("formStateJurisdiction");
    const fulfillmentSlug = val("formFulfillmentSlug");
    const auditStatus = val("formAuditStatus") || "Active";

    if (!entityName || !filingType || !renewalDate || !stateJurisdiction || !fulfillmentSlug) {
      return showCustomBlurModal("⚠️", "Required Fields", "Complete the client, entity, filing type, due date, jurisdiction, and fulfillment route.");
    }

    const fileInput = document.getElementById("uploadFileReference");
    if (fileInput?.files?.length) {
      const file = fileInput.files[0];
      if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
        return showCustomBlurModal("❌", "Invalid File Type", "Only PDF documents can be committed to the compliance vault.");
      }
    }

    const payload = {
      email_address: email,
      entity_name: entityName,
      filing_type: filingType,
      renewal_date: renewalDate,
      state_jurisdiction: stateJurisdiction,
      fulfillment_slug: fulfillmentSlug,
      audit_status: auditStatus,
      asset_vault_category: computeVaultCategory(fulfillmentSlug),
      framework_scope: profile.company_name
        ? `Standard Company Formation — ${profile.company_name}`
        : "Standard Company Formation"
    };

    try {
      if (button) {
        button.disabled = true;
        button.innerText = editingAuditId ? "Updating Compliance Audit..." : "Publishing Compliance Audit...";
      }

      let error;
      if (editingAuditId) {
        ({ error } = await dbClient
          .from("admin_compliance_audit")
          .update(payload)
          .eq("admin_audit_id", editingAuditId));
      } else {
        ({ error } = await dbClient
          .from("admin_compliance_audit")
          .insert([payload]));
      }

      if (error) throw error;

      const wasEdit = Boolean(editingAuditId);
      resetComplianceForm();
      await loadComplianceLedger();

      showCustomBlurModal(
        "✅",
        wasEdit ? "Compliance Audit Updated" : "Compliance Audit Published",
        "The admin_compliance_audit record was saved. Your database trigger will synchronize the client dashboard."
      );
    } catch (error) {
      console.error("Compliance audit write failed:", error);
      showCustomBlurModal("❌", "Save Failed", error.message || String(error));
    } finally {
      if (button) {
        button.disabled = false;
        button.innerText = editingAuditId ? "Update Compliance Audit" : "Commit Compliance Audit";
      }
    }
  }

  window.editComplianceAudit = async function(auditId) {
    try {
      const { data, error } = await dbClient
        .from("admin_compliance_audit")
        .select("admin_audit_id,email_address,entity_name,filing_type,renewal_date,state_jurisdiction,fulfillment_slug,audit_status")
        .eq("admin_audit_id", auditId)
        .single();

      if (error) throw error;

      editingAuditId = data.admin_audit_id;
      setVal("uploadTargetClientSelector", normalizeEmail(data.email_address));
      setVal("formEntityName", data.entity_name);
      setVal("formFilingType", data.filing_type);
      setVal("formRenewalDate", data.renewal_date);
      setVal("formStateJurisdiction", data.state_jurisdiction);
      setVal("formFulfillmentSlug", data.fulfillment_slug);
      setVal("formAuditStatus", data.audit_status);

      const form = document.getElementById("complianceUploadForm");
      const button = form?.querySelector('button[type="submit"]');
      if (button) button.innerText = "Update Compliance Audit";

      const heading = form?.previousElementSibling;
      if (heading) heading.innerHTML = "Update Existing Compliance Audit";

      const fileInput = document.getElementById("uploadFileReference");
      if (fileInput) {
        fileInput.value = "";
        fileInput.required = false;
      }

      form?.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (error) {
      showCustomBlurModal("❌", "Edit Failed", error.message || String(error));
    }
  };

  window.deleteComplianceAudit = async function(auditId) {
    if (!window.confirm("Delete this compliance audit record?")) return;

    try {
      const { error } = await dbClient
        .from("admin_compliance_audit")
        .delete()
        .eq("admin_audit_id", auditId);

      if (error) throw error;

      if (editingAuditId === auditId) resetComplianceForm();
      await loadComplianceLedger();

      showCustomBlurModal("✅", "Audit Deleted", "The administrative compliance record was deleted.");
    } catch (error) {
      showCustomBlurModal("❌", "Delete Failed", error.message || String(error));
    }
  };

  function initializeComplianceRealtime() {
    if (!dbClient || typeof dbClient.channel !== "function") return;

    realtimeChannel = dbClient
      .channel("admin-compliance-audit-ledger-live")
      .on("postgres_changes", {
        event: "*",
        schema: "public",
        table: "admin_compliance_audit"
      }, async payload => {
        console.log("[Admin Compliance Audit] Live mutation:", payload.eventType);
        try {
          await loadComplianceLedger();
        } catch (error) {
          console.error("[Admin Compliance Audit] Refresh failed:", error);
        }
      })
      .subscribe(status => {
        console.log("[Admin Compliance Audit] Realtime:", status);
      });
  }

  async function initAdminConsole() {
    try {
      dbClient = resolveSupabaseClient();
      if (!dbClient) throw new Error("Supabase could not be initialized.");

      await loadClientProfiles();
      await loadComplianceLedger();
      initializeComplianceRealtime();

      const menu = document.getElementById("uploadTargetClientSelector");
      const form = document.getElementById("complianceUploadForm");

      if (menu) menu.addEventListener("change", hydrateClientFormFields);
      if (form) form.addEventListener("submit", handleComplianceUpload);

      console.log("✓ Admin Compliance Audit Desk connected to public.admin_compliance_audit.");
    } catch (error) {
      console.error("Compliance Engine Setup Failure:", error);
      const target = document.getElementById("admin-compliance-target-box");
      if (target) {
        target.innerHTML = `<tr><td colspan="7" style="padding:30px;text-align:center;color:#ef4444;font-weight:700;background:#fef2f2;">✕ Database synchronization failed: ${escapeDataString(error.message)}</td></tr>`;
      }
    }
  }

  window.showCustomBlurModal = function(icon, title, message) {
    const overlay = document.getElementById("complianceCustomModalOverlay");
    if (!overlay) return;

    document.getElementById("modalIconBox").textContent = icon;
    document.getElementById("modalHeaderTitle").textContent = title;
    document.getElementById("modalMessageContent").textContent = message;
    overlay.style.display = "flex";

    setTimeout(() => {
      if (overlay.children[0]) overlay.children[0].style.transform = "scale(1)";
    }, 10);
  };

  window.closeComplianceModal = function() {
    const overlay = document.getElementById("complianceCustomModalOverlay");
    if (!overlay) return;
    if (overlay.children[0]) overlay.children[0].style.transform = "scale(0.95)";
    overlay.style.display = "none";
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initAdminConsole);
  } else {
    initAdminConsole();
  }
})();
</script>

            company: item.company_name || 'Not Specified',
            review_date: item.created_at ? new Date(item.created_at) : new Date(),
            status: item.order_status === 'Paid' ? 'Compliant' : 'Pending Review',
            score: 100
          });
        });
      }

      // 2. Process data inputs drawn natively from your dashboard_orders desk ledger
      if (dashOrdersRes.data) {
        dashOrdersRes.data.forEach(item => {
          consolidatedRows.push({
            id: item.id,
            email: item.email_address || 'internal@filings4u.com',
            name: `${item.first_name || ''} ${item.last_name || ''}`.trim() || 'Internal Operator',
            scope: item.selected_service || 'Administrative Account Provision',
            company: item.company_name || 'filings4u Core Infrastructure',
            review_date: item.hired_date ? new Date(item.hired_date) : new Date(),
            status: item.role === 'admin' ? 'Compliant' : 'Pending Review',
            score: 100
          });
        });
      }

      // Sort consolidated rows chronologically to maintain transaction alignment
      consolidatedRows.sort((a, b) => b.review_date - a.review_date);

      // B. Hydrate dropdown options matching your active profiles securely
      if (clientMenu) {
        consolidatedRows.forEach(row => {
          if (row.email && row.email !== 'anonymous@unknown.com') {
            uniqueClientsMap.set(row.email.trim(), row.id);
          }
        });

        if (uniqueClientsMap.size > 0) {
          const sortedEmails = Array.from(uniqueClientsMap.keys()).sort();
          clientMenu.innerHTML = '<option value="">-- Choose Target Account Profile Email --</option>';
          sortedEmails.forEach(email => {
            const userId = uniqueClientsMap.get(email);
            const opt = document.createElement('option');
            opt.value = userId;
            opt.textContent = email;
            clientMenu.appendChild(opt);
          });
        }
      }

      // C. Print database entries into compliance audit data table rows
      if (tableElement) {
        tableElement.innerHTML = '';
        if (consolidatedRows.length === 0) {
          tableElement.innerHTML = `<tr><td colspan="6" style="padding:30px; text-align:center; color:#64748b; font-style:italic;">No active record rows found across any database transaction matrices.</td></tr>`;
        } else {
          consolidatedRows.forEach(item => {
            let statusStyle = 'background:#dcfce7; color:#166534;';
            if (item.status === 'Pending Review') statusStyle = 'background:#fef3c7; color:#b45309;';
            if (item.status === 'Non-Compliant') statusStyle = 'background:#fee2e2; color:#991b1b;';

            const displayDate = item.review_date.toLocaleDateString();
            const displayScore = `${item.score}%`;

            const rowMarkup = `
              <tr style="border-bottom: 1px solid #e2e8f0;">
                <td style="padding:14px 12px; color: #475569;">${escapeDataString(item.email)}</td>
                <td style="padding:14px 12px; color: #1e293b; font-weight: 600;">${escapeDataString(item.scope)}</td>
                <td style="padding:14px 12px; color: #1e293b;">${escapeDataString(item.company)}</td>
                <td style="padding:14px 12px; color: #475569; font-weight: 700;">${displayScore}</td>
                <td style="padding:14px 12px; color: #475569; font-family: monospace;">${displayDate}</td>
                <td style="padding:14px 12px; text-align:right;">
                  <span style="padding:4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; ${statusStyle}">
                    ${escapeDataString(item.status)}
                  </span>
                </td>
              </tr>
            `;
            tableElement.insertAdjacentHTML('beforeend', rowMarkup);
          });
        }
      }
      // D. Multi-Write Form Submission Controller Pipeline Tracker Block
      if (uploadForm && !uploadForm.hasAttribute('data-live-listener')) {
        uploadForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          const targetSelector = document.getElementById('uploadTargetClientSelector');
          const targetUserId = targetSelector.value;
          const targetEmail = targetSelector.options[targetSelector.selectedIndex].text.trim();
          
          const frameworkScope = document.getElementById('formFilingName').value;
          const targetJurisdiction = document.getElementById('formCompanyName').value;
          const internalScoreRaw = document.getElementById('formClientName').value;
          const auditStatus = document.getElementById('formStatusSelector').value;
          const nextReviewDate = document.getElementById('formExpirationDate').value;
          const fileInput = document.getElementById('uploadFileReference');

          if (!targetUserId || targetUserId === '') {
            return showCustomBlurModal('⚠️', 'Input Required', 'Please select a valid target client profile email from the option dropdown menu.');
          }

          if (!fileInput.files || fileInput.files.length === 0) {
            return showCustomBlurModal('⚠️', 'File Missing', 'Please attach an operational asset verification file.');
          }

          const targetFile = fileInput.files[0];
          if (targetFile.type !== 'application/pdf' && !targetFile.name.toLowerCase().endsWith('.pdf')) {
            return showCustomBlurModal('❌', 'Invalid File Type', 'Security Constraint Active: You can only commit official PDF documents into this storage vault repository.');
          }

          const submitBtn = uploadForm.querySelector('button[type="submit"]');
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerText = 'Syncing Vault Asset...';
          }

          try {
            // STEP 1: Insert parameters matching your admin_compliance_audit database columns format explicitly
            const { data: newRow, error: dbError } = await dbClient
              .from('admin_compliance_audit')
              .insert([{
                framework_scope: frameworkScope,
                target_jurisdiction: targetJurisdiction,
                internal_score: internalScoreRaw ? parseInt(internalScoreRaw) : null,
                audit_status: auditStatus,
                next_review_date: nextReviewDate
              }])
              .select()
              .single();

            if (dbError) throw dbError;

            // STEP 2: Use the raw lower-case email directly as the folder name
            const rawEmailFolder = targetEmail.toLowerCase().trim();
            const fileCleanName = targetFile.name.replace(/[^a-z0-9.]/gi, '_').toLowerCase();
            const secureStoragePath = `compliance_audits/${rawEmailFolder}/${newRow.id}_${fileCleanName}`;

            // STEP 3: Stream physical binary payload straight to storage container vault bucket
            const { data: storageResult, error: vaultWriteError } = await dbClient
              .storage
              .from('client_documents_vault')
              .upload(secureStoragePath, targetFile, { cacheControl: '3600', upsert: false });

            if (vaultWriteError) throw vaultWriteError;

            // 🎯 STEP 4: TRIGGER UNBLOCKED EDGE FUNCTION DISPATCH WITHOUT JWT
            try {
              await fetch('https://lrbimrlbskjweynxlgas.supabase.co/functions/v1/document-notification', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  record: {
                    client_email: targetEmail,
                    framework_scope: frameworkScope,
                    target_jurisdiction: targetJurisdiction,
                    internal_score: internalScoreRaw,
                    next_review_date: nextReviewDate,
                    audit_status: auditStatus
                  }
                })
              });
              console.log('Notification safely delivered to open Edge Function pipeline.');
            } catch (emailErr) {
              console.error('Notification API routing exception caught:', emailErr);
            }

            showCustomBlurModal('✅', 'Asset Synchronized', 'The compliance audit record was successfully logged and committed to your storage vault.');
            uploadForm.reset();
            initAdminConsole(); // Live multi-table ledger refresh

          } catch (actionErr) {
            console.error('Processing transaction error trace caught:', actionErr);
            showCustomBlurModal('❌', 'Execution Interrupted', `System processing error verified: ${actionErr.message || actionErr}`);
          } finally {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerText = 'Commit Vault Asset';
            }
          }
        });

        uploadForm.setAttribute('data-live-listener', 'true');
      }
    } catch (err) {
      console.error('System Engine Setup Failure:', err);
    }
  }

  // GLOBAL BLURRY ACCESSIBLE CONTEXT OVERLAY MODAL DISPLAY HANDLER FUNCTIONS
  window.showCustomBlurModal = function(icon, title, message) {
    const overlay = document.getElementById('complianceCustomModalOverlay');
    if (overlay) {
      document.getElementById('modalIconBox').textContent = icon;
      document.getElementById('modalHeaderTitle').textContent = title;
      document.getElementById('modalMessageContent').textContent = message;
      overlay.style.display = 'flex';
      setTimeout(() => {
        if (overlay.children[0]) overlay.children[0].style.transform = 'scale(1)';
      }, 10);
    }
  };

  window.closeComplianceModal = function() {
    const overlay = document.getElementById('complianceCustomModalOverlay');
    if (overlay) {
      if (overlay.children[0]) overlay.children[0].style.transform = 'scale(0.95)';
      overlay.style.display = 'none';
    }
  };

  function escapeDataString(text) {
    if (!text) return '';
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "'");
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAdminConsole);
  } else {
    initAdminConsole();
  }
})();
</script>



</body>

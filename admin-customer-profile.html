<!-- JAVASCRIPT ARCHITECTURE CONTROLLER MODULES -->
  <script>
  document.addEventListener("DOMContentLoaded", async () => {
    "use strict";

    const currentUrlParams = new URLSearchParams(window.location.search);
    const targetEmailParam = currentUrlParams.get("email");
    const saveBtn = document.getElementById("profSaveMasterChangesBtn");
    const alertBanner = document.getElementById("profSaveBannerAlert");

    let cachedRowIdPointer = null;

    if (!targetEmailParam) {
      document.body.innerHTML = `
        <div style="padding: 60px; text-align: center; color: var(--prof-text-muted);">
          <h3 style="color: var(--prof-text-dark); font-weight: 850; font-size:1.3rem; margin:0;">No Targeted Account Parameter</h3>
          <p style="font-size: 0.85rem; margin: 8px 0 16px 0;">Return to the dashboard index tracking cockpit to select a valid client file.</p>
          <a href="admin-crm.html" style="background:var(--prof-primary); color:#fff; text-decoration:none; padding:10px 20px; font-weight:700; border-radius:6px; font-size:0.8rem;">Open CRM Engine ➔</a>
        </div>`;
      return;
    }

    // Establish Supabase Handshake
    let client = window.supabaseInstance || window.supabaseClient;
    if (!client && typeof supabase !== 'undefined') {
      client = supabase.createClient("https://lrbimrlbskjweynxlgas.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyYmltcmxic2tqd2V5bnhsZ2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjQ0NTYsImV4cCI6MjA5NDEwMDQ1Nn0.I8fQ6ZjA9oaTqJCF-7Z7vUboXC8zv2cogBv4PC_1ihU");
    }
    if (!client) return;

    // 📡 1. HYDRATE FIELD MAPS STRICTLY MATCHING RAW CLIENT_PROFILES SCHEMA
    async function loadTargetProfileMetadata() {
      try {
        console.log(`📡 [Profiler Engine] Querying row matching email address: [${targetEmailParam}]`);
        const { data: profile, error } = await client
          .from('client_profiles')
          .select('*')
          .eq('email_address', targetEmailParam.toLowerCase().trim())
          .maybeSingle();

        if (error) throw error;

        if (!profile) {
          document.body.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--prof-rose); font-weight: 700;">✕ Record trace matching account descriptor [${targetEmailParam}] not found in database.</div>`;
          return;
        }

        // Cache the true row primary key identity
        cachedRowIdPointer = profile.id;

        // Left Panel Summaries Ingestion        // Left Panel Summaries Ingestion
        document.getElementById("profAccountSummaryTitle").textContent = `${profile.first_name || ''} ${profile.last_name || ''}`.trim() || "Valued Customer";
        document.getElementById("profEmailLabelField").textContent = profile.email_address;
        document.getElementById("profTrackingLabelField").textContent = profile.tracking_number || "Not Provisioned";
        document.getElementById("profStripeLabelField").textContent = profile.stripe_customer_id || "No Connected Stripe Token";
        
        const statusEl = document.getElementById("profStatusLabelField");
        const statusVal = profile.sync_encryption_status || "Active";
        statusEl.textContent = statusVal;
        statusEl.style.color = statusVal.toLowerCase() === 'active' ? 'var(--crm-emerald)' : 'var(--crm-rose)';

        if (profile.avatar_url) {
          document.getElementById("profAvatarDisplayNode").src = profile.avatar_url;
        }

        // Form Fields Input Ingestion
        document.getElementById("profFirstNameField").value = profile.first_name || "";
        document.getElementById("profLastNameField").value = profile.last_name || "";
        document.getElementById("profCompanyField").value = profile.company_name || "";
        document.getElementById("profPhoneField").value = profile.phone_number || "";
        document.getElementById("profStreetField").value = profile.street_address || "";
        document.getElementById("profCityField").value = profile.city || "";
        document.getElementById("profStateField").value = profile.state || "";
        document.getElementById("profZipField").value = profile.zip_code || "";
        document.getElementById("profStatusField").value = statusVal;

        console.log("✓ [Profiler Engine] Interface values successfully mapped to target record row.");

      } catch (fault) {
        console.error("✕ Initialization loop collapsed:", fault);
      }
    }

    // 💾 2. MODIFICATION ENGINE: PUSH SAVED EDITS BACK TO ROW INDICES
    if (saveBtn) {
      saveBtn.addEventListener("click", async () => {
        if (!cachedRowIdPointer) return;

        saveBtn.disabled = true;
        saveBtn.textContent = "Updating Database Ledgers... 📡";

        const updatePayload = {
          first_name: document.getElementById("profFirstNameField").value.trim(),
          last_name: document.getElementById("profLastNameField").value.trim(),
          company_name: document.getElementById("profCompanyField").value.trim(),
          phone_number: document.getElementById("profPhoneField").value.trim(),
          street_address: document.getElementById("profStreetField").value.trim(),
          city: document.getElementById("profCityField").value.trim(),
          state: document.getElementById("profStateField").value.trim(),
          zip_code: document.getElementById("profZipField").value.trim(),
          sync_encryption_status: document.getElementById("profStatusField").value,
          updated_at: new Date().toISOString()
        };

        try {
          const { error: updateError } = await client
            .from('client_profiles')
            .update(updatePayload)
            .eq('id', cachedRowIdPointer);

          if (updateError) throw updateError;

          showSaveBanner("✓ Modifications locked in. Profile database successfully synchronized.", false);
          await loadTargetProfileMetadata();

        } catch (fault) {
          console.error(fault);
          showSaveBanner(`✕ Modification Rejected: ${fault.message}`, true);
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = "Save Profile Modifications ➔";
        }
      });
    }

    function showSaveBanner(text, isError) {
      if (!alertBanner) return;
      alertBanner.textContent = text;
      alertBanner.style.background = isError ? "#fee2e2" : "#ecfdf5";
      alertBanner.style.color = isError ? "#991b1b" : "#047857";
      alertBanner.style.display = "block";
      setTimeout(() => { if (alertBanner) alertBanner.style.display = "none"; }, 5000);
    }

    // 🏁 BOOT LIFECYCLE
    await loadTargetProfileMetadata();
  });
  </script>

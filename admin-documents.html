<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10b981">
<title>Documents Management | filings4u Admin</title>
<link href="images/fav.png" rel="icon" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin-documents.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-client.js"></script><script src="assets/js/admin-auth-guard.js"></script><script src="assets/js/admin-navigation.js"></script>
</head>
<body data-page="documents">
<div id="adminNavigationMount"></div>
<main>
  <div id="gate" class="gate">Verifying administrator access…</div>
  <section id="app" hidden>
    <div class="head">
      <div>
        <label>DOCUMENT OPERATIONS</label>
        <h1>Documents Management</h1>
        <p>Unified access to client vault files, admin vault files, uploaded documents and registry documents.</p>
      </div>
      <button id="refresh" class="primary">Refresh documents</button>
    </div>

    <div id="stats" class="stats"></div>

    <section class="panel">
      <div class="tabs">
        <button class="tab active" data-tab="all">All Documents</button>
        <button class="tab" data-tab="client">Client Vault</button>
        <button class="tab" data-tab="admin">Admin Vault</button>
        <button class="tab" data-tab="general">General / User Docs</button>
        <button class="tab" data-tab="registry">Registry Docs</button>
      </div>

      <div class="filters">
        <input id="q" placeholder="Search file name, client, entity, category or source">
        <select id="category"><option value="">All categories</option></select>
        <select id="source"><option value="">All sources</option></select>
        <button id="clear">Clear</button>
      </div>

      <div class="table">
        <table>
          <thead><tr><th>Document</th><th>Client / Entity</th><th>Category</th><th>Source</th><th>Size</th><th>Created</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </section>
</main>

<div id="toast" class="toast" hidden></div>
<script src="assets/js/admin-documents.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10b981">
<title>Business Entities Management | filings4u Admin</title>
<link href="images/fav.png" rel="icon" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin-entities.css">

</head>
<body data-page="entities">
<div id="adminNavigationMount"></div>
<main>
  <div id="gate" class="gate">Verifying administrator access…</div>
  <section id="app" hidden>
    <div class="head">
      <div>
        <label>ENTITY PORTFOLIO</label>
        <h1>Business Entities Management</h1>
        <p>Manage entity records, standing, formation details, source orders, compliance and registry documents.</p>
      </div>
      <button id="refresh" class="primary">Refresh entities</button>
    </div>

    <div id="stats" class="stats"></div>

    <section class="panel">
      <div class="filters">
        <input id="q" placeholder="Search entity, client email, service or state">
        <select id="standing"><option value="">All standing</option></select>
        <select id="state"><option value="">All states</option></select>
        <select id="service"><option value="">All services</option></select>
        <button id="clear">Clear</button>
      </div>

      <div class="table">
        <table>
          <thead>
            <tr><th>Entity</th><th>Client</th><th>Service</th><th>State</th><th>Standing</th><th>Compliance</th><th>Formation</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </section>
</main>

<div id="shade" class="shade" hidden></div>
<section id="drawer" class="drawer">
  <div class="drawerHead">
    <div><label>ENTITY RECORD</label><h2 id="drawerTitle"></h2></div>
    <button id="close">×</button>
  </div>
  <div id="detail" class="detailBody"></div>
</section>

<div id="toast" class="toast" hidden></div>
<!-- ADMIN PROTECTED PAGE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/admin-supabase-client.js"></script>
<script src="assets/js/admin-auth-guard.js"></script>
<script src="assets/js/admin-navigation.js"></script>
<script src="assets/js/admin-entities.js"></script>
</body>
</html>

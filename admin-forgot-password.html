<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Operator Recovery Gate | filings4u Administrative Suite</title>
  
  <!-- Inter Font Family Matrix Integration -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Integration Route -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>

  <style>
    :root {
      --primary: #0a1f44;
      --primary-hover: #112d5d;
      --staff-red: #c15254;
      --staff-red-bg: rgba(193, 82, 84, 0.06);
      --error: #ef4444;
      --error-bg: #fef2f2;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #e2e8f0;
      --bg-page: #f8fafc;
    }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }
    .page-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08);
      box-sizing: border-box;
    }
    .logo-container {
      margin-bottom: 24px;
      text-align: center;
    }
    .logo-container img {
      height: 38px;
      width: auto;
    }
    .badge {
      display: inline-block !important;
      background: rgba(193, 82, 84, 0.08) !important;
      color: var(--staff-red) !important;
      font-size: 0.65rem !important;
      font-weight: 800 !important;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 12px !important;
      border-radius: 9999px !important;
      margin-bottom: 16px !important;
      border: 1px solid rgba(193, 82, 84, 0.15) !important;
    }
    h2 {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--primary);
      margin: 0 0 8px 0;
      text-align: center;
      letter-spacing: -0.02em;
    }
    .view-desc {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.5;
      margin: 0 0 28px 0;
      text-align: center;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrapper input {
      width: 100%;
      padding: 14px 44px 14px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .password-wrapper input:focus {
      border-color: var(--staff-red) !important;
      box-shadow: 0 0 0 4px var(--staff-red-bg) !important;
    }
    .password-wrapper input.field-error {
      border-color: var(--error) !important;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12) !important;
      animation: fieldShake 0.4s both;
    }
    .toggle-password-eye {
      position: absolute;
      right: 16px;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      user-select: none;
    }
    .animated-dropdown-wrapper {
      max-height: 0px;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }
    .animated-dropdown-wrapper.reveal {
      max-height: 200px;
      opacity: 1;
    }
    .strength-indicator {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      margin-bottom: 16px;
      width: 100%;
    }
    .strength-bar {
      height: 4px;
      flex: 1;
      border-radius: 100px;
      background: #e2e8f0;
      transition: background 0.3s ease;
    }
    #reset-status-msg {
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: left;
      display: none;
      line-height: 1.5;
      padding: 12px 14px;
      border-radius: 8px;
    }
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(10, 31, 68, 0.1);
    }
    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .back-to-login {
      display: block;
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
    }
    .back-to-login:hover {
      color: var(--primary);
    }
    @keyframes fieldShake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
      40%, 60% { transform: translate3d(3px, 0, 0); }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="login-card" style="text-align: center;">
      <div class="logo-container">
        <img src="images/logo.png" alt="filings4u Logo" />
      </div>
      <div><span class="badge">Operator Security Hub</span></div>
      
      <h2 id="portal-view-title">Setup Security Password</h2>
      <p id="portal-view-desc" class="view-desc">Establish a permanent encryption access password to secure your compliance records.</p>
      
      <div id="reset-status-msg"></div>

      <form id="passwordResetCommitForm" novalidate>
        <div class="form-group">
          <label class="form-label" id="fieldMainLabel" for="portalUserPassword">New Operator Password</label>
          <div class="password-wrapper">
            <input type="password" id="portalUserPassword" required placeholder="Minimum 8 characters...">
            <i class="fa-solid fa-eye toggle-password-eye" id="fieldMainIcon" data-target="portalUserPassword"></i>
          </div>
          
          <div class="strength-indicator" id="strengthBarContainer">
            <div class="strength-bar" id="strength-1"></div>
            <div class="strength-bar" id="strength-2"></div>
            <div class="strength-bar" id="strength-3"></div>
          </div>
        </div>

        <div class="animated-dropdown-wrapper" id="confirmFieldDropdown">
          <div class="form-group" style="padding-top: 4px;">
            <label class="form-label" for="portalUserPasswordConfirm">Confirm Operator Password</label>
            <div class="password-wrapper">
              <input type="password" id="portalUserPasswordConfirm" required placeholder="Re-type password...">
              <i class="fa-solid fa-eye toggle-password-eye" data-target="portalUserPasswordConfirm"></i>
            </div>
          </div>
        </div>

        <button type="submit" id="resetSubmitBtn" class="btn-submit">Finalize Profile Registration</button>
      </form>

      <a href="admin-login.html" class="back-to-login"><i class="fa-solid fa-arrow-left" style="margin-right: 6px;"></i> Return to Gateway</a>
    </div>
  </div>
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    "use strict";

    // 1. Password Eye Toggle Engine
    const eyeIcons = document.querySelectorAll(".toggle-password-eye");
    eyeIcons.forEach(icon => {
      icon.addEventListener("click", function () {
        const targetId = this.getAttribute("data-target");
        const inputField = document.getElementById(targetId);
        if (inputField) {
          if (inputField.type === "password") {
            inputField.type = "text";
            this.classList.replace("fa-eye", "fa-eye-slash");
          } else {
            inputField.type = "password";
            this.classList.replace("fa-eye-slash", "fa-eye");
          }
        }
      });
    });

    // 2. Realtime Strength Monitor Lights & Dropdown Reveal Script
    const pwdInput = document.getElementById("portalUserPassword");
    const dropdownWrapper = document.getElementById("confirmFieldDropdown");
    const bar1 = document.getElementById("strength-1");
    const bar2 = document.getElementById("strength-2");
    const bar3 = document.getElementById("strength-3");

    if (pwdInput && dropdownWrapper) {
      pwdInput.addEventListener("input", function() {
        if (pwdInput.type !== "password") return;

        const val = pwdInput.value;
        if (val.length > 0) {
          dropdownWrapper.classList.add("reveal");
        } else {
          dropdownWrapper.classList.remove("reveal");
          bar1.style.background = bar2.style.background = bar3.style.background = '';
          return;
        }

        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        if (score === 1) {
          bar1.style.background = 'var(--error)';
          bar2.style.background = bar3.style.background = '';
        } else if (score === 2) {
          bar1.style.background = bar2.style.background = '#f59e0b';
          bar3.style.background = '';
        } else if (score === 3) {
          bar1.style.background = bar2.style.background = bar3.style.background = 'var(--accent)';
        }
      });
    }

    // 3. Core Database Initialization Handshake
    let supabase = window.supabaseInstance || window.supabaseClient;
    if (!supabase || typeof supabase.from !== 'function') {
      const lib = window.supabase || (typeof supabase !== 'undefined' ? supabase : null);
      if (lib && typeof lib.createClient === 'function') {
        supabase = lib.createClient("https://lrbimrlbskjweynxlgas.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyYmltcmxic2tqd2V5bnhsZ2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjQ0NTYsImV4cCI6MjA5NDEwMDQ1Nn0.I8fQ6ZjA9oaTqJCF-7Z7vUboXC8zv2cogBv4PC_1ihU", {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        window.supabaseInstance = supabase; window.supabaseClient = supabase; window.supabase = supabase;
      }
    }

    const formElement = document.getElementById("passwordResetCommitForm");
    const viewTitle = document.getElementById("portal-view-title");
    const viewDescription = document.getElementById("portal-view-desc");
    const statusMessageSlat = document.getElementById("reset-status-msg");
    const actionButtonSubmit = document.getElementById("resetSubmitBtn");
    const passwordConfirmField = document.getElementById("portalUserPasswordConfirm");

    // Detect inbound access token or search routing triggers
    const urlHashParams = new URLSearchParams(window.location.hash.substring(1));
    const isEmailRecoveryCallbackRoute = urlHashParams.has("access_token") || window.location.search.includes("type=recovery");

    // 🟢 ISOLATED ADMIN ROUTER: Mutate directly into an admin-only recovery requester if no link token is found
    if (!isEmailRecoveryCallbackRoute) {
      if (viewTitle) viewTitle.textContent = "Admin Password Recovery";
      if (viewDescription) viewDescription.textContent = "Enter your verified administrative operator email address below to receive an encrypted security key recovery link.";
      if (actionButtonSubmit) actionButtonSubmit.textContent = "Transmit Admin Token ➔";
      
      const mainLabel = document.getElementById("fieldMainLabel");
      if (mainLabel) mainLabel.textContent = "Operator Email Address";

      const mainIcon = document.getElementById("fieldMainIcon");
      if (mainIcon) {
        mainIcon.className = "fa-solid fa-envelope";
        mainIcon.style.cssText = "position:absolute; right:16px; color:#94a3b8; font-size:1rem; cursor:default; user-select:none;";
      }

      if (pwdInput) {
        pwdInput.type = "email";
        pwdInput.placeholder = "name@filings4u.com";
      }

      const strengthContainer = document.getElementById("strengthBarContainer");
      if (strengthContainer) strengthContainer.style.display = "none";
    }

    function displayAlertFeedback(msgText, isErrorState = true) {
      if (!statusMessageSlat) return;
      statusMessageSlat.textContent = msgText;
      statusMessageSlat.style.display = "block";
      statusMessageSlat.style.background = isErrorState ? "var(--error-bg)" : "rgba(16, 185, 129, 0.08)";
      statusMessageSlat.style.color = isErrorState ? "var(--error)" : "var(--accent)";
      statusMessageSlat.style.border = `1px solid ${isErrorState ? "rgba(239,68,68,0.15)" : "rgba(16,185,129,0.15)"}`;
    }

    // Validate authorized staff domain constraints locally before network transmission
    function isAuthorizedStaffDomain(email) {
      const sanitized = email.toLowerCase().trim();
      return sanitized.endsWith("@filings4u.com") || sanitized.endsWith("@roselandcompanies.com");
    }

    if (formElement) {
      formElement.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!statusMessageSlat || !actionButtonSubmit) return;

        statusMessageSlat.style.display = "none";
        if (pwdInput) pwdInput.classList.remove("field-error");
        if (passwordConfirmField) passwordConfirmField.classList.remove("field-error");

        const primaryValue = pwdInput ? pwdInput.value.trim() : "";

        // 🟠 FLOW A: Handle Admin Reset Email Request
        if (!isEmailRecoveryCallbackRoute) {
          if (!primaryValue || !isAuthorizedStaffDomain(primaryValue)) {
            pwdInput?.classList.add("field-error");
            displayAlertFeedback("✕ Access Denied: Please input a verified administrative email address.");
            return;
          }

          actionButtonSubmit.disabled = true;
          actionButtonSubmit.textContent = "Transmitting Request...";

          const { error } = await supabase.auth.resetPasswordForEmail(primaryValue, {
            redirectTo: window.location.origin + window.location.pathname
          });

          actionButtonSubmit.disabled = false;
          actionButtonSubmit.textContent = "Transmit Admin Token ➔";

          if (error) {
            pwdInput?.classList.add("field-error");
            displayAlertFeedback(`✕ Request Rejected: ${error.message}`);
          } else {
            if (formElement) formElement.style.display = "none";
            if (viewDescription) viewDescription.style.display = "none";
            displayAlertFeedback("✅ Recovery token successfully transmitted! Check your internal operator inbox directory for your secure password configuration link.", false);
          }
          return;
        }

        // 🟢 FLOW B: Commit New Admin Password (Token Session Is Live)
        const confirmValue = passwordConfirmField ? passwordConfirmField.value.trim() : "";

        if (primaryValue.length < 8) {
          pwdInput?.classList.add("field-error");
          displayAlertFeedback("✕ Security rule mismatch: password must be at least 8 characters long.");
          return;
        }

        if (primaryValue !== confirmValue) {
          passwordConfirmField?.classList.add("field-error");
          displayAlertFeedback("✕ Field validation mismatch: input values do not match.");
          return;
        }

        actionButtonSubmit.disabled = true;
        actionButtonSubmit.textContent = "Updating Administrative Credentials...";

        const { error } = await supabase.auth.updateUser({ password: primaryValue });

        actionButtonSubmit.disabled = false;
        actionButtonSubmit.textContent = "Finalize Profile Registration";

        if (error) {
          pwdInput?.classList.add("field-error");
          displayAlertFeedback(`✕ Sync Failure: ${error.message}`);
        } else {
          displayAlertFeedback("✅ Security password successfully configured! Redirecting to central control desk dashboard...", false);
          
          // ⚠️ ADMIN REDIRECT OVERRIDE: Routes straight to the administrative dashboard instead of client history!
          setTimeout(() => {
            window.location.href = "admin-dashboard.html";
          }, 2000);
        }
      });
    }
  });
  </script>
</body>
</html>

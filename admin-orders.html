<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10b981">
<title>Orders Management | filings4u Admin</title>
<link href="images/fav.png" rel="icon" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin-orders.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/admin-auth-guard.js"></script>
<script src="assets/js/admin-navigation.js"></script>
</head>
<body data-page="orders">
<div id="adminNavigationMount"></div>

<main>
  <div id="gate" class="gate">Verifying administrator access…</div>
  <section id="app" hidden>
    <div class="head">
      <div>
        <label>OPERATIONS</label>
        <h1>Orders Management</h1>
        <p>Search, review, manage and manually create filings4u orders.</p>
      </div>
      <div class="head-actions">
        <button id="manualOrder" class="primary" type="button">Create manual order</button>
        <button id="refresh" type="button">Refresh orders</button>
      </div>
    </div>

    <div id="stats" class="stats"></div>

    <section class="panel">
      <div class="filters">
        <input id="q" placeholder="Search tracking #, customer, email, company or service">
        <select id="os"><option value="">All order statuses</option></select>
        <select id="ps"><option value="">All payment statuses</option></select>
        <select id="svc"><option value="">All services</option></select>
        <button id="clear" type="button">Clear</button>
      </div>
      <div class="table">
        <table>
          <thead>
            <tr><th>Tracking</th><th>Customer</th><th>Service</th><th>Order</th><th>Payment</th><th>Total</th><th>Created</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <footer>
        <span id="count"></span>
        <div><button id="prev" type="button">Previous</button><span id="page"></span><button id="next" type="button">Next</button></div>
      </footer>
    </section>
  </section>
</main>

<div id="shade" class="shade" hidden></div>

<section id="drawer" class="drawer" aria-hidden="true">
  <div class="drawerHead">
    <div><label>ORDER RECORD</label><h2 id="drawerTitle"></h2></div>
    <button id="close" type="button" aria-label="Close order">×</button>
  </div>
  <div id="detail" class="detailBody"></div>
</section>

<section id="manualComposer" class="manual-composer" aria-hidden="true">
  <div class="drawerHead">
    <div><label>MANUAL ORDER</label><h2>Create order</h2></div>
    <button id="closeManual" type="button" aria-label="Close manual order">×</button>
  </div>

  <form id="manualForm" class="manual-body">
    <section class="box">
      <h3>Customer</h3>
      <div class="manual-grid">
        <label class="wide">Existing client account
          <select id="manualClient">
            <option value="">Unlinked / new customer</option>
          </select>
        </label>
        <label>First name<input id="manualFirst" required></label>
        <label>Last name<input id="manualLast" required></label>
        <label>Email address<input id="manualEmail" type="email" required></label>
        <label>Phone number<input id="manualPhone" type="tel"></label>
        <label class="wide">Company name<input id="manualCompany"></label>
      </div>
    </section>

    <section class="box">
      <h3>Service</h3>
      <div class="manual-grid">
        <label class="wide">Service
          <select id="manualService" required><option value="">Choose a service</option></select>
        </label>
        <label>Plan
          <select id="manualPlan" required>
            <option value="starter">Starter</option>
            <option value="compliance">Compliance</option>
            <option value="enterprise">Enterprise</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <label>Jurisdiction / state<input id="manualState" maxlength="30" placeholder="Optional"></label>
        <label class="wide">Internal order note<textarea id="manualNote" rows="3" placeholder="Optional note about why this manual order was created"></textarea></label>
      </div>
    </section>

    <section class="box">
      <h3>Pricing & payment</h3>
      <div class="payment-choice">
        <label><input type="radio" name="manualPaymentMode" value="paid" checked> Paid order</label>
        <label><input type="radio" name="manualPaymentMode" value="free"> Free / no-charge order</label>
      </div>

      <div class="manual-grid pricing-grid">
        <label>Service fee<input id="manualServiceFee" type="number" min="0" step=".01" value="0"></label>
        <label>Government fee<input id="manualGovernmentFee" type="number" min="0" step=".01" value="0"></label>
        <label>Add-ons<input id="manualAddons" type="number" min="0" step=".01" value="0"></label>
        <label>Order status
          <select id="manualStatus">
            <option value="submitted">Submitted</option>
            <option value="processing" selected>Processing</option>
            <option value="completed">Completed</option>
          </select>
        </label>
      </div>

      <div class="manual-total">
        <span>Order total</span>
        <strong id="manualTotal">$0.00</strong>
        <small id="manualPaymentSummary">Manual paid order</small>
      </div>
    </section>

    <div class="manual-actions">
      <button id="cancelManual" type="button">Cancel</button>
      <button id="createManual" class="primary" type="submit">Create order</button>
    </div>
  </form>
</section>

<div id="toast" class="toast" hidden></div>
<script src="assets/js/admin-orders.js"></script>
</body>
</html>

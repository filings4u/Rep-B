<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10b981"><title>Support Tickets | filings4u Admin</title>
<link href="images/fav.png" rel="icon" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin-support.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-client.js"></script><script src="assets/js/admin-auth-guard.js"></script><script src="assets/js/admin-navigation.js"></script></head><body data-page="support">
<div id="adminNavigationMount"></div>
<main>
  <div id="gate" class="gate">Verifying administrator access…</div>
  <section id="app" hidden>
    <div class="head">
      <div><label>CLIENT SUPPORT OPERATIONS</label><h1>Support Tickets Management</h1><p>Manage client requests, priorities, assignments, responses and internal notes.</p></div>
      <button id="refresh" class="primary" type="button">Refresh tickets</button>
    </div>
    <div id="stats" class="stats"></div>
    <section class="panel">
      <div class="tabs">
        <button class="tab active" type="button" data-tab="active">Support Queue</button>
        <button class="tab" type="button" data-tab="after">After-Hours Queue</button>
      </div>
      <div class="filters">
        <input id="q" placeholder="Search ticket, client, company, tracking # or subject">
        <select id="status"><option value="">All statuses</option></select>
        <select id="priority"><option value="">All priorities</option></select>
        <button id="clear" type="button">Clear</button>
      </div>
      <div class="table">
        <table>
          <thead><tr><th>Ticket</th><th>Client</th><th>Subject</th><th>Priority</th><th>Status</th><th>Assigned</th><th>Updated</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </section>
</main>

<div id="shade" class="shade" hidden></div>
<section id="drawer" class="drawer" aria-hidden="true">
  <div class="drawerHead">
    <div><label>SUPPORT CASE</label><h2 id="drawerTitle"></h2></div>
    <button id="close" type="button" aria-label="Close support case">×</button>
  </div>
  <div id="detail" class="detailBody"></div>
</section>

<div id="toast" class="toast" hidden></div>
<script src="assets/js/admin-support.js"></script>
</body></html>

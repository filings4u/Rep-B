<script>
  (function() {
    "use strict";
    // Define the exact project storage lookup path signature
    const projectUrlHash = "lrbimrlbskjweynxlgas"; 
    const sessionTokenKey = `sb-${projectUrlHash}-auth-token`;
    
    // Synchronously check local storage cache arrays before browser can paint any HTML elements
    const rawSessionJson = localStorage.getItem(sessionTokenKey);
    let isAuthenticated = false;
    let userRole = null;

    if (rawSessionJson) {
      try {
        const sessionData = JSON.parse(rawSessionJson);
        if (sessionData && sessionData.access_token) {
          isAuthenticated = true;
          // Extract nested metadata flags out of JWT payload context securely
          if (sessionData.user && sessionData.user.user_metadata) {
            userRole = sessionData.user.user_metadata.role;
          }
          if (sessionData.user && !userRole && sessionData.user.email) {
            if (sessionData.user.email.toLowerCase().endsWith('@filings4u.com')) {
              userRole = 'admin';
            }
          }
        }
      } catch (e) {
        console.error("Security parsing failure:", e);
      }
    }

    // Determine current view file track rules path parameters
    const pagePathString = window.location.pathname.toLowerCase();
    const isAdminViewPage = pagePathString.includes('/admin-');

    if (!isAuthenticated) {
      // 🚨 CRITICAL REDIRECT: Halt thread and eject out-of-bounds requests immediately
      alert("🔒 Access Denied: Authentication required. Redirecting to secure login desk portal...");
      window.location.replace(isAdminViewPage ? "admin-login.html" : "portal-login.html");
      
      // Inject CSS rule to hide everything in case browser delays routing
      document.documentElement.style.display = "none";
      throw new Error("🔒 Execution Halted: Unauthorized navigation attempt terminated.");
    }

    // Role Enforcement Shield: Blocks non-admins from hitting administrative paths
    if (isAdminViewPage && userRole !== 'admin') {
      alert("🛡️ Security Exception: Restricted Administrative Territory. Access Refused.");
      window.location.replace("client-dashboard.html");
      document.documentElement.style.display = "none";
      throw new Error("🛡️ Execution Halted: Insufficient role permissions clearance.");
    }
  })();
</script>

      <!-- ✅ SECURE CLIENT INTEGRATION SEQUENCE ORDER -->
 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  

  <script src="assets/js/client-navigation.js"></script>

  <script src="assets/js/client-footer.js"></script>


  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      "use strict";

      const kbGridContainer = document.getElementById("knowledgebase-articles-target-window");
      const searchInput = document.getElementById("kbSearchFieldInput");
      let knowledgeArticlesCache = [];

      function runPortalClock() {
        const el = document.getElementById("portal-clock");
        if (el) el.textContent = new Date().toLocaleTimeString();
      }
      setInterval(runPortalClock, 1000);
      runPortalClock();

      // Core Self-Healing Database Handshake
      let client = window.supabaseInstance || window.supabaseClient;
      if (!client || typeof client.from !== 'function') {
        const lib = window.supabase || (typeof supabase !== 'undefined' ? supabase : null);
        if (lib && typeof lib.createClient === 'function') {
          client = lib.createClient("https://lrbimrlbskjweynxlgas.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyYmltcmxic2tqd2V5bnhsZ2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjQ0NTYsImV4cCI6MjA5NDEwMDQ1Nn0.I8fQ6ZjA9oaTqJCF-7Z7vUboXC8zv2cogBv4PC_1ihU", {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
          });
          window.supabaseInstance = client; window.supabaseClient = client; window.supabase = client;
        }
      }

      if (!client || typeof client.from !== 'function') {
        kbGridContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--staff-red); font-weight:700;">✕ System Error: Connection dropped.</div>`;
        return;
      }

      // 🟢 READ PIPELINE: Streams data from knowledge_base_articles or falls back gracefully to blog posts table
      async function streamKnowledgeBaseArticles() {
        try {
          // Attempt query on knowledge base table source
          let { data: articles, error } = await client
            .from('knowledge_base_articles')
            .select('title, category, summary, article_url, id')
            .order('title', { ascending: true });

          // Cross-table mapping fallback: if custom table is unpopulated, siphon records from blog_posts
          if (error || !articles || articles.length === 0) {
            const { data: fallbackPosts } = await client
              .from('blog_posts')
              .select('title, summary, id');
            
            if (fallbackPosts && fallbackPosts.length > 0) {
              articles = fallbackPosts.map(post => ({
                title: post.title,
                category: "Regulatory Update",
                summary: post.summary || "Review recent corporate compliance parameters and filing obligations.",
                article_url: "client-knowledgebase.html#"
              }));
            }
          }

          knowledgeArticlesCache = articles || [];
          renderKnowledgeGridCards(knowledgeArticlesCache);

        } catch (fault) {
          console.error("✕ Knowledgebase sync failure:", fault);
          kbGridContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--staff-red); font-weight:700;">✕ Synchronization Failure: Content engine offline.</div>`;
        }
      }

      // 🟢 RENDER CONTROLLER: Appends beautiful structured UI cards dynamically
      function renderKnowledgeGridCards(articlesArray) {
        if (!articlesArray || articlesArray.length === 0) {
          kbGridContainer.innerHTML = `
            <div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-muted); background:#ffffff; border:1px dashed var(--border-color); border-radius:8px;">
              🔍 No tutorials or resources matched your search string. Try alternative parameters.
            </div>`;
          return;
        }

        kbGridContainer.innerHTML = "";
        articlesArray.forEach((item) => {
          const card = document.createElement("div");
          card.className = "kb-article-card";

          const title = item.title || "Compliance Resource Document";
          const category = item.category || "Filing Manual";
          const description = item.summary || "No abstract descriptor text supplied for this resource file.";
          const targetUrl = item.article_url || "client-knowledgebase.html#";

          card.innerHTML = `
            <div>
              <span class="article-tag">${escapeKbHtml(category)}</span>
              <h4 style="margin: 0 0 8px 0; font-size: 1.05rem; font-weight: 800; color: var(--text-dark); line-height: 1.35;">${escapeKbHtml(title)}</h4>
              <p style="margin: 0; font-size: 0.8rem; color: var(--text-muted); line-height: 1.5;">${escapeKbHtml(description)}</p>
            </div>
            <div>
              <a href="${targetUrl}" class="read-article-btn">Read Help Article ➔</a>
            </div>
          `;
          kbGridContainer.appendChild(card);
        });
      }

      // 🟢 CLIENT-SIDE SEARCH MATRIX: Instant typing filter updates
      if (searchInput) {
        searchInput.addEventListener("input", () => {
          const searchString = searchInput.value.trim().toLowerCase();
          const filteredArticles = knowledgeArticlesCache.filter(item => {
            return (item.title || '').toLowerCase().includes(searchString) || 
                   (item.summary || '').toLowerCase().includes(searchString) ||
                   (item.category || '').toLowerCase().includes(searchString);
          });
          renderKnowledgeGridCards(filteredArticles);
        });
      }
      function escapeKbHtml(s) {
        if (!s) return "";
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      window.toggleSidebarAccordion = function(btn) {
        if (!btn) return;
        const panel = btn.nextElementSibling;
        if (panel) panel.style.display = (panel.style.display === "none" || !panel.style.display) ? "block" : "none";
      };

      document.getElementById("portalLogoutBtn")?.addEventListener("click", () => {
        client.auth.signOut().then(() => { window.localStorage.clear(); window.sessionStorage.clear(); window.location.replace("portal-login.html"); });
      });

      await streamKnowledgeBaseArticles();
    });

      function runPortalClock() {
    const el = document.getElementById("portal-clock");
    if (el) el.textContent = new Date().toLocaleTimeString();
  }
  setInterval(runPortalClock, 1000);
  runPortalClock();
  
  </script>

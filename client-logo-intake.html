<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logo Design Intake | filings4u Portal</title>
    <link rel="icon" type="image/png" href="images/fav.png">
    <meta name="theme-color" content="#10b981">

 <style>
    /* ========================================================================== 🎨 ZERO-CONFLICT SELF-CONTAINED GLOBAL PORTAL MATRIX ========================================================================== */
    :root { --bg-light: #f4f6f9; --white: #ffffff; --border-color: #e2e8f0; --text-dark: #0a1f44; --text-muted: #475569; --emerald: #10b981; --staff-red: #c15254; --sidebar-width: 260px; }
    body, html { margin: 0 !important; padding: 0 !important; min-height: 100vh !important; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important; background-color: var(--bg-light) !important; color: var(--text-dark) !important; overflow-x: hidden !important; overflow-y: auto !important; }
    .dashboard-wrapper { display: flex !important; min-height: 100vh !important; width: 100% !important; position: relative !important; }
    
    /* 📁 LOCKED STATIONARY SIDEBAR PANEL */
    .portal-sidebar { width: var(--sidebar-width) !important; background: var(--white) !important; border-right: 1px solid var(--border-color) !important; display: flex !important; flex-direction: column !important; position: fixed !important; top: 0 !important; left: 0 !important; height: 100vh !important; z-index: 1000 !important; box-sizing: border-box !important; }
    .sidebar-brand-block { padding: 24px 20px !important; border-bottom: 1px solid #f1f5f9 !important; text-align: center !important; box-sizing: border-box !important; }
    .admin-badge { display: inline-block !important; background: rgba(16, 185, 129, 0.08) !important; color: #10b981 !important; font-size: 0.65rem !important; font-weight: 800 !important; text-transform: uppercase !important; letter-spacing: 1px !important; padding: 4px 10px !important; border-radius: 12px !important; margin-top: 6px !important; border: 1px solid rgba(16, 185, 129, 0.15) !important; }
    .sidebar-accordion-menu { flex: 1 !important; overflow-y: auto !important; padding: 15px 12px !important; box-sizing: border-box !important; }
    .accordion-trigger { width: 100% !important; background: #f8fafc !important; border: 1px solid var(--border-color) !important; padding: 10px 14px !important; font-size: 0.72rem !important; font-weight: 700 !important; color: var(--text-muted) !important; text-transform: uppercase !important; letter-spacing: 0.5px !important; display: flex !important; align-items: center !important; justify-content: space-between !important; cursor: pointer !important; border-radius: 6px !important; margin-top: 10px !important; outline: none !important; transition: all 0.2s !important; box-sizing: border-box !important; }
    .accordion-panel { max-height: 0; overflow: hidden !important; padding-left: 4px !important; box-sizing: border-box !important; transition: max-height 0.25s ease-out !important; }
    .nav-item { display: flex !important; align-items: center !important; gap: 8px !important; padding: 8px 12px !important; color: var(--text-muted) !important; text-decoration: none !important; font-size: 0.8rem !important; font-weight: 600 !important; border-radius: 6px !important; margin-top: 2px !important; white-space: nowrap !important; transition: all 0.15s !important; box-sizing: border-box !important; }
    .nav-item:hover { background: rgba(10, 31, 68, 0.02) !important; color: var(--emerald) !important; padding-left: 14px !important; }
    
    .sidebar-footer-lock { padding: 16px !important; border-top: 1px solid var(--border-color) !important; background: #f8fafc !important; box-sizing: border-box !important; }
    .logout-btn { width: 100% !important; background: var(--text-dark) !important; color: white !important; border: none !important; padding: 10px !important; border-radius: 6px !important; font-weight: 700 !important; font-size: 0.8rem !important; cursor: pointer !important; }
    /* 🖥️ PRIMARY CONTENT AREA STRETCH */
    .portal-main { flex: 1 !important; display: flex !important; flex-direction: column !important; margin-left: var(--sidebar-width) !important; width: calc(100% - var(--sidebar-width)) !important; min-height: 100vh !important; box-sizing: border-box !important; }
    .portal-header { background: var(--white) !important; padding: 20px 40px !important; border-bottom: 1px solid var(--border-color) !important; display: flex !important; justify-content: space-between !important; align-items: center !important; position: sticky !important; top: 0 !important; z-index: 90 !important; box-sizing: border-box !important; width: 100% !important; }
    .header-actions-wrapper { display: flex !important; align-items: center !important; gap: 16px !important; }
    .header-clock-pill { background: #f8fafc !important; border: 1px solid var(--border-color) !important; padding: 10px 16px !important; border-radius: 10px !important; font-family: monospace !important; font-size: 0.9rem !important; font-weight: 700 !important; color: var(--text-dark) !important; display: flex !important; align-items: center !important; gap: 8px !important; box-sizing: border-box !important; height: 40px !important; white-space: nowrap !important; }
    .search-input { padding: 10px 14px !important; border: 1px solid var(--border-color) !important; border-radius: 8px !important; font-size: 0.85rem !important; outline: none !important; box-sizing: border-box !important; width: 220px !important; }
    
    .nav-bell-wrapper { position: relative !important; display: inline-block !important; text-decoration: none !important; padding: 6px !important; line-height: 1 !important; }
    .document-vault-download-btn { background: #f1f5f9; color: #334155; border: 1px solid var(--border-color); padding: 5px 10px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; }
    .document-vault-download-btn:hover { background: var(--text-dark); color: white; }
    
    .timeline-event-row { padding: 10px 12px; background: #f8fafc; border: 1px solid var(--border-color); border-radius: 6px; text-align: left; font-size: 0.82rem; }
    .action-alert-strip { padding: 12px; font-size: 0.82rem; font-weight: 700; text-align: left; border-radius: 6px; border: 1px solid rgba(193,82,84,0.15); background: #fef2f2; color: #991b1b; }

</head>
<body>
 <body>
  <div class="dashboard-wrapper">
    <!-- 🖥️ PRIMARY CONTENT AREA -->
    <main class="portal-main">
           <!-- UPGRADED COMPACT TOP NAVIGATION BAR ELEMENT -->
      <header class="portal-header" style="background: #ffffff !important; padding: 12px 40px !important; border-bottom: 1px solid var(--border-color) !important; display: flex !important; justify-content: space-between !important; align-items: center !important; position: sticky !important; top: 0 !important; z-index: 90 !important; box-sizing: border-box !important; width: 100% !important; min-height: 60px !important;">
        <div class="welcome-text" style="display: flex !important; align-items: center !important;">
          <h1 style="margin: 0 !important; font-size: 1.25rem !important; font-weight: 800 !important; color: var(--text-dark) !important; letter-spacing: -0.5px !important;">Welcome Back, <span id="clientNameField" style="color: #10b981 !important;"></span></h1>
        </div>
        
        <div class="header-actions-wrapper" style="display: flex !important; align-items: center !important; gap: 16px !important;">
          <!-- REAL-TIME UNREAD BELL NOTIFICATION BADGE -->

            <a href="#notifications-anchor" id="dashboardBellTriggerBtn" class="nav-bell-wrapper" aria-label="View Account Notifications Feed" style="position: relative !important; display: inline-block !important; text-decoration: none !important; padding: 4px !important; line-height: 1 !important;">
              <span class="nav-bell-icon" style="font-size: 1.15rem !important; cursor: pointer !important;">🔔</span>
              <div id="globalNavUnreadCounterBadge" style="position: absolute !important; top: -2px !important; right: -2px !important; background: #ef4444 !important; color: #ffffff !important; font-size: 0.6rem !important; font-weight: 800 !important; padding: 1px 5px !important; border-radius: 50% !important; line-height: 1 !important; z-index: 10 !important; display: none;">0</div>
            </a>
          </div>
          
          <!-- PORTAL CLOCK SYSTEM CONTAINER -->
          <div class="header-clock-pill" style="background: #f8fafc !important; border: 1px solid var(--border-color) !important; padding: 6px 12px !important; border-radius: 6px !important; font-family: monospace !important; font-size: 0.8rem !important; font-weight: 700 !important; color: var(--text-dark) !important; display: flex !important; align-items: center !important; gap: 6px !important; box-sizing: border-box !important; height: 32px !important; white-space: nowrap !important;">
            <span>⏱️</span>
            <span id="portal-clock">Syncing...</span>
          </div>
          
          <div>
            <input type="text" id="portalGlobalSearchField" class="search-input" placeholder="Search your filings, entities..." style="padding: 6px 12px !important; border: 1px solid var(--border-color) !important; border-radius: 6px !important; font-size: 0.8rem !important; outline: none !important; box-sizing: border-box !important; width: 220px !important; height: 32px !important;">
          </div>
        </div>
      </header>

<!-- 💡 WRAPPER ADDED TO TRIGGER FOOTER INJECTION ENGINE -->
  
  <!-- 🟢 FLUID VIEWPORT WRAPPER: Overrides narrow center-bunching and removes massive top-gap properties completely -->
  <div class="master-portal-wrapper" style="width: 100% !important; padding: 24px 40px; margin: 0 !important; display: block !important; box-sizing: border-box !important;">
    
    <!-- 🟢 FIXED CONTAINER BOUNDS: Clamps maximum physical horizontal scaling width strictly to 1450px -->
    <div class="intake-card" style="width: 100% !important; max-width: 100% !important; margin: 0 auto !important; box-sizing: border-box !important; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 40px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);">
      
      <h1 style="margin: 0; font-size: 1.5rem; font-weight: 850; letter-spacing: -0.025em; color: #0f172a;">Logo & Branding Specification Intake</h1>
      <p class="subtitle-p" style="font-size: 0.875rem; color: #475569; margin: 6px 0 32px 0; line-height: 1.5;">Please supply your localized corporate business models, identity metrics, typography criteria, and icon conceptual definitions below to initialize immediate development queues.</p>
      
      <form id="logoIntakeForm" novalidate style="width: 100% !important; max-width: 100% !important; margin: 0; padding: 0;">
        
        <!-- 🟢 THE FORMAT FIX: Customizes internal row wrapping tracks so inputs expand comfortably without bunching up -->
        <div class="blueprint-form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100% !important; max-width: 100% !important; box-sizing: border-box;">
          
          <!-- 👤 IDENTITY CORE FIELD COUPLING -->
          <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
            <label for="brandClientName" style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #475569;">Your Name</label>
            <input type="text" id="brandClientName" required placeholder="e.g., Jane Doe" style="width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; color: #0f172a; background: #ffffff; box-sizing: border-box; outline: none;">
          </div>
          
          <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
            <label for="brandBusinessName" style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #475569;">Company / Business Name</label>
            <input type="text" id="brandBusinessName" required placeholder="e.g., Acme Corporation" style="width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; color: #0f172a; background: #ffffff; box-sizing: border-box; outline: none;">
          </div>
          
          <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
            <label for="brandEmailAddress" style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #475569;">Email Address</label>
            <input type="email" id="brandEmailAddress" required placeholder="e.g., contact@business.com" style="width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; color: #0f172a; background: #ffffff; box-sizing: border-box; outline: none;">
          </div>
          
          <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
            <label for="brandPhoneNumber" style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #475569;">Phone Number</label>
            <input type="tel" id="brandPhoneNumber" required placeholder="e.g., (555) 019-2834" style="width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; color: #0f172a; background: #ffffff; box-sizing: border-box; outline: none;">
          </div>

          <!-- 📐 DESIGN LAYOUT BLOCK COUPLING -->
          <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
            <label for="logoText" style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #475569;">Exact Wording / Typography Text to Display</label>
            <input type="text" id="logoText" required placeholder="e.g., My Enterprise LLC" style="width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; color: #0f172a; background: #ffffff; box-sizing: border-box; outline: none;">
          </div>
          
          <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
            <label for="logoTagline" style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #475569;">Slogan or Tagline (If Applicable)</label>
            <input type="text" id="logoTagline" placeholder="e.g., Innovation Driven Results" style="width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; color: #0f172a; background: #ffffff; box-sizing: border-box; outline: none;">
          </div>
          
          <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
            <label for="logoStyle" style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #475569;">Branding Style Dimension Preference</label>
            <select id="logoStyle" required style="width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; color: #0f172a; background: #ffffff; box-sizing: border-box; outline: none;">
              <option value="" disabled selected>Select a style layout...</option>
              <option value="Modern Emblem Monogram">Modern Emblem Monogram</option>
              <option value="Clean Minimalist Wordmark">Clean Minimalist Wordmark</option>
              <option value="Abstract Geometric Icon">Abstract Geometric Icon</option>
              <option value="Vintage Corporate Shield">Vintage Corporate Shield</option>
            </select>
          </div>
          
          <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
            <label for="brandMood" style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #475569;">Target Audience Mood Profile</label>
            <select id="brandMood" required style="width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; color: #0f172a; background: #ffffff; box-sizing: border-box; outline: none;">
              <option value="" disabled selected>Select a mood tone...</option>
              <option value="Bold & Energetic">Bold & Energetic</option>
              <option value="Elegant & Luxury">Elegant & Luxury</option>
              <option value="Trustworthy & Professional">Trustworthy & Professional</option>
              <option value="Playful & Creative">Playful & Creative</option>
              <option value="Tech & Futurist">Tech & Futurist</option>
            </select>
          </div>

          <!-- 🎨 🟢 THE FULL-WIDTH EXTENSION FIX: Explicit grid column spans let wide inputs stretch side-to-side cleanly -->
          <div class="form-group full-bleed-span" style="display: flex; flex-direction: column; gap: 8px; grid-column: span 2;">
            <label for="brandColors" style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #475569;">Preferred Brand Color Palette Codes</label>
            <input type="text" id="brandColors" placeholder="e.g., Deep Sapphire Navy (#0F172A), Gold Accent (#D4AF37) — or leave to design desk discretion" style="width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; color: #0f172a; background: #ffffff; box-sizing: border-box; outline: none;">
          </div>
          
          <div class="form-group full-bleed-span" style="display: flex; flex-direction: column; gap: 8px; grid-column: span 2;">
            <label for="logoDescript" style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #475569;">Icon Concept Imagery & Palette Elements</label>
            <textarea id="logoDescript" placeholder="Describe visual components, symbols, elements to omit, or specific geometric traits you prefer..." style="width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; color: #0f172a; background: #ffffff; box-sizing: border-box; outline: none; min-height: 120px; resize: vertical; font-family: inherit;"></textarea>
          </div>
          
          <div class="form-group full-bleed-span" style="display: flex; flex-direction: column; gap: 8px; grid-column: span 2;">
            <label for="competitorLogos" style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: #475569;">Competitor Logo Inspiration Links</label>
            <textarea id="competitorLogos" placeholder="Paste links to design references, competitor brands, or aesthetic directions you like..." style="width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; color: #0f172a; background: #ffffff; box-sizing: border-box; outline: none; min-height: 100px; resize: vertical; font-family: inherit;"></textarea>
          </div>
              <div class="action-row-footer" style="display: flex !important; justify-content: flex-start !important; margin-top: 36px !important; width: 100% !important; box-sizing: border-box !important;">
          <button type="submit" class="submit-btn" id="submitBtn" style="padding: 14px 28px !important; font-size: 0.9rem !important; font-weight: 700 !important; border-radius: 8px !important; background: #0f172a; color: #ffffff; border: none; cursor: pointer; box-shadow: 0 4px 6px rgba(15,23,42,0.15);">Submit Branding Specifications ➔</button>
        </div>
        
      </form>
      <div id="status-msg" class="status-msg" style="display: none; margin-top: 20px; padding: 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600;"></div>
      
    </div> <!-- /intake-card -->
  </div> <!-- /master-portal-wrapper -->
</div> <!-- /portal-main -->

    </main>
  </div>

    <!-- ✅ SECURE CLIENT INTEGRATION SEQUENCE ORDER -->
 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="assets/js/supabase-config.js"></script>
  
  <script src="assets/js/client-master-ledger.js"></script>

  <script src="assets/js/client-navigation.js"></script>

  <script src="assets/js/client-footer.js"></script>


<script>
  document.addEventListener("DOMContentLoaded", async () => {
    "use strict";

    // ⏱️ SYSTEM CLOCK CORE: Real-Time Live Header Update Loop
    const clockPill = document.getElementById("portal-clock");
    function runLiveSystemClock() {
      if (!clockPill) return;
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
      clockPill.textContent = `${dateStr} | ${timeStr}`;
    }
    setInterval(runLiveSystemClock, 1000);
    runLiveSystemClock();

    // 1. Selector Mapping Targets
    const intakeForm = document.getElementById("logoIntakeForm");
    const statusDiv = document.getElementById("status-msg");
    const submitBtn = document.getElementById("submitBtn");

    if (!intakeForm || !statusDiv || !submitBtn) {
      console.error("✕ Critical UI Error: Core branding intake layout form nodes are missing.");
      return;
    }

    function showFeedback(text, isError) {
      statusDiv.textContent = text;
      statusDiv.style.display = "block";
      statusDiv.style.cssText = `display:block; padding:12px; border-radius:8px; font-size:0.85rem; font-weight:700; margin-top:16px; 
        background: ${isError ? "#fef2f2" : "#ecfdf5"}; 
        color: ${isError ? "#991b1b" : "#047857"}; 
        border: 1px solid ${isError ? "rgba(239,68,68,0.12)" : "rgba(16,185,129,0.12)"};`;
    }

    // 2. Safe Database Connection Handshake Link
    let client = window.supabaseInstance || window.supabaseClient;
    if (!client || typeof client.from !== 'function') {
      const lib = window.supabase || (typeof supabase !== 'undefined' ? supabase : null);
      if (lib && typeof lib.createClient === 'function') {
        client = lib.createClient("https://lrbimrlbskjweynxlgas.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyYmltcmxic2tqd2V5bnhsZ2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjQ0NTYsImV4cCI6MjA5NDEwMDQ1Nn0.I8fQ6ZjA9oaTqJCF-7Z7vUboXC8zv2cogBv4PC_1ihU", { 
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } 
        });
        window.supabaseInstance = client; window.supabaseClient = client; window.supabase = client;
      }
    }

    // 3. Form Action Execution Submission Interceptor
    intakeForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusDiv.style.display = "none";

      // Perform strict HTML5 validation checks
      if (!intakeForm.checkValidity()) {
        showFeedback("✕ Validation Error: Please fill out all required specification fields accurately before submitting.", true);
        return;
      }

      const originalBtnLabel = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = "Committing Specifications Matrix...";

      // Autogenerate a clean tracking identifier sequence code
      const generatedTrackingNum = "LOGO-" + Math.floor(100000 + Math.random() * 900000);

      try {
        if (!client || typeof client.from !== 'function') {
          throw new Error("Supabase infrastructure connection engine is unreachable.");
        }

        // Build specification payload mapping directly to public.logo_intakes schema
        const payload = {
          tracking_number: generatedTrackingNum,
          client_name: document.getElementById("brandClientName").value.trim(),
          business_name: document.getElementById("brandBusinessName").value.trim(),
          email_address: document.getElementById("brandEmailAddress").value.trim(),
          phone_number: document.getElementById("brandPhoneNumber").value.trim(),
          logo_text: document.getElementById("logoText").value.trim(),
          logo_tagline: document.getElementById("logoTagline").value.trim() || null,
          logo_style: document.getElementById("logoStyle").value,
          brand_mood: document.getElementById("brandMood").value,
          brand_colors: document.getElementById("brandColors").value.trim(),
          logo_description: document.getElementById("logoDescript").value.trim(),
          competitor_inspiration_links: document.getElementById("competitorLogos").value.trim() || null
        };

        const { error: insertError } = await client
          .from('logo_intakes')
          .insert([payload]);

        if (insertError) throw insertError;

        showFeedback(`✓ Branding Specification Matrix successfully logged! Your tracking sequence number is: [${generatedTrackingNum}]`, false);
        intakeForm.reset();

      } catch (fault) {
        console.error("✕ Transaction process broken:", fault);
        showFeedback(`✕ Transaction Blocked: ${fault.message || "Endpoint payload processing failure."}`, true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalBtnLabel;
      }
    });
  });
</script>

</body>
</html>

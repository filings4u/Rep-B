<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Payment Methods & Billing | filings4u</title>
   <link rel="icon" type="image/png" href="images/fav.png">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-status-bar-style" content="#10b981">
  <meta name="msapplication-navbutton-color" content="#10b981">
  <style>
    :root {
      --bg-light: #f4f6f9;
      --white: #ffffff;
      --border-color: #e2e8f0;
      --text-dark: #0a1f44;
      --text-muted: #475569;
      --emerald: #10b981;
      --sidebar-width: 260px;
    }
    body, html {
      margin: 0 !important; padding: 0 !important;
      min-height: 100vh !important;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
      background-color: var(--bg-light) !important;
      color: var(--text-dark) !important;
    }
    .dashboard-wrapper { display: flex !important; width: 100% !important; }
    .portal-sidebar {
      width: var(--sidebar-width) !important; background: var(--white) !important;
      border-right: 1px solid var(--border-color) !important;
      display: flex !important; flex-direction: column !important;
      position: fixed !important; top: 0 !important; left: 0 !important; height: 100vh !important; z-index: 1000 !important;
    }
    .sidebar-brand-block { padding: 24px 20px !important; border-bottom: 1px solid #f1f5f9 !important; text-align: center !important; }
    .admin-badge { display: inline-block !important; background: rgba(16, 185, 129, 0.08) !important; color: #10b981 !important; font-size: 0.65rem !important; font-weight: 800 !important; text-transform: uppercase; padding: 4px 10px !important; border-radius: 12px !important; border: 1px solid rgba(16, 185, 129, 0.15) !important; }
    .sidebar-accordion-menu { flex: 1 !important; overflow-y: auto !important; padding: 15px 12px !important; }
    .accordion-trigger { width: 100% !important; background: #f8fafc !important; border: 1px solid var(--border-color) !important; padding: 10px 14px !important; font-size: 0.72rem !important; font-weight: 700 !important; color: var(--text-muted) !important; text-transform: uppercase; display: flex !important; align-items: center !important; justify-content: space-between !important; cursor: pointer !important; border-radius: 6px !important; margin-top: 10px !important; }
    .accordion-panel { max-height: 500px; overflow: hidden !important; }
    .nav-item { display: flex !important; align-items: center !important; gap: 8px !important; padding: 8px 12px !important; color: var(--text-muted) !important; text-decoration: none !important; font-size: 0.8rem !important; font-weight: 600 !important; border-radius: 6px !important; margin-top: 2px !important; }
    .nav-item:hover, .nav-item.active { background: rgba(10, 31, 68, 0.02) !important; color: var(--emerald) !important; padding-left: 14px !important; }
    .sidebar-footer-lock { padding: 16px !important; border-top: 1px solid var(--border-color) !important; background: #f8fafc !important; }
    .logout-btn { width: 100% !important; background: var(--text-dark) !important; color: white !important; border: none !important; padding: 10px !important; border-radius: 6px !important; font-weight: 700 !important; font-size: 0.8rem !important; cursor: pointer !important; }
    .portal-main { flex: 1 !important; display: flex !important; flex-direction: column !important; margin-left: var(--sidebar-width) !important; width: calc(100% - var(--sidebar-width)) !important; min-height: 100vh !important; }
    .portal-header { background: var(--white) !important; padding: 12px 40px !important; border-bottom: 1px solid var(--border-color) !important; display: flex !important; justify-content: space-between !important; align-items: center !important; position: sticky !important; top: 0 !important; z-index: 90 !important; min-height: 60px !important; }
    .content-container { padding: 32px 40px !important; box-sizing: border-box !important; }
    .console-card { background: var(--white); border: 1px solid var(--border-color); border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.01); }
    
    /* 💳 BILLING COMPONENT CSS */
    .billing-redirect-btn { display: inline-block; background: var(--text-dark); color: white; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 700; font-size: 0.9rem; margin-top: 16px; border: none; cursor: pointer; }
    .billing-redirect-btn:hover { background: var(--emerald); }
  </style>
</head>
<body>
  <div class="dashboard-wrapper">

          <!-- ✅ SECURE CLIENT INTEGRATION SEQUENCE ORDER -->
 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="assets/js/supabase-config.js"></script>
  
  <script src="assets/js/client-master-ledger.js"></script>

  <script src="assets/js/client-navigation.js"></script>

  <script src="assets/js/client-footer.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      "use strict";

      const portalBtn = document.getElementById("stripePortalRedirectBtn");
      const errorStrip = document.getElementById("billing-error-feedback-strip");

      function runPortalClock() {
        const el = document.getElementById("portal-clock");
        if (el) el.textContent = new Date().toLocaleTimeString();
      }
      setInterval(runPortalClock, 1000);
      runPortalClock();

      // Core Self-Healing Database Handshake
      let client = window.supabaseInstance || window.supabaseClient;
      if (!client || typeof client.from !== 'function') {
        const lib = window.supabase || (typeof supabase !== 'undefined' ? supabase : null);
        if (lib && typeof lib.createClient === 'function') {
          client = lib.createClient("https://lrbimrlbskjweynxlgas.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyYmltcmxic2tqd2V5bnhsZ2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjQ0NTYsImV4cCI6MjA5NDEwMDQ1Nn0.I8fQ6ZjA9oaTqJCF-7Z7vUboXC8zv2cogBv4PC_1ihU", {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
          });
          window.supabaseInstance = client; window.supabaseClient = client; window.supabase = client;
        }
      }

      if (!client || typeof client.from !== 'function') {
        portalBtn.innerText = "Billing Gateway Offline";
        return;
      }

      let sessionObj = null;
      try {
        const { data: { session } } = await client.auth.getSession();
        if (session) sessionObj = session;
      } catch (e) {}

      if (!sessionObj) {
        const token = localStorage.getItem("filings4u_secure_session_token") || localStorage.getItem("supabase.auth.token");
        if (token) {
          try { const p = JSON.parse(token); sessionObj = p.currentSession || p; } catch(err) {}
        }
      }

      if (!sessionObj || !sessionObj.user) {
        window.location.href = "portal-login.html";
        return;
      }

      // Ready State UI Release
      if (portalBtn) {
        portalBtn.disabled = false;
        portalBtn.innerText = "Launch Customer Billing Portal ➔";
      }

      // 🟢 STRIPE SECTIONS GATEWAY INVOKER: Connects straight to your Stripe Webhook Edge Worker
      portalBtn.addEventListener("click", async () => {
        portalBtn.disabled = true;
        portalBtn.innerText = "Generating Access Session URL...";
        errorStrip.style.display = "none";

        try {
          // Invoking your custom edge manager worker, requesting self-service redirect paths
          const { data, error } = await client.functions.invoke("stripe-webhook", {
            body: {
              action: "create_portal_session", // Direct flag tells edge handler to skip mail loops and return urls
              customer_email: sessionObj.user.email,
              return_url: window.location.href
            }
          });

          if (error) throw error;

          if (data && data.portal_url) {
            console.log("✅ Billing link created completely. Launching tunnel routing context...");
            window.location.href = data.portal_url;
          } else {
            throw new Error("Edge handler did not return an accurate secure URL object path context mapping.");
          }

        } catch (fault) {
          console.error("✕ Failed to compile Stripe customer portal link session:", fault);
          
          // Clean UI Fallback: If your edge function isn't fully configured to return session links yet, fall back gracefully
          errorStrip.innerText = "ℹ️ Notice: Self-service management configurations are pending setup. Your billing statements are available under Invoices & Statements.";
          errorStrip.style.display = "block";
          portalBtn.disabled = false;
          portalBtn.innerText = "Launch Customer Billing Portal ➔";
        }
      });
      window.toggleSidebarAccordion = function(btn) {
        if (!btn) return;
        const panel = btn.nextElementSibling;
        if (panel) panel.style.display = (panel.style.display === "none" || !panel.style.display) ? "block" : "none";
      };

      document.getElementById("portalLogoutBtn")?.addEventListener("click", () => {
        client.auth.signOut().then(() => { window.localStorage.clear(); window.sessionStorage.clear(); window.location.replace("portal-login.html"); });
      });
    });
  </script>
</body>
</html>

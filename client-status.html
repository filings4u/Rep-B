<script>
document.addEventListener("DOMContentLoaded", () => {
  "use strict";

  // Replace with your real project connection credentials
  const SUPABASE_URL = "https://lrbimrlbskjweynxlgas.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyYmltcmxic2tqd2V5bnhsZ2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjQ0NTYsImV4cCI6MjA5NDEwMDQ1Nn0.I8fQ6ZjA9oaTqJCF-7Z7vUboXC8zv2cogBv4PC_1ihU";
  const client = window.supabaseInstance || window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const lookupBtn = document.getElementById("clientLookupBtn");
  const searchInput = document.getElementById("clientSearchToken");
  const portfolioContainer = document.getElementById("portfolioGridContainer");
  const errorBox = document.getElementById("clientErrorBox");

  // Sync real-time portal widget clock
  function runPortalClock() {
    const clockElement = document.getElementById("portal-clock");
    if (clockElement) {
      clockElement.textContent = new Date().toLocaleTimeString();
    }
  }
  setInterval(runPortalClock, 1000);
  runPortalClock();

  // Parse token straight out of URL parameter routing (?token=XYZ) if active
  const urlParamToken = new URLSearchParams(window.location.search).get("token");
  if (urlParamToken) {
    searchInput.value = urlParamToken;
    executePortfolioLookup(urlParamToken);
  }

  lookupBtn.addEventListener("click", () => {
    executePortfolioLookup(searchInput.value.trim());
  });

  async function executePortfolioLookup(token) {
    if (!token) return;

    errorBox.style.display = "none";
    errorBox.textContent = "";
    portfolioContainer.innerHTML = ""; // Clear active viewport workspace nodes

    try {
      // Query every row tracking file mapped to this client token identifier identity
      const { data, error } = await client
        .from("client_statuses")
        .select("*")
        .eq("tracking_number", token)
        .order("created_at", { ascending: false });

      if (error) throw error;

      if (!data || data.length === 0) {
        errorBox.textContent = "✕ Identification Notice: No active project accounts or processing files were found matching that parameter.";
        errorBox.style.display = "block";
        return;
      }

      // Loop through arrays data parameters to construct separate interface element blocks
      data.forEach((record) => {
        const percentage = Math.min(Math.max(parseInt(record.progress_percentage, 10) || 0, 0), 100);
        
        // Define clean conditional context badge status color layers
        const isFinished = percentage === 100 || record.current_status.toLowerCase().includes("finalized") || record.current_status.toLowerCase().includes("complete");
        const pillClass = isFinished ? "pill-completed" : "pill-production";

        // Determine if it is a downloadable file item or a design production sprint stream
        const isFiling = record.service_type.toLowerCase().includes("filing") || record.service_type.toLowerCase().includes("document");
        
        let dynamicActionElement = "";

        if (isFiling && isFinished) {
          // Deliver write-protected deep routing path directly straight into your compliance verification vault downloads engine page
          dynamicActionElement = `
            <a href="client-compliance.html?token=${encodeURIComponent(record.tracking_number)}" class="vault-redirect-btn">
              📥 Access Corporate Vault Records ➔
            </a>
          `;
        } else if (isFiling) {
          dynamicActionElement = `
            <div class="remarks-notice-box" style="border-left-color: var(--staff-red);">
              ⏳ <strong>Filing Processing Bounds Status:</strong> Your statutory legal paperwork sets have been dispatched to state systems. Vault downloads open instantly upon processing checkout clearance verification.
            </div>
          `;
        } else {
          // Deliver live progress monitoring tracks for Web Layouts, Graphics, Monograms, and Custom Code
          dynamicActionElement = `
            <div style="width: 100%;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <label style="font-size: 0.68rem; font-weight: 700; color: var(--text-muted); margin: 0;">Production Sprint Progression Track</label>
                <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-dark);">${percentage}%</span>
              </div>
              <div class="project-progress-track">
                <div class="project-progress-fill" style="width: ${percentage}%;"></div>
              </div>
            </div>
          `;
        }

        // Compile full multi-column portfolio asset layout strings cards properties block
        const cardHtmlString = `
          <div class="service-status-card">
            <div class="card-top-meta-row">
              <div>
                <h3 class="service-title-text">${record.service_type}</h3>
                <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Account: ${record.company_name}</span>
              </div>
              <span class="live-milestone-pill ${pillClass}">${record.current_status}</span>
            </div>

            <div class="ledger-metrics-grid">
              <div class="ledger-column"><span class="lbl">Primary Assignee</span><span class="val">${record.client_name}</span></div>
              <div class="ledger-column"><span class="lbl">Tracking Code</span><span class="val" style="font-family: monospace;">${record.tracking_number}</span></div>
              <div class="ledger-column"><span class="lbl">Last Update Sync</span><span class="val">${new Date(record.updated_at).toLocaleDateString()}</span></div>
            </div>

            <div class="remarks-notice-box">
              <strong>Latest Desk Remarks:</strong> ${record.status_notes || "Your operational files are active within our processing environment queue. Milestones register instantly upon desk checkouts."}
            </div>

            ${dynamicActionElement}
          </div>
        `;

        portfolioContainer.insertAdjacentHTML("beforeend", cardHtmlString);
      });

    } catch (fault) {
      console.error(fault);
      errorBox.textContent = "✕ Network Interface Error: Remote ledger synchronization failure occurred. Please re-try again.";
      errorBox.style.display = "block";
    }
  }
});
</script>

        <button type="button" id="modalDismissComplianceCloseBtn" style="background: #cbd5e1 !important; color: var(--text-dark) !important; border: none !important; padding: 0 14px !important; border-radius: 6px !important; font-weight: 700 !important; font-size: 0.85rem !important; cursor: pointer !important; height: 42px !important; box-sizing: border-box !important;">Close Window</button>
        <button type="submit" id="modalComplianceSubmitBtn" class="chat-action-btn" style="width: 100% !important; margin: 0 !important; height: 42px !important; box-sizing: border-box !important;">Save Profile & Unlock Chat</button>
      </div>

    </form>
  </div>
</div>

    </main>
  </div>

  
      <!-- ✅ SECURE CLIENT INTEGRATION SEQUENCE ORDER -->
  
  <script src="assets/js/client-navigation.js"></script>

  <script src="assets/js/client-footer.js"></script>



<!-- ==========================================================================
     ⚙️ REAL-TIME SUPPORT DESK WORKSPACE CONTROLLER CORE
     ========================================================================== -->
<script>
document.addEventListener("DOMContentLoaded", function() {
  "use strict";

  // 1. Resolve Frontend Container DOM Interface Viewports
  const statusStrip = document.getElementById("status-strip-notification");
  const chatWrapper = document.getElementById("liveChatWorkspacePanel");
  const ticketPane = document.getElementById("afterHoursTicketFormPanel");
  const msgLogBox = document.getElementById("clientChatMessagesLog");
  const textInputField = document.getElementById("clientChatMessageInputField");
  const sendButton = document.getElementById("clientChatSendButton");
  const paperclipBtn = document.getElementById("chatPaperclipTriggerBtn");
  const hiddenFileInput = document.getElementById("chatHiddenBinaryFileInputElement");
  const previewBar = document.getElementById("chatUploadPreviewBar");
  const previewString = document.getElementById("chatUploadPreviewFileNameString");
  const cancelUploadBtn = document.getElementById("chatCancelUploadBtn");

  // State Management Scopes (Attached explicitly to window for global cross-block access)
  let liveChatReplicationChannel = null;
  window.activeStagedFilePayload = null; 
  window.clientActiveUserId = "";
  window.clientEmail = "";

  // Visual XSS markup sanitizer helper tool
  window.escapeClientChatMarkup = function(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#x27;");
  };

  // Safe window canvas scroll manager utility
  window.scrollChatTimelineToAbsoluteBottom = function() {
    if (msgLogBox) msgLogBox.scrollTop = msgLogBox.scrollHeight;
  };

  // --- MAIN REHYDRATION BOOT SEQUENCE ENGINE ---
  async function runSupportCenterBootstrap() {
    // Resolve core Supabase client connection instance safely
    const client = window.supabaseInstance || window.supabaseClient;
    if (!client || typeof client.from !== 'function') {
      if (msgLogBox) {
        msgLogBox.innerHTML = `<div style="text-align:center; padding:24px; color:var(--staff-red); font-weight:700;">✕ Connection Failure: Supabase framework infrastructure is missing.</div>`;
      }
      return;
    }

    try {
      // Authenticate Active User Session Workspace Layers
      const { data: { session }, error: sessionError } = await client.auth.getSession();
      if (sessionError || !session) {
        window.location.href = "portal-login.html";
        return;
      }

      window.clientActiveUserId = String(session.user.id).trim();
      window.clientEmail = String(session.user.email).trim().toLowerCase();

      // Execute dynamic workspace panel parameters calculations
      if (typeof evaluateSupportDeskWorkingHours === "function") {
        evaluateSupportDeskWorkingHours();
      }

      // Fire profile compliance gate validation check
      if (typeof autofillUserProfileMetrics === "function") {
        await autofillUserProfileMetrics(client);
      }

      // Trigger chat pipeline streams if workspace layout is active
      if (chatWrapper && chatWrapper.style.display !== "none") {
        if (typeof streamClientChatTimelineLogs === "function") await streamClientChatTimelineLogs(client);
        if (typeof establishRealtimeChatSynchronization === "function") await establishRealtimeChatSynchronization(client);
      }

    } catch (e) {
      console.error("✕ Support Portal Boot Error:", e.message);
      if (msgLogBox) {
        msgLogBox.innerHTML = `<div style="text-align:center; padding:30px; color:var(--staff-red); font-weight:700;">⚠️ Timeline Connection Interrupted: ${e.message}</div>`;
      }
    }
  }

  // Trigger the bootstrap engine immediately on load
  runSupportCenterBootstrap();

   // --- STAGE 1: DYNAMIC OPERATING BUSINESS HOURS SWITCH ENGINE ---
  window.evaluateSupportDeskWorkingHours = function() {
    const rightNow = new Date();
    const currentDay = rightNow.getDay();
    const currentHour = rightNow.getHours();
    const isBusinessDay = currentDay >= 1 && currentDay <= 5;
    const isWorkingHour = currentHour >= 9 && currentHour < 19; // 9:00 AM - 7:00 PM

    const statusPulseDot = document.querySelector(".status-pulse-dot");
    const stripTextTarget = document.getElementById("status-strip-text-target");

    if (statusStrip) statusStrip.style.display = "flex";

    if (isBusinessDay && isWorkingHour) {
      if (statusStrip) statusStrip.style.cssText = "padding:14px 16px; border-radius:8px; font-size:0.85rem; font-weight:700; margin-bottom:24px; display:flex; align-items:center; gap:10px; background:#e6f4ea; color:#137333; border:1px solid #cbd5e1;";
      if (statusPulseDot) statusPulseDot.style.background = "#137333";
      if (stripTextTarget) stripTextTarget.innerHTML = `<strong>Live Systems Status: Help Desk Active.</strong> Instant real-time messaging layers are unlocked.`;
      if (chatWrapper) chatWrapper.style.setProperty("display", "flex", "important");
      if (ticketPane) ticketPane.style.setProperty("display", "none", "important");
    } else {
      if (statusStrip) statusStrip.style.cssText = "padding:14px 16px; border-radius:8px; font-size:0.85rem; font-weight:700; margin-bottom:24px; display:flex; align-items:center; gap:10px; background:#fff3cd; color:#856404; border:1px solid #cbd5e1;";
      if (statusPulseDot) statusPulseDot.style.background = "#856404";
      if (stripTextTarget) stripTextTarget.innerHTML = `<strong>Live Systems Status: Desk Standby.</strong> Technicians respond within 12h. Please file a structured support ticket.`;
      if (chatWrapper) chatWrapper.style.setProperty("display", "none", "important");
      if (ticketPane) ticketPane.style.setProperty("display", "block", "important");
    }
  };

// --- STAGE 2: GLOBAL STATE & FORM INITIALIZATION (FIXED) ---
const complianceForm = document.getElementById("forcedIdentityComplianceSubmissionForm");
const modalSubmitBtn = document.getElementById("modalComplianceSubmitBtn");

if (modalSubmitBtn && complianceForm) {
  modalSubmitBtn.addEventListener("click", async (e) => {
    // Execute native HTML constraint checking using our newly injected form node
    if (!complianceForm.checkValidity()) {
      complianceForm.reportValidity();
      return;
    }
    e.preventDefault();

    const clientRef = window.supabaseInstance || window.supabaseClient;
    const errorBanner = document.getElementById("complianceFormErrorAlertBanner");
    if (errorBanner) errorBanner.style.display = "none";

    // Stop execution safely if initialization parameters are still loading from the session guard
    if (!window.clientActiveUserId || !window.clientEmail) {
      if (errorBanner) {
        errorBanner.textContent = "✕ Sync Latency: Validating active session token. Please try again.";
        errorBanner.style.display = "block";
      }
      return;
    }

    modalSubmitBtn.disabled = true;
    modalSubmitBtn.textContent = "Processing Profile... ⚙️";

    // 🟢 FIXED: Maps fields exactly to your HTML input IDs and your public.client_profiles constraints
    const newFields = {
      id: window.clientActiveUserId, 
      email_address: window.clientEmail,
      first_name: document.getElementById("setupFirstName").value.trim(),
      last_name: document.getElementById("setupLastName").value.trim(),
      phone_number: document.getElementById("setupPhoneNumber").value.trim(),
      street_address: document.getElementById("setupStreetAddress").value.trim(),
      city: document.getElementById("setupCity").value.trim(),
      state: document.getElementById("setupState").value.trim(),
      zip_code: document.getElementById("setupZipCode").value.trim(),
      updated_at: new Date().toISOString()
    };

    try {
      console.log("💾 [Compliance Gate] Upserting parameters matching database constraints...", newFields);
      
      const { error: upsertError } = await clientRef
        .from('client_profiles')
        .upsert([newFields], { onConflict: 'id' });

      if (upsertError) throw upsertError;

      // Sync local window identity cache strings
      window.activeUserFirstNameCache = newFields.first_name;
      window.activeUserLastNameCache = newFields.last_name;

      const complianceModal = document.getElementById("forcedProfileComplianceModalMask");
      if (complianceModal) complianceModal.style.setProperty("display", "none", "important");
      
      window.location.reload();

    } catch (upsertError) {
      console.error("✕ Compliance Workspace Unlock Failed:", upsertError.message);
      
      if (errorBanner) {
        errorBanner.textContent = `✕ Database Error: ${upsertError.message}`;
        errorBanner.style.display = "block";
      }
      // Re-enable button state so user can fix and re-try
      modalSubmitBtn.disabled = false;
      modalSubmitBtn.textContent = "Save Profile & Unlock Chat";
    }
  });
}

document.getElementById("modalDismissComplianceCloseBtn")?.addEventListener("click", () => {
  window.location.replace("client-dashboard.html");
});


  // --- STAGE 2: PROFILE LOOKUP DATA-STORE HYDRATOR & COMPLIANCE GATE ---
  window.autofillUserProfileMetrics = async function(client) {
    console.log(`📡 [Contact Ingestion Engine] Scanning client registry for user email: [${window.clientEmail}]`);
    
    let compiledPhone = "";
    let compiledFirstName = "";
    let compiledLastName = "";
    let compiledCompanyName = "Not Specified";
    let compiledStreet = "";
    let compiledCity = "";
    let compiledState = "";
    let compiledZip = "";

    const { data: profile, error: lookupError } = await client
      .from('client_profiles')
      .select('first_name, last_name, phone_number, company_name, street_address, city, state, zip_code')
      .eq('email_address', window.clientEmail)
      .maybeSingle();

    if (lookupError) throw lookupError;

    if (profile) {
      compiledPhone = String(profile.phone_number || "").trim();
      compiledFirstName = String(profile.first_name || "").trim();
      compiledLastName = String(profile.last_name || "").trim();
      compiledCompanyName = String(profile.company_name || "Not Specified").trim();
      compiledStreet = String(profile.street_address || "").trim();
      compiledCity = String(profile.city || "").trim();
      compiledState = String(profile.state || "").trim();
      compiledZip = String(profile.zip_code || "").trim();

      // Cache names to window space for use by other engines (like chat dispatch)
      window.activeUserFirstNameCache = compiledFirstName;
      window.activeUserLastNameCache = compiledLastName;
      window.activeUserCompanyNameCache = compiledCompanyName;
    }

    const isProfileIncomplete = !compiledFirstName || !compiledLastName || !compiledPhone || !window.clientEmail;

    if (isProfileIncomplete) {
      console.warn("⚠️ [Compliance Gate] Incomplete identification metadata block caught.");
      if (chatWrapper) chatWrapper.style.setProperty("display", "none", "important");
      
      const complianceModal = document.getElementById("forcedProfileComplianceModalMask");
      if (complianceModal) complianceModal.style.setProperty("display", "flex", "important");
      
      const setupEmailField = document.getElementById("setupEmailAddress");
      if (setupEmailField) setupEmailField.value = window.clientEmail;
      return; // Exit execution. Handled by the decoupled global submit listener.
    }

    // 🟢 FIXED: Safe conditional verification card hydration checks
    const transmissionCard = document.getElementById("profileTransmissionDataCard");
    const stringTarget = document.getElementById("profileHandshakeVerificationString");
    
    if (transmissionCard && stringTarget) {
      transmissionCard.style.display = "block";
      stringTarget.innerHTML = `
        NAME    : ${window.escapeClientChatMarkup(compiledFirstName)} ${window.escapeClientChatMarkup(compiledLastName)}<br>
        EMAIL   : ${window.escapeClientChatMarkup(window.clientEmail)}<br>
        PHONE   : ${window.escapeClientChatMarkup(compiledPhone)}<br>
        COMPANY : ${window.escapeClientChatMarkup(compiledCompanyName)}<br>
        ADDRESS : ${window.escapeClientChatMarkup(compiledStreet)}, ${window.escapeClientChatMarkup(compiledCity)}, ${window.escapeClientChatMarkup(compiledState)} ${window.escapeClientChatMarkup(compiledZip)}
      `.trim();
    }

    // Set backup offline ticket input elements value references safely
    const fIn = document.getElementById("ticketFirstName");
    const lIn = document.getElementById("ticketLastName");
    const eIn = document.getElementById("ticketEmailAddress");
    const pIn = document.getElementById("ticketPhoneNumber");

    if (eIn) eIn.value = window.clientEmail;
    if (fIn) fIn.value = compiledFirstName;
    if (lIn) lIn.value = compiledLastName;
    if (pIn) pIn.value = compiledPhone;

    // Enforce read-only constraint parameters onto your forms fields
    [eIn, fIn, lIn, pIn].forEach(f => {
      if (f) f.disabled = true;
    });

    window.activeUserCompanyNameCache = compiledCompanyName;
    window.activeUserFirstNameCache = compiledFirstName;
    window.activeUserLastNameCache = compiledLastName;
  };

   // --- STAGE 3: CHAT HISTORY LOGS OVER THE WIRE ---
  window.streamClientChatTimelineLogs = function(client) {
    return new Promise(async (resolve, reject) => {
      try {
        const { data: messages, error: fetchError } = await client
          .from('chat_messages')
          .select('*')
          .eq('id', window.clientActiveUserId)
          .order('created_at', { ascending: true });

        if (fetchError) throw fetchError;

        const targetLogBox = document.getElementById("clientChatMessagesLog");
        if (targetLogBox) targetLogBox.innerHTML = "";

        if (messages && messages.length > 0) {
          messages.forEach(msgRow => {
            if (typeof window.appendSingleChatMessageBubbleToUI === "function") {
              window.appendSingleChatMessageBubbleToUI(msgRow);
            }
          });
        } else {
          // 🟢 FIXED: Fallback runtime layout placeholder to completely prevent infinite database duplication insertion loops
          const systemWelcomePayload = {
            id: window.clientActiveUserId,
            email_address: window.clientEmail,
            message_content: "Welcome to filings4u Corporate Support Desk! An asset specialist has been assigned to your entity file. Please state your query below.",
            sender_type: 'admin',
            created_at: new Date().toISOString()
          };
          if (typeof window.appendSingleChatMessageBubbleToUI === "function") {
            window.appendSingleChatMessageBubbleToUI(systemWelcomePayload);
          }
        }
        window.scrollChatTimelineToAbsoluteBottom();
        resolve();
      } catch (err) {
        console.error("✕ Failed loading chat timelines:", err.message);
        reject(err);
      }
    });
  };

  // --- STAGE 4: REAL-TIME WEBSOCKET SUBSCRIPTIONS ---
  window.establishRealtimeChatSynchronization = function(client) {
    if (liveChatReplicationChannel) liveChatReplicationChannel.unsubscribe();

    console.log(`📡 [Realtime Sync] Establishing websocket listener channel for: ${window.clientEmail}`);

    liveChatReplicationChannel = client
      .channel(`isolated-client-chat-stream-${window.clientActiveUserId}`)
      // 🟢 FIXED: Listening globally and matching client variables locally to bypass Supabase UUID filter indexing limitations
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => {
        const incomingPayload = payload.new;
        if (incomingPayload && String(incomingPayload.id).trim() === String(window.clientActiveUserId).trim()) {
          if (typeof window.appendSingleChatMessageBubbleToUI === "function") {
            window.appendSingleChatMessageBubbleToUI(incomingPayload);
          }
          window.scrollChatTimelineToAbsoluteBottom();
        }
      })
      .subscribe();
  };

  // --- STAGE 5: OUTBOUND DISPATCH HANDLERS & ACTIONS ---
  window.dispatchClientChatMessage = async function() {
    const clientRef = window.supabaseInstance || window.supabaseClient;
    const inputField = document.getElementById("clientChatMessageInputField");
    const submitBtn = document.getElementById("clientChatSendButton");
    const uploadBar = document.getElementById("chatUploadPreviewBar");
    const rawText = inputField ? inputField.value.trim() : "";

    if (!rawText && !window.activeStagedFilePayload) return;

    if (inputField) inputField.disabled = true;
    if (submitBtn) submitBtn.disabled = true;

    let resolvedAssetUrlPath = null;
    let targetedBucketKeyIdentifier = "chat_documents";

    try {
      if (window.activeStagedFilePayload) {
        const fileType = window.activeStagedFilePayload.type.toLowerCase();
        targetedBucketKeyIdentifier = fileType.startsWith("image/") ? "chat_attachments" : "chat_documents";
        
        const fingerprint = `${Date.now()}_${window.activeStagedFilePayload.name}`;
        
        const { data: uploadOutput, error: uploadError } = await clientRef.storage
          .from(targetedBucketKeyIdentifier)
          .upload(`${window.clientActiveUserId}/${fingerprint}`, window.activeStagedFilePayload);

        if (uploadError) throw uploadError;
        resolvedAssetUrlPath = uploadOutput.path;
      }

      // 🟢 FIXED: Matches your unified table columns exactly
      const { error: insertError } = await clientRef
        .from('chat_messages')
        .insert([{
          id: window.clientActiveUserId, 
          email_address: window.clientEmail,
          message_content: rawText || `Attachment uploaded: ${window.activeStagedFilePayload?.name}`,
          sender_type: 'client', 
          attached_file_url: resolvedAssetUrlPath || null,
          is_read_by_admin: false,
          is_read_by_client: true,
          created_at: new Date().toISOString()
        }]);

      if (insertError) throw insertError;

      if (inputField) inputField.value = "";
      window.activeStagedFilePayload = null;
      if (uploadBar) uploadBar.style.display = "none";

    } catch (postFault) {
      console.error("✕ Database Chat Insertion Failed:", postFault.message);
    } finally {
      if (inputField) {
        inputField.disabled = false;
        inputField.focus();
      }
      if (submitBtn) submitBtn.disabled = false;
      window.scrollChatTimelineToAbsoluteBottom();
    }
  };

  // --- STAGE 6: OFFLINE FORM INTERCEPT OVERRIDES ---
  document.getElementById("structuredSupportTicketForm")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const clientRef = window.supabaseInstance || window.supabaseClient;
    const submitFormBtn = e.target.querySelector('button[type="submit"]');
    const messageInput = document.getElementById("ticketMessagePayload");
    const fNameVal = document.getElementById("ticketFirstName")?.value || "";
    const lNameVal = document.getElementById("ticketLastName")?.value || "";
    const phoneVal = document.getElementById("ticketPhoneNumber")?.value || "";

    if (!messageInput || !messageInput.value.trim() || !clientRef) return;
    submitFormBtn.disabled = true;

    try {
      const rightNow = new Date();
      const currentHour = rightNow.getHours();
      const currentDay = rightNow.getDay();
      const isWorkingHour = currentDay >= 1 && currentDay <= 5 && currentHour >= 9 && currentHour < 19;

      if (isWorkingHour) {
        const { error: insertError } = await clientRef.from('chat_messages').insert([{
          id: window.clientActiveUserId,
          email_address: window.clientEmail,
          message_content: messageInput.value.trim(),
          sender_type: 'client',
          is_read_by_admin: false,
          is_read_by_client: true,
          created_at: new Date().toISOString()
        }]);
        if (insertError) throw insertError;
      } else {
        // 🟢 FIXED: Conforms perfectly to your updated public.after_hours_tickets table schema definitions
        const { error: ticketError } = await clientRef.from('after_hours_tickets').insert([{
          id: window.clientActiveUserId, 
          email_address: window.clientEmail,
          ticket_message: messageInput.value.trim(),
          status: 'Pending',
          created_at: new Date().toISOString()
        }]);
        if (ticketError) throw ticketError;
      }

      const ticketPanelCard = document.getElementById("afterHoursTicketFormPanel");
      if (ticketPanelCard) {
        ticketPanelCard.innerHTML = `
          <div style="text-align:center; padding:20px 0;">
            <h3 style="color:#0a1f44; font-weight:800; margin-bottom:8px;">📥 Support Ticket Filed Safely</h3>
            <p style="font-size:0.85rem; color:#64748b; margin-bottom:16px;">Our desk engineers have been alerted and will process your request.</p>
            <button id="ticketReturnHomeDashboardBtn" style="background:#0a1f44; color:#fff; border:none; padding:8px 16px; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.8rem; box-shadow:0 2px 4px rgba(10,31,68,0.15);">Return to Dashboard Home</button>
          </div>`;
          
        document.getElementById("ticketReturnHomeDashboardBtn")?.addEventListener("click", () => {
          window.location.replace("client-dashboard.html");
        });
      }
    } catch (err) {
      console.error("✕ Form Submission Error:", err.message);
      alert(`Submission Failed: ${err.message}`);
    } finally {
      if (submitFormBtn) submitFormBtn.disabled = false;
    }
  });

  // 🟢 FIXED: Target index [0] of the file selection array directly to prevent DOM compilation freeze crashes
  if (paperclipBtn && hiddenFileInput) {
    paperclipBtn.addEventListener("click", () => hiddenFileInput.click());
    hiddenFileInput.addEventListener("change", function() {
      if (this.files && this.files.length > 0) {
        window.activeStagedFilePayload = this.files[0]; 
        if (previewBar && previewString) {
          previewString.textContent = `📎 Attachment Ready: ${window.activeStagedFilePayload.name}`;
          previewBar.style.display = "flex";
        }
      }
    });
  }


  if (cancelUploadBtn) {
    cancelUploadBtn.addEventListener("click", () => {
      window.activeStagedFilePayload = null;
      if (hiddenFileInput) hiddenFileInput.value = "";
      if (previewBar) previewBar.style.display = "none";
    });
  }

  // BIND KEYBOARD ACCELERATORS
  textInputField?.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      window.dispatchClientChatMessage();
    }
  });

  if (sendButton) {
    sendButton.addEventListener("click", () => {
      window.dispatchClientChatMessage();
    });
  }

  // --- PRODUCTION INITIALIZATION TRIGGER ---
  function verifyAndRunBootstrap() {
    const clientInstance = window.supabaseInstance || window.supabaseClient;
    // If Supabase hasn't initialized yet, poll for it every 100ms
    if (!clientInstance || typeof clientInstance.from !== 'function') {
      console.warn("⏳ Waiting for Supabase framework layers to clear infrastructure initialization...");
      setTimeout(verifyAndRunBootstrap, 100);
      return;
    }
    // Once found, launch the engine safely
    runSupportCenterBootstrap();
  }

  // Kick off the checker loop safely
  verifyAndRunBootstrap();
});


// --- STAGE 7: RENDER SINGLE MESSAGE BUBBLE IN CONVERSATION CANVAS TIMELINE ---
window.appendSingleChatMessageBubbleToUI = function(msgRow) {
  const targetLogBox = document.getElementById("clientChatMessagesLog");
  if (!targetLogBox || !msgRow) return;

  const isClient = String(msgRow.sender_type).toLowerCase() === 'client';
  const bubbleWrapper = document.createElement("div");
  
  bubbleWrapper.style.cssText = `
    display: flex; 
    width: 100%; 
    justify-content: ${isClient ? 'flex-end' : 'flex-start'}; 
    margin-bottom: 14px;
    box-sizing: border-box;
  `;

  const innerBubble = document.createElement("div");
  innerBubble.style.cssText = `
    max-width: 70%; 
    padding: 12px 16px; 
    border-radius: 12px; 
    font-size: 0.85rem; 
    line-height: 1.45;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    background: ${isClient ? '#0a1f44' : '#f1f5f9'}; 
    color: ${isClient ? '#ffffff' : '#1e293b'};
    border-bottom-${isClient ? 'right' : 'left'}-radius: 2px;
  `;

  // Render text contents safely
  const textParagraph = document.createElement("p");
  textParagraph.style.cssText = "margin: 0; white-space: pre-wrap;";
  textParagraph.textContent = msgRow.message_content || "";
  innerBubble.appendChild(textParagraph);

  // If a file attachment path exists inside your chat storage bucket asset array, unpack it
  if (msgRow.attached_file_url) {
    const clientRef = window.supabaseInstance || window.supabaseClient;
    const bucket = msgRow.attached_file_url.includes('chat_attachments') ? 'chat_attachments' : 'chat_documents';
    
    // Construct the authentic storage delivery link
    const publicUrl = clientRef.storage.from(bucket).getPublicUrl(msgRow.attached_file_url).data.publicUrl;
    
    const attachmentBox = document.createElement("div");
    attachmentBox.style.cssText = "margin-top: 8px; border-top: 1px dashed rgba(0,0,0,0.1); padding-top: 6px; font-size: 0.75rem;";
    
    if (bucket === 'chat_attachments') {
      attachmentBox.innerHTML = `
        <a href="${publicUrl}" target="_blank">
          <img src="${publicUrl}" alt="Attachment" style="max-width: 100%; max-height: 180px; border-radius: 6px; margin-top: 4px; display: block; border: 1px solid #cbd5e1;"/>
        </a>`;
    } else {
      attachmentBox.innerHTML = `
        <a href="${publicUrl}" target="_blank" style="color: ${isClient ? '#38bdf8' : '#0284c7'}; font-weight: 700; text-decoration: underline;">
          📎 View Secure Document Attachment ➔
        </a>`;
    }
    innerBubble.appendChild(attachmentBox);
  }

  bubbleWrapper.appendChild(innerBubble);
  targetLogBox.appendChild(bubbleWrapper);
};

</script>
</body>

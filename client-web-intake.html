<script>
  (function() {
    "use strict";
    // Define the exact project storage lookup path signature
    const projectUrlHash = "lrbimrlbskjweynxlgas"; 
    const sessionTokenKey = `sb-${projectUrlHash}-auth-token`;
    
    // Synchronously check local storage cache arrays before browser can paint any HTML elements
    const rawSessionJson = localStorage.getItem(sessionTokenKey);
    let isAuthenticated = false;
    let userRole = null;

    if (rawSessionJson) {
      try {
        const sessionData = JSON.parse(rawSessionJson);
        if (sessionData && sessionData.access_token) {
          isAuthenticated = true;
          // Extract nested metadata flags out of JWT payload context securely
          if (sessionData.user && sessionData.user.user_metadata) {
            userRole = sessionData.user.user_metadata.role;
          }
          if (sessionData.user && !userRole && sessionData.user.email) {
            if (sessionData.user.email.toLowerCase().endsWith('@filings4u.com')) {
              userRole = 'admin';
            }
          }
        }
      } catch (e) {
        console.error("Security parsing failure:", e);
      }
    }

    // Determine current view file track rules path parameters
    const pagePathString = window.location.pathname.toLowerCase();
    const isAdminViewPage = pagePathString.includes('/admin-');

    if (!isAuthenticated) {
      // 🚨 CRITICAL REDIRECT: Halt thread and eject out-of-bounds requests immediately
      alert("🔒 Access Denied: Authentication required. Redirecting to secure login desk portal...");
      window.location.replace(isAdminViewPage ? "admin-login.html" : "portal-login.html");
      
      // Inject CSS rule to hide everything in case browser delays routing
      document.documentElement.style.display = "none";
      throw new Error("🔒 Execution Halted: Unauthorized navigation attempt terminated.");
    }

    // Role Enforcement Shield: Blocks non-admins from hitting administrative paths
    if (isAdminViewPage && userRole !== 'admin') {
      alert("🛡️ Security Exception: Restricted Administrative Territory. Access Refused.");
      window.location.replace("client-dashboard.html");
      document.documentElement.style.display = "none";
      throw new Error("🛡️ Execution Halted: Insufficient role permissions clearance.");
    }
  })();
</script>

                  <option value="Yes">Yes, logo files are finalized and available</option>
                  <option value="No - Create one">No, include logo layout design within production queue</option>
                  <option value="No - Do not create one">No, text representation is fine, do not design vectors</option>
                </select>
              </div>
              <div class="form-group full-bleed-span" id="group-webLogoUrl" style="display: none !important;">
                <label for="webLogoUrl">Link to finalized corporate logo file assets</label>
                <input type="text" id="webLogoUrl" placeholder="Paste link to shared drive logo graphic source files (.SVG, .EPS, high-res .PNG)...">
              </div>

              <div class="form-group full-bleed-span">
                <label for="webNotes">Additional operational constraints, third-party integrations, or special layout requirements</label>
                <textarea id="webNotes" placeholder="Provide any information about legacy software migrations, structural design deadlines, hosting preferences, single-sign-on requirements..."></textarea>
              </div>

            </div> <!-- /blueprint-form-grid -->

            <!-- INTERACTION BOTTOM ACTIONS ROW FOOTER -->
            <div class="action-row-footer">
              <button type="submit" class="submit-btn" id="submitBtn">Commit Web Specifications Matrix ➔</button>
            </div>
          </form>
          
          <div id="status-msg" class="status-msg"></div>
        </div> <!-- /intake-card -->
      </div> <!-- /content-container -->

    </main>
  </div>


      <!-- ✅ SECURE CLIENT INTEGRATION SEQUENCE ORDER -->
 
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
  <script src="assets/js/client-master-ledger.js"></script>

  <script src="assets/js/client-navigation.js"></script>

  <script src="assets/js/client-footer.js"></script>


 <script>
  document.addEventListener("DOMContentLoaded", () => {
    "use strict";

    // 🟢 CLOCK SYSTEM ENGINE: Real-Time Live Header Update Loop
    const clockPill = document.getElementById("portal-clock");
    function updateSystemClock() {
      if (!clockPill) return;
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
      const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
      clockPill.textContent = `${dateStr} | ${timeStr}`;
    }
    setInterval(updateSystemClock, 1000);
    updateSystemClock();

    const intakeForm = document.getElementById("webIntakeForm");
    const statusDiv = document.getElementById("status-msg");
    const submitBtn = document.getElementById("submitBtn");

    // Dropdown Toggles
    const selectSiteType = document.getElementById("webSiteType");
    const groupSiteTypeOther = document.getElementById("group-webSiteTypeOther");
    const selectBranding = document.getElementById("webBrandingStatus");
    const groupBrandAssets = document.getElementById("group-webBrandAssets");
    const selectStyle = document.getElementById("webStyleDirection");
    const groupStyleOther = document.getElementById("group-webStyleDirectionOther");
    const selectLogo = document.getElementById("webLogoStatus");
    const groupLogoUrl = document.getElementById("group-webLogoUrl");
    const featureCheckboxes = document.getElementsByName("webFeatures");
    const groupFeaturesOther = document.getElementById("group-webFeaturesOther");

    // Unified conditional element management loop
    function bindConditionalToggle(triggerEl, targetEl, matchingValue) {
      if (!triggerEl || !targetEl) return;
      triggerEl.addEventListener("change", function() {
        if (this.value === matchingValue) {
          targetEl.style.cssText = "display: flex !important; grid-column: span 2 / auto !important;";
        } else {
          targetEl.style.cssText = "display: none !important;";
        }
      });
    }

    bindConditionalToggle(selectSiteType, groupSiteTypeOther, "Other");
    bindConditionalToggle(selectBranding, groupBrandAssets, "Yes");
    bindConditionalToggle(selectStyle, groupStyleOther, "Other");
    bindConditionalToggle(selectLogo, groupLogoUrl, "Yes");

    if (featureCheckboxes.length > 0 && groupFeaturesOther) {
      featureCheckboxes.forEach(checkbox => {
        checkbox.addEventListener("change", () => {
          const otherBox = Array.from(featureCheckboxes).find(cb => cb.value === "Other");
          if (otherBox && otherBox.checked) {
            groupFeaturesOther.style.cssText = "display: flex !important; grid-column: span 2 / auto !important;";
          } else {
            groupFeaturesOther.style.cssText = "display: none !important;";
          }
        });
      });
    }

    function showFeedback(text, isError) {
      if (!statusDiv) return;
      statusDiv.textContent = text;
      statusDiv.style.display = "block";
      statusDiv.style.cssText = `display:block; padding:12px; border-radius:8px; font-size:0.85rem; font-weight:700; margin-top:16px; background: ${isError ? "#fef2f2" : "#ecfdf5"}; color: ${isError ? "#991b1b" : "#047857"}; border: 1px solid ${isError ? "rgba(239,68,68,0.12)" : "rgba(16,185,129,0.12)"};`;
    }

    const client = window.supabaseInstance || window.supabaseClient;

    if (intakeForm) {
      intakeForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!statusDiv || !submitBtn) return;

        if (!intakeForm.checkValidity()) {
          showFeedback("✕ Validation Error: Please fill out all required form fields before tracking.", true);
          return;
        }

        const checkedFeatures = Array.from(featureCheckboxes)
          .filter(cb => cb.checked)
          .map(cb => cb.value);

        if (checkedFeatures.length === 0) {
          showFeedback("✕ Validation Error: Please check at least one structural feature element requirement.", true);
          return;
        }

        const originalBtnLabel = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = "Committing Specifications Matrix...";

        const generatedTrackingNum = "WEB-" + Math.floor(100000 + Math.random() * 900000);

        try {
          const payload = {
            tracking_number: generatedTrackingNum,
            business_name: document.getElementById("webBusinessName").value.trim(),
            client_name: document.getElementById("webClientName").value.trim(),
            email_address: document.getElementById("webEmailAddress").value.trim(),
            phone_number: document.getElementById("webPhoneNumber").value.trim(),
            current_url: document.getElementById("webCurrentUrl").value.trim() || null,
            website_type: selectSiteType.value,
            website_type_other: selectSiteType.value === "Other" ? document.getElementById("webSiteTypeOther").value.trim() : null,
            main_goal: document.getElementById("webMainGoal").value.trim(),
            target_audience: document.getElementById("webTargetAudience").value.trim(),
            branding_status: selectBranding.value,
            brand_assets_links: selectBranding.value === "Yes" ? document.getElementById("webBrandAssets").value.trim() : null,
            style_preference: selectStyle.value,
            style_preference_other: selectStyle.value === "Other" ? document.getElementById("webStyleDirectionOther").value.trim() : null,
            aesthetic_tone: document.getElementById("webAesthetic").value.trim(),
            design_inspiration_links: document.getElementById("webInspirationUrls").value.trim() || null,
            required_features: checkedFeatures,
            required_features_other: checkedFeatures.includes("Other") ? document.getElementById("webFeaturesOther").value.trim() : null,
            estimated_page_count: document.getElementById("webPageCount").value.trim(),
            asset_copy_status: document.getElementById("webCopyStatus").value,
            logo_status: selectLogo.value,
            logo_asset_url: selectLogo.value === "Yes" ? document.getElementById("webLogoUrl").value.trim() : null,
            architectural_notes: document.getElementById("webNotes").value.trim() || "No extra data parameters logged."
          };

          if (!client) throw new Error("Supabase gateway configuration reference is uninitialized.");

          const { error: insertError } = await client
            .from('web_intakes')
            .insert([payload]);

          if (insertError) throw insertError;

          showFeedback(`✓ Specification Matrix written! Tracking sequence ID number: [${generatedTrackingNum}]`, false);
          intakeForm.reset();

          [groupSiteTypeOther, groupBrandAssets, groupStyleOther, groupFeaturesOther, groupLogoUrl].forEach(el => {
            if (el) el.style.cssText = "display: none !important;";
          });

        } catch (fault) {
          console.error("✕ Transaction error:", fault);
          showFeedback(`✕ Transaction Blocked: ${fault.message || "Endpoint payload processing failure."}`, true);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalBtnLabel;
        }
      });
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
:root {
  --bg-light: #f8fafc;
  --white: #ffffff;
  --border-color: #e2e8f0;
  --text-dark: #0f172a;
  --text-muted: #64748b;
  --staff-red: #c15254;
  --emerald: #10b981;
}

body, html {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-light);
  color: var(--text-dark);
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

.master-portal-wrapper {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 40px 24px;
  box-sizing: border-box;
  flex: 1 0 auto;
}

.intake-card {
  background: var(--white);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 44px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.03);
  box-sizing: border-box;
  width: 100%;
}

.brand-logo img {
  height: 38px;
  width: auto;
  margin-bottom: 24px;
  display: block;
}

h1 {
  font-size: 1.6rem;
  font-weight: 800;
  margin: 0 0 8px 0;
  color: var(--text-dark);
  letter-spacing: -0.02em;
}

.subtitle-p {
  font-size: 0.88rem;
  color: var(--text-muted);
  margin: 0 0 36px 0;
  line-height: 1.6;
}

.blueprint-form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  column-gap: 32px;
  row-gap: 24px;
  margin-bottom: 36px;
  width: 100%;
  box-sizing: border-box;
}

.form-group {
  display: flex;
  flex-direction: column;
  width: 100%;
  box-sizing: border-box;
}

.full-bleed-span {
  grid-column: 1 / -1;
}

label {
  display: block;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  color: var(--text-dark);
}

input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 0.88rem;
  color: var(--text-dark);
  background: #f8fafc;
  outline: none;
  box-sizing: border-box;
  font-family: inherit;
  height: 44px;
  transition: background 0.15s ease, border-color 0.15s ease;
}

textarea {
  height: 120px;
  resize: vertical;
}

input:focus, select:focus, textarea:focus {
  background: var(--white);
  border-color: var(--staff-red);
  box-shadow: 0 0 0 4px rgba(193, 82, 84, 0.05);
}

.submit-btn {
  padding: 0 32px;
  background: var(--text-dark);
  color: var(--white);
  border: none;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
  box-sizing: border-box;
  height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

.submit-btn:hover {
  background: #1e293b;
}

.submit-btn:active {
  transform: scale(0.99);
}

.action-row-footer {
  display: flex;
  justify-content: flex-end;
  width: 100%;
  box-sizing: border-box;
  margin-top: 12px;
}

.status-msg {
  display: none;
  font-size: 0.85rem;
  font-weight: 600;
  text-align: left;
  margin-top: 20px;
  padding: 12px;
  border-radius: 6px;
  line-height: 1.4;
}

@keyframes structuralFieldShake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}

.invalid-shake-trigger {
  animation: structuralFieldShake 0.4s ease-in-out !important;
}

.invalid-shake-trigger input, 
.invalid-shake-trigger select, 
.invalid-shake-trigger textarea {
  border-color: var(--staff-red) !important;
  box-shadow: 0 0 0 4px rgba(193, 82, 84, 0.15) !important;
}

@media screen and (max-width: 1024px) {
  .blueprint-form-grid {
    grid-template-columns: 1fr !important;
    row-gap: 20px !important;
    column-gap: 0px !important;
  }
  .blueprint-form-grid > div {
    grid-column: span 1 / auto !important;
  }
  .intake-card {
    padding: 28px;
  }
  .action-row-footer {
    justify-content: stretch;
  }
  .submit-btn {
    width: 100% !important;
  }
}
</style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="assets/js/supabase-config.js"></script>
  
  <script src="assets/js/client-master-ledger.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      "use strict";

      // ⏱️ SYSTEM CLOCK CORE: Real-Time Live Header Update Loop
      const clockPill = document.getElementById("portal-clock");
      function runLiveSystemClock() {
        if (!clockPill) return;
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
        const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
        clockPill.textContent = `${dateStr} | ${timeStr}`;
      }
      setInterval(runLiveSystemClock, 1000);
      runLiveSystemClock();

      // 1. Selector Mapping Targets
      const intakeForm = document.getElementById("logoIntakeForm");
      const statusDiv = document.getElementById("status-msg");
      const submitBtn = document.getElementById("submitBtn");

      if (!intakeForm || !statusDiv || !submitBtn) {
        console.error("✕ Critical UI Error: Core branding intake layout form nodes are missing.");
        return;
      }

      function showFeedback(text, isError) {
        statusDiv.textContent = text;
        statusDiv.style.display = "block";
        statusDiv.style.cssText = `display:block; padding:12px; border-radius:8px; font-size:0.85rem; font-weight:700; margin-top:16px; 
          background: ${isError ? "#fef2f2" : "#ecfdf5"}; 
          color: ${isError ? "#991b1b" : "#047857"}; 
          border: 1px solid ${isError ? "rgba(239,68,68,0.12)" : "rgba(16,185,129,0.12)"};`;
      }

      // 2. Safe Database Connection Handshake Link
      let client = window.supabaseInstance || window.supabaseClient;
      if (!client || typeof client.from !== 'function') {
        const lib = window.supabase || (typeof supabase !== 'undefined' ? supabase : null);
        if (lib && typeof lib.createClient === 'function') {
          client = lib.createClient("https://lrbimrlbskjweynxlgas.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyYmltcmxic2tqd2V5bnhsZ2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjQ0NTYsImV4cCI6MjA5NDEwMDQ1Nn0.I8fQ6ZjA9oaTqJCF-7Z7vUboXC8zv2cogBv4PC_1ihU", { 
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } 
          });
          window.supabaseInstance = client; window.supabaseClient = client; window.supabase = client;
        }
      }

      // 3. Form Action Execution Submission Interceptor
      intakeForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        statusDiv.style.display = "none";

        // Perform strict HTML5 validation checks
        if (!intakeForm.checkValidity()) {
          showFeedback("✕ Validation Error: Please fill out all required specification fields accurately before submitting.", true);
          return;
        }

        const originalBtnLabel = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = "Committing Specifications Matrix...";

        // Autogenerate a clean tracking identifier sequence code
        const generatedTrackingNum = "LOGO-" + Math.floor(100000 + Math.random() * 900000);

        try {
          if (!client || typeof client.from !== 'function') {
            throw new Error("Supabase infrastructure connection engine is unreachable.");
          }

          // Build specification payload mapping directly to public.logo_intakes schema
          const payload = {
            tracking_number: generatedTrackingNum,
            client_name: document.getElementById("brandClientName").value.trim(),
            business_name: document.getElementById("brandBusinessName").value.trim(),
            email_address: document.getElementById("brandEmailAddress").value.trim(),
            phone_number: document.getElementById("brandPhoneNumber").value.trim(),
            logo_text: document.getElementById("logoText").value.trim(),
            logo_tagline: document.getElementById("logoTagline").value.trim() || null,
            logo_style: document.getElementById("logoStyle").value,
            brand_mood: document.getElementById("brandMood").value,
            brand_colors: document.getElementById("brandColors").value.trim(),
            logo_description: document.getElementById("logoDescript").value.trim(),
            competitor_inspiration_links: document.getElementById("competitorLogos").value.trim() || null
          };

          const { error: insertError } = await client
            .from('logo_intakes')
            .insert([payload]);

          if (insertError) throw insertError;

          showFeedback(`✓ Branding Specification Matrix successfully logged! Your tracking sequence number is: [${generatedTrackingNum}]`, false);
          intakeForm.reset();

        } catch (fault) {
          console.error("✕ Transaction process broken:", fault);
          showFeedback(`✕ Transaction Blocked: ${fault.message || "Endpoint payload processing failure."}`, true);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalBtnLabel;
        }
      });
    });
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logo Design Intake | filings4u Portal</title>
    <link rel="icon" type="image/png" href="images/fav.png">
    <meta name="theme-color" content="#10b981">

    <style>
:root {
  --bg-light: #f8fafc;
  --white: #ffffff;
  --border-color: #e2e8f0;
  --text-dark: #0f172a;
  --text-muted: #64748b;
  --staff-red: #c15254;
  --emerald: #10b981;
}

body, html {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-light);
  color: var(--text-dark);
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

.master-portal-wrapper {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 40px 24px;
  box-sizing: border-box;
  flex: 1 0 auto;
}

.intake-card {
  background: var(--white);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 44px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.03);
  box-sizing: border-box;
  width: 100%;
}

.brand-logo img {
  height: 38px;
  width: auto;
  margin-bottom: 24px;
  display: block;
}

h1 {
  font-size: 1.6rem;
  font-weight: 800;
  margin: 0 0 8px 0;
  color: var(--text-dark);
  letter-spacing: -0.02em;
}

.subtitle-p {
  font-size: 0.88rem;
  color: var(--text-muted);
  margin: 0 0 36px 0;
  line-height: 1.6;
}

.blueprint-form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  column-gap: 32px;
  row-gap: 24px;
  margin-bottom: 36px;
  width: 100%;
  box-sizing: border-box;
}

.form-group {
  display: flex;
  flex-direction: column;
  width: 100%;
  box-sizing: border-box;
}

.full-bleed-span {
  grid-column: 1 / -1;
}

label {
  display: block;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  color: var(--text-dark);
}

input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 0.88rem;
  color: var(--text-dark);
  background: #f8fafc;
  outline: none;
  box-sizing: border-box;
  font-family: inherit;
  height: 44px;
  transition: background 0.15s ease, border-color 0.15s ease;
}

textarea {
  height: 120px;
  resize: vertical;
}

input:focus, select:focus, textarea:focus {
  background: var(--white);
  border-color: var(--staff-red);
  box-shadow: 0 0 0 4px rgba(193, 82, 84, 0.05);
}

.submit-btn {
  padding: 0 32px;
  background: var(--text-dark);
  color: var(--white);
  border: none;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
  box-sizing: border-box;
  height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

.submit-btn:hover {
  background: #1e293b;
}

.submit-btn:active {
  transform: scale(0.99);
}

.action-row-footer {
  display: flex;
  justify-content: flex-end;
  width: 100%;
  box-sizing: border-box;
  margin-top: 12px;
}

.status-msg {
  display: none;
  font-size: 0.85rem;
  font-weight: 600;
  text-align: left;
  margin-top: 20px;
  padding: 12px;
  border-radius: 6px;
  line-height: 1.4;
}

@keyframes structuralFieldShake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}

.invalid-shake-trigger {
  animation: structuralFieldShake 0.4s ease-in-out !important;
}

.invalid-shake-trigger input, 
.invalid-shake-trigger select, 
.invalid-shake-trigger textarea {
  border-color: var(--staff-red) !important;
  box-shadow: 0 0 0 4px rgba(193, 82, 84, 0.15) !important;
}

@media screen and (max-width: 1024px) {
  .blueprint-form-grid {
    grid-template-columns: 1fr !important;
    row-gap: 20px !important;
    column-gap: 0px !important;
  }
  .blueprint-form-grid > div {
    grid-column: span 1 / auto !important;
  }
  .intake-card {
    padding: 28px;
  }
  .action-row-footer {
    justify-content: stretch;
  }
  .submit-btn {
    width: 100% !important;
  }
}
</style>
</head>
<body>

<!-- 💡 WRAPPER ADDED TO TRIGGER FOOTER INJECTION ENGINE --> 
<div class="portal-main" style="display: flex; flex-direction: column; min-height: 100vh; width: 100%;"> 
  <!-- MASTER OUTER WRAPPER CONTAINER PANE --> 
  <div class="master-portal-wrapper"> 
    <div class="intake-card"> 
      <div class="brand-logo">
        <img src="https://supabase.co" alt="filings4u Logo">
      </div>
      <h1>Logo & Branding Specification Intake</h1>
      <p class="subtitle-p">Please supply your localized corporate business models, identity metrics, typography criteria, and icon conceptual definitions below to initialize immediate development queues.</p>
      
      <form id="logoIntakeForm" novalidate>
        <div class="blueprint-form-grid">
          
          <!-- 👤 IDENTITY CORE FIELD COUPLING -->
          <div class="form-group">
            <label for="brandClientName">Your Name</label>
            <input type="text" id="brandClientName" required placeholder="e.g., Jane Doe">
          </div>

          <div class="form-group">
            <label for="brandBusinessName">Company / Business Name</label>
            <input type="text" id="brandBusinessName" required placeholder="e.g., Acme Corporation">
          </div>

          <div class="form-group">
            <label for="brandEmailAddress">Email Address</label>
            <input type="email" id="brandEmailAddress" required placeholder="e.g., contact@business.com">
          </div>

          <div class="form-group">
            <label for="brandPhoneNumber">Phone Number</label>
            <input type="tel" id="brandPhoneNumber" required placeholder="e.g., (555) 019-2834">
          </div>

          <!-- 📐 DESIGN LAYOUT BLOCK COUPLING -->
          <div class="form-group">
            <label for="logoText">Exact Wording / Typography Text to Display</label>
            <input type="text" id="logoText" required placeholder="e.g., My Enterprise LLC">
          </div>
          
          <div class="form-group">
            <label for="logoTagline">Slogan or Tagline (If Applicable)</label>
            <input type="text" id="logoTagline" placeholder="e.g., Innovation Driven Results">
          </div>

          <div class="form-group">
            <label for="logoStyle">Branding Style Dimension Preference</label>
            <select id="logoStyle" required>
              <option value="" disabled selected>Select a style layout...</option>
              <option value="Modern Emblem Monogram">Modern Emblem Monogram</option>
              <option value="Clean Minimalist Wordmark">Clean Minimalist Wordmark</option>
              <option value="Abstract Geometric Icon">Abstract Geometric Icon</option>
              <option value="Vintage Corporate Shield">Vintage Corporate Shield</option>
            </select>
          </div>

          <div class="form-group">
            <label for="brandMood">Target Audience Mood Profile</label>
            <select id="brandMood" required>
              <option value="" disabled selected>Select a mood tone...</option>
              <option value="Bold & Energetic">Bold & Energetic</option>
              <option value="Elegant & Luxury">Elegant & Luxury</option>
              <option value="Trustworthy & Professional">Trustworthy & Professional</option>
              <option value="Playful & Creative">Playful & Creative</option>
              <option value="Tech & Futurist">Tech & Futurist</option>
            </select>
          </div>

          <div class="form-group full-bleed-span">
            <label for="brandColors">Preferred Brand Color Palette Codes</label>
            <input type="text" id="brandColors" required placeholder="e.g., Deep Sapphire Navy (#0F172A), Gold Accent (#D4AF37) — or leave to design desk discretion">
          </div>

          <div class="form-group full-bleed-span">
            <label for="logoDescript">Icon Concept Imagery & Palette Elements</label>
            <textarea id="logoDescript" required placeholder="Describe visual components, symbols, elements to omit, or specific geometric traits you prefer..."></textarea>
          </div>

          <div class="form-group full-bleed-span">
            <label for="competitorLogos">Competitor Logo Inspiration Links</label>
            <textarea id="competitorLogos" placeholder="Paste links to design references, competitor brands, or aesthetic directions you like..."></textarea>
          </div>
        </div>

        <!-- LOWER RIGHT BUTTON ACTION BLOCK -->
        <div class="action-row-footer">
          <button type="submit" class="submit-btn" id="submitBtn">Submit Branding Specifications ➔</button>
        </div>
      </form>
      <div id="status-msg" class="status-msg"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/client-footer.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  "use strict";

  const logoForm = document.getElementById("logoIntakeForm");
  const submitBtn = document.getElementById("submitBtn");
  const statusMsg = document.getElementById("status-msg");

  if (!logoForm || !statusMsg || !submitBtn) {
    throw new Error("✕ Critical UI Error: Form wrapper tree elements are missing from the page canvas.");
  }

  const urlParams = new URLSearchParams(window.location.search);
  const trackingToken = urlParams.get("token") || localStorage.getItem("f4u_active_tracking_token") || "GUEST-INTAKE";

  let client = window.supabaseInstance || window.supabaseClient;

  if (!client && typeof window.supabase !== 'undefined') {
    const SUPABASE_URL = 'https://lrbimrlbskjweynxlgas.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyYmltcmxic2tqd2V5bnhsZ2FzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjQ0NTYsImV4cCI6MjA5NDEwMDQ1Nn0.I8fQ6ZjA9oaTqJCF-7Z7vUboXC8zv2cogBv4PC_1ihU'; 
    
    if (SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY') {
      client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  }

  logoForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    statusMsg.style.display = "none";
    statusMsg.textContent = "";

    // 1. Run container shake validation loops across active required inputs
    let isFormValid = true;
    const itemsToVerify = logoForm.querySelectorAll("input[required], select[required], textarea[required]");

    itemsToVerify.forEach((input) => {
      const parentContainer = input.closest(".form-group");
      if (parentContainer) {
        parentContainer.classList.remove("invalid-shake-trigger");
      }

      if (input.id === "competitorLogos") {
        return;
      }

      if (!input.value.trim()) {
        isFormValid = false;
        if (parentContainer) {
          void parentContainer.offsetWidth; // Force a DOM element repaint cycle
          parentContainer.classList.add("invalid-shake-trigger");
        }
      }
    });

    if (!isFormValid) {
      return; 
    }

    // 2. Extract values cleanly from form fields
    const clientName = document.getElementById("brandClientName").value.trim();
    const businessName = document.getElementById("brandBusinessName").value.trim();
    const emailAddress = document.getElementById("brandEmailAddress").value.trim();
    const phoneNumber = document.getElementById("brandPhoneNumber").value.trim();
    
    const logoText = document.getElementById("logoText").value.trim();
    const tagline = document.getElementById("logoTagline").value.trim() || "N/A";
    const styleType = document.getElementById("logoStyle").value;
    const audienceMood = document.getElementById("brandMood").value;
    const colorPalette = document.getElementById("brandColors").value.trim();
    const description = document.getElementById("logoDescript").value.trim();
    const competitorLinks = document.getElementById("competitorLogos").value.trim() || "N/A";

    const originalBtnText = submitBtn.textContent;
    submitBtn.textContent = "Processing Branding Records...";
    submitBtn.disabled = true;

    try {
      console.log(`📡 [Logo Intake Engine] Syncing branding parameters for tracking code: [${trackingToken}]`);

      // 3. Save directly into table infrastructure using string combination inside the column
      const { error: insertError } = await client
        .from('logo_intakes')
        .insert([
          {
            tracking_number: trackingToken,
            logo_text: logoText,
            tagline: tagline,
            style_preference: styleType,
            concept_description: `Contact: ${clientName} (${emailAddress} / ${phoneNumber}) | Business: ${businessName} | Prompt: ${description} | Mood Profile: ${audienceMood} | Colors: ${colorPalette} | Inspirations: ${competitorLinks}`,
            created_at: new Date().toISOString()
          }
        ]);

      if (insertError) {
        throw new Error(`Postgres Transaction Failure [Code ${insertError.code}]: ${insertError.message}`);
      }

      console.log("✅ [Logo Intake Engine] Specifications successfully logged into table architecture.");
      statusMsg.style.display = "block";
      statusMsg.style.background = "#ecfdf5";
      statusMsg.style.color = "#047857";
      statusMsg.textContent = "✓ Branding Specifications Submitted! Our design desk will process your requirements and compile proofs instantly.";
      
      logoForm.reset();

    } catch (postFault) {
      console.error("✕ Logo intake processing loop broke:", postFault.message);
      statusMsg.style.display = "block";
      statusMsg.style.background = "#fef2f2";
      statusMsg.style.color = "#991b1b";
      statusMsg.textContent = `✕ Submission Failed: ${postFault.message}`;
    } finally {
      submitBtn.textContent = originalBtnText;
      submitBtn.disabled = false;
    }
  });
});
</script>
</body>
</html>

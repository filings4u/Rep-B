<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Secure Billing Settlement | filings4u Checkout</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="images/fav.png">
  
  <style>
    :root {
      --bg-light: #f8fafc;
      --white: #ffffff;
      --border-color: #e2e8f0;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --emerald: #10b981;
      --staff-red: #c15254;
    }

    body, html {
      margin: 0 !important; padding: 0 !important;
      min-height: 100vh !important;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      background-color: var(--bg-light) !important;
      color: var(--text-dark) !important;
    }

    .checkout-wrapper {
      max-width: 650px; margin: 60px auto;
      padding: 0 20px; box-sizing: border-box;
    }

    .checkout-card {
      background: var(--white); border-radius: 16px;
      border: 1px solid var(--border-color); padding: 40px;
      box-shadow: 0 10px 15px -3px rgba(15,23,42,0.05); box-sizing: border-box;
    }

    .item-row-strip {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem;
    }

    .checkout-btn {
      background: var(--text-dark); color: var(--white); border: none;
      border-radius: 8px; font-weight: 700; font-size: 0.95rem; height: 46px;
      width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(15,23,42,0.15); transition: background 0.2s;
    }

    .checkout-btn:hover { background: #1e293b; }
    .checkout-btn:disabled { background: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="checkout-wrapper">
    <div id="clientInvoiceCheckoutCardView" class="checkout-card">
      
      <!-- HEADER LAYER AREA -->
      <div style="text-align: center; margin-bottom: 32px; border-bottom: 1px solid var(--border-color); padding-bottom: 24px;">
        <img src="images/logo.png" alt="filings4u Logo" style="width: 150px; height: auto; margin-bottom: 16px;">
        <h1 style="margin: 0; font-size: 1.3rem; font-weight: 850; color: var(--text-dark);">Secure Invoice Settlement</h1>
        <p id="checkoutInvoiceCodeDisplay" style="margin: 4px 0 0 0; font-family: monospace; font-size: 0.82rem; color: var(--text-muted);">Syncing code references...</p>
      </div>

      <!-- TARGET ITEMIZATION LOG CONTAINER -->
      <div style="margin-bottom: 24px;">
        <span style="font-size: 0.72rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 8px;">Itemized Invoice Summary</span>
        <div id="checkoutItemizedSummaryRowsBox" style="display: flex; flex-direction: column; width: 100%;">
          <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 24px 0; font-style: italic;">Loading balance summaries...</div>
        </div>
      </div>

      <!-- BALANCE BREAKDOWN FOOTPAD -->
      <div style="border-top: 2px dashed var(--border-color); padding-top: 16px; margin-bottom: 32px; text-align: right;">
        <p id="checkoutDueDateDisplayString" style="margin: 0; font-size: 0.82rem; color: var(--text-muted);"></p>
        <h2 style="margin: 6px 0 0 0; font-size: 1.5rem; font-weight: 850; color: var(--text-dark);">Amount Due: <span id="checkoutGrandTotalDisplayString" style="color: var(--staff-red);">$0.00</span></h2>
      </div>

      <!-- INTERACTIVE SUBMIT SETTLE CONTROLS TRIGGER -->
      <div id="checkoutActionContainerBlock">
        <button type="button" id="clientProcessPaymentActionBtn" class="checkout-btn">Authorize Payment Settlement</button>
      </div>
      <div id="checkoutInlineFeedbackBanner" style="display: none; padding: 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 16px;"></div>

    </div>
  </div>


   <!-- ✅ SECURE ADMIN INTEGRATION SEQUENCE ORDER -->
  <!-- 1. The Global Library Core MUST load absolute first -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. The Configuration setup creates window.supabaseClient immediately -->
  <script src="assets/js/supabase-config.js"></script>
  
  <!-- 3. The unified master script processes pricing ledgers, filters, metrics, and navigation -->
  <script src="assets/js/admin-master-ledger.js"></script>

   <!-- 3. The unified master script processes pricing ledgers, filters, metrics, and navigation -->
  <script src="assets/js/admin-navigation.js"></script>


  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      "use strict";

      const codeLabel = document.getElementById("checkoutInvoiceCodeDisplay");
      const rowsBox = document.getElementById("checkoutItemizedSummaryRowsBox");
      const dateLabel = document.getElementById("checkoutDueDateDisplayString");
      const totalLabel = document.getElementById("checkoutGrandTotalDisplayString");
      const paymentBtn = document.getElementById("clientProcessPaymentActionBtn");
      const feedbackBanner = document.getElementById("checkoutInlineFeedbackBanner");

      // Extract raw target reference tokens directly out of browser address routing parameters
      const urlParameters = new URLSearchParams(window.location.search);
      const activeInvoiceIdToken = urlParameters.get("invoice_id");

      const client = window.supabaseInstance || window.supabaseClient;
      if (!client || !activeInvoiceIdToken) {
        rowsBox.innerHTML = `<div style="text-align:center; color:var(--staff-red); font-weight:700; padding:20px 0;">✕ Invalid Request: Mismatched or missing checkout tokens parameters.</div>`;
        if (paymentBtn) paymentBtn.disabled = true;
        return;
      }

      // --- STAGE 1: SYNC LAYOUT RECORDS FROM CLIENT_INVOICES ---
      async function populateClientCheckoutInvoiceCanvas() {
        try {
          const { data: record, error } = await client
            .from('client_invoices')
            .select('*')
            .eq('invoice_id', activeInvoiceIdToken)
            .maybeSingle();

          if (error) throw error;
          if (!record) {
            rowsBox.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:20px 0;">✕ Error: Specified billing target profile does not exist.</div>`;
            if (paymentBtn) paymentBtn.disabled = true;
            return;
          }

          // Lock global tracking status parameters immediately
          paymentBtn.dataset.invoiceId = record.invoice_id;
          paymentBtn.dataset.invoiceCode = record.invoice_code;

          if (codeLabel) codeLabel.textContent = `REFERENCE CODE: ${record.invoice_code}`;
          if (dateLabel) dateLabel.textContent = `Grace Payment Deadline: ${record.due_date || 'Upon Receipt'}`;
          if (totalLabel) totalLabel.textContent = `$${parseFloat(record.grand_total || 0).toFixed(2)}`;

          // Check if invoice has been completed previously
          if (String(record.payment_status).toLowerCase() === 'paid') {
            renderSuccessfulSettlementUIState();
            return;
          }

          // Build itemized rows lines template array loops layout
          rowsBox.innerHTML = "";
          const lines = record.itemized_lines || [];
          
          if (lines.length === 0) {
            rowsBox.innerHTML = `<div class="item-row-strip" style="color:var(--text-muted);">Standard Platform Filing Plan allocation <strong style="font-weight:700; color:var(--text-dark);">$${parseFloat(record.grand_total).toFixed(2)}</strong></div>`;
          } else {
            lines.forEach(item => {
              const row = document.createElement("div");
              row.className = "item-row-strip";
              row.innerHTML = `
                <div>
                  <strong style="color:var(--text-dark); display:block; font-weight:600;">${item.service_title}</strong>
                  <small style="color:var(--text-muted); text-transform:uppercase; font-size:10px; font-weight:500;">Plan Tier: ${item.tier} (x${item.qty})</small>
                </div>
                <strong style="color:var(--text-dark); font-weight:700;">$${parseFloat(item.total || 0).toFixed(2)}</strong>
              `;
              rowsBox.appendChild(row);
            });
          }

        } catch (fault) {
          console.error("✕ Canvas sync crashed:", fault.message);
          rowsBox.innerHTML = `<div style="text-align:center; color:var(--staff-red); font-size:0.85rem;">⚠️ System synchronization interrupted.</div>`;
        }
      }

      function renderSuccessfulSettlementUIState() {
        if (paymentBtn) {
          paymentBtn.disabled = true;
          paymentBtn.textContent = "Payment Completed ✓";
          paymentBtn.style.background = "var(--emerald)";
        }
        if (feedbackBanner) {
          feedbackBanner.style.cssText = "display:block; background:#ecfdf5; color:#047857; border:1px solid rgba(16,185,129,0.1);";
          feedbackBanner.innerHTML = `<strong>✨ Transaction Finalized Safely!</strong><br>This invoice has been completed. A processing clearance confirmation receipt has been dispatched to your files vault records.`;
        }
      }

      // --- STAGE 2: EXECUTE INVOICE SETTLE SUBMISSION ACTIONS ---
      paymentBtn?.addEventListener("click", async () => {
        paymentBtn.disabled = true;
        paymentBtn.textContent = "Authorizing Funds Transfer... 💳";

        try {
          console.log(`💾 [Checkout Engine] Updating database tracking values for: [${activeInvoiceIdToken}]`);

          // Execute a clean record update modifying status metrics field variables from 'Unpaid' over to 'Paid'
          const { error: updateError } = await client
            .from('client_invoices')
            .update({ payment_status: 'Paid' })
            .eq('invoice_id', activeInvoiceIdToken);

          if (updateError) throw updateError;

          renderSuccessfulSettlementUIState();

         } catch (postFault) {
          console.error("✕ Checkout execution failed:", postFault.message);
          paymentBtn.disabled = false;
          paymentBtn.textContent = "Authorize Payment Settlement";
          if (feedbackBanner) {
            feedbackBanner.style.cssText = "display:block; background:#fef2f2; color:#b91c1c; border:1px solid rgba(193,82,84,0.1);";
            feedbackBanner.textContent = `✕ Payment Refused: ${postFault.message}`;
          }
        }
      });

      await populateClientCheckoutInvoiceCanvas();
    });
  </script>
</body>
</html>

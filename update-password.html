<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Set Access Password | filings4u</title>
  
  <!-- Inter & System Font Stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Integration Route -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>

  <style>
    :root {
      --primary: #0a1f44;
      --primary-hover: #112d5d;
      --accent: #10b981;
      --accent-bg: rgba(16, 185, 129, 0.06);
      --error: #ef4444;
      --error-bg: #fef2f2;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #e2e8f0;
      --bg-page: #f8fafc;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08);
      box-sizing: border-box;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-container { margin-bottom: 24px; text-align: center; }
    .logo-container img { height: 42px; width: auto; }
    h2 { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin: 0 0 8px 0; text-align: center; letter-spacing: -0.02em; }
    .view-desc { color: var(--text-muted); font-size: 0.875rem; line-height: 1.5; margin: 0 0 32px 0; text-align: center; }

    .form-group { text-align: left; margin-bottom: 20px; }
    .form-label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; color: var(--primary); text-transform: uppercase; letter-spacing: 0.06em; }
    
    .password-wrapper { position: relative; display: flex; align-items: center; }
    .password-wrapper input {
      width: 100%;
      padding: 14px 44px 14px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .password-wrapper input:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 4px var(--accent-bg) !important; }
    .password-wrapper input.field-error { border-color: var(--error) !important; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12) !important; animation: fieldShake 0.4s both; }

    .toggle-password-eye { position: absolute; right: 16px; color: #94a3b8; cursor: pointer; font-size: 1rem; padding: 4px; user-select: none; }
    .toggle-password-eye:hover { color: var(--text-muted); }

    /* 🏎️ SMOOTH ACCORDION DROPDOWN ANIMATION STRUCT */
    .animated-dropdown-wrapper {
      max-height: 0px;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }
    .animated-dropdown-wrapper.reveal {
      max-height: 200px; /* Expands smoothly to allow confirm block to drop down */
      opacity: 1;
    }

    /* 📈 VISUAL STRENGTH STYLING PLACEMENT */
    .strength-indicator { display: flex; gap: 6px; margin-top: 10px; margin-bottom: 16px; width: 100%; }
    .strength-bar { height: 4px; flex: 1; border-radius: 100px; background: #e2e8f0; transition: background 0.3s ease; }

    #reset-status-msg { font-size: 0.8rem; font-weight: 500; margin-bottom: 20px; text-align: left; display: none; line-height: 1.5; padding: 10px 12px; border-radius: 6px; }
    .btn-submit { width: 100%; background: var(--primary); color: #ffffff; border: none; padding: 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(10, 31, 68, 0.1); }
    .btn-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }

    .trust-shield-container { margin-top: 32px; text-align: center; }
    .trust-shield-badge { background: #ffffff; border: 1px solid var(--border-color); border-radius: 100px; padding: 8px 18px; display: inline-flex; align-items: center; gap: 8px; font-size: 0.75rem; }
    .trust-shield-badge .secure-tag { color: var(--accent); font-weight: 800; }

    @keyframes fieldShake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
      40%, 60% { transform: translate3d(3px, 0, 0); }
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 20px; border-radius: 12px; }
      h2 { font-size: 1.35rem; }
      .password-wrapper input { font-size: 16px !important; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="login-card">
      
      <!-- Brand Logo Layer -->
      <div class="logo-container">
        <img src="images/logo.png" alt="filings4u logo">
      </div>
      
      <h2 id="portal-view-title">Setup Security Password</h2>
      <p id="portal-view-desc" class="view-desc">Establish a permanent encryption access password to secure your compliance records.</p>
      
      <!-- Form Schema -->
      <form id="passwordResetCommitForm" novalidate>
        
        <!-- Field 1 (Always Visible) -->
        <div class="form-group">
          <label class="form-label" for="portalUserPassword">New Secure Password</label>
          <div class="password-wrapper">
            <input type="password" id="portalUserPassword" required placeholder="Minimum 8 characters...">
            <i class="fa-solid fa-eye toggle-password-eye" data-target="portalUserPassword"></i>
          </div>
          
          <!-- Dynamic Password Progress Strength Bars -->
          <div class="strength-indicator">
            <div class="strength-bar" id="strength-1"></div>
            <div class="strength-bar" id="strength-2"></div>
            <div class="strength-bar" id="strength-3"></div>
          </div>
        </div>

        <!-- Hidden Accordion Segment (Animates down smoothly once the user types) -->
        <div class="animated-dropdown-wrapper" id="confirmFieldDropdown">
          <div class="form-group" style="padding-top: 4px;">
            <label class="form-label" for="portalUserPasswordConfirm">Confirm Secure Password</label>
            <div class="password-wrapper">
              <input type="password" id="portalUserPasswordConfirm" required placeholder="Re-type password...">
              <i class="fa-solid fa-eye toggle-password-eye" data-target="portalUserPasswordConfirm"></i>
            </div>
          </div>
        </div>

        <div id="reset-status-msg"></div>

        <button type="submit" class="btn-submit" id="resetSubmitBtn">Finalize Profile Registration</button>
      </form>
    </div>

    <!-- Trust Badge -->
    <div class="trust-shield-container">
      <div class="trust-shield-badge">
        <i class="fa-solid fa-shield-halved" style="color: var(--accent);"></i>
        <span class="secure-tag">SECURE</span>
        <span class="secure-desc">256-bit SSL Encrypted Connection</span>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // 1. Password Eye Toggle Engine (Ensures BOTH fields function independently)
      const eyeIcons = document.querySelectorAll(".toggle-password-eye");
      eyeIcons.forEach(icon => {
        icon.addEventListener("click", function () {
          const targetId = this.getAttribute("data-target");
          const inputField = document.getElementById(targetId);
          if (inputField) {
            if (inputField.type === "password") {
              inputField.type = "text";
              this.classList.replace("fa-eye", "fa-eye-slash");
            } else {
              inputField.type = "password";
              this.classList.replace("fa-eye-slash", "fa-eye");
            }
          }
        });
      });

      // 2. Dropdown Reveal Script & Realtime Strength Monitor Lights
      const pwdInput = document.getElementById("portalUserPassword");
      const dropdownWrapper = document.getElementById("confirmFieldDropdown");
      const bar1 = document.getElementById("strength-1");
      const bar2 = document.getElementById("strength-2");
      const bar3 = document.getElementById("strength-3");

      if (pwdInput && dropdownWrapper) {
        pwdInput.addEventListener("input", function() {
          const val = pwdInput.value;
          
          // 🔥 DYNAMIC REVEAL: Drops confirm block down smoothly on first keypress
          if (val.length > 0) {
            dropdownWrapper.classList.add("reveal");
          } else {
            dropdownWrapper.classList.remove("reveal");
            bar1.style.background = bar2.style.background = bar3.style.background = '';
            return;
          }
          
          // Visual strength indicator calculations
          let score = 0;
          if (val.length >= 8) score++;
          if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
          if (/[^A-Za-z0-9]/.test(val)) score++;

          if (score === 1) {
            bar1.style.background = 'var(--error)';
            bar2.style.background = bar3.style.background = '';
          } else if (score === 2) {
            bar1.style.background = bar2.style.background = '#f59e0b'; // Amber Warning
            bar3.style.background = '';
          } else if (score === 3) {
            bar1.style.background = bar2.style.background = bar3.style.background = 'var(--accent)'; // Emerald
          }
        });
      }
    });
  </script>
  <!-- Link to central logic code asset directly -->
  <script src="assets/js/password-reset-engine.js"></script>
</body>
</html>

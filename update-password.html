<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Set Access Password | filings4u</title>
  <link rel="stylesheet" href="assets/css/portal-global.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  
  <!-- Inter & System Font Smooth Stack -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Integration Route -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Scripts -->
  <script src="https://www.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/wizard-sync.js"></script>
  <link rel="icon" type="image/png" href="images/fav.png">

  <style>
    :root {
      --primary: #0a1f44;
      --primary-hover: #112d5d;
      --accent: #10b981;
      --accent-bg: rgba(16, 185, 129, 0.06);
      --error: #ef4444;
      --error-bg: #fef2f2;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #e2e8f0;
      --bg-page: #f8fafc;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center; /* Vertically centers the content */
      align-items: center;     /* Horizontally centers the content */
      min-height: 100vh;       /* Spans the full height of the viewport */
      width: 100%;
      padding: 20px;           /* Prevents card edge-bleeding on mobile screens */
      box-sizing: border-box;
      background-color: var(--bg-page);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08);
      box-sizing: border-box;
    }

    .logo-container {
      margin-bottom: 28px;
      text-align: center;
    }

    .logo-container img {
      height: 42px;
      width: auto;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      margin: 0 0 8px 0;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .view-desc {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.5;
      margin: 0 0 32px 0;
      text-align: center;
    }

    .alert-box {
      display: none;
      background: var(--error-bg);
      border: 1px solid #fca5a5;
      border-radius: 10px;
      padding: 16px;
      text-align: left;
      margin-bottom: 24px;
      box-sizing: border-box;
    }

    .alert-title {
      color: #991b1b;
      font-size: 0.875rem;
      font-weight: 700;
      margin: 0 0 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-desc {
      color: #7f1d1d;
      font-size: 0.8rem;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }

    .alert-btn {
      background: #991b1b;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s ease;
    }

    .alert-btn:hover {
      background: #7f1d1d;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      width: 100%;
      padding: 14px 44px 14px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      background-color: #ffffff;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .password-wrapper input::placeholder {
      color: #94a3b8;
    }

    .password-wrapper input:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 4px var(--accent-bg) !important;
    }

    .password-wrapper input.field-error {
      border-color: var(--error) !important;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12) !important;
      animation: fieldShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    .toggle-password-eye {
      position: absolute;
      right: 16px;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      user-select: none;
      transition: color 0.2s ease;
    }

    .toggle-password-eye:hover {
      color: var(--text-muted);
    }

       /* 📈 VISUAL STRENGTH INDICATOR MATRIX CSS CONFIGURATION */
    .strength-indicator {
      display: flex;
      gap: 6px;               /* Leaves clean spacing gaps between the bars */
      margin-top: 8px;        /* Spacing below the password text field box */
      margin-bottom: 4px;
      width: 100%;
      box-sizing: border-box;
    }

    .strength-bar {
      height: 4px;            /* Gives the indicators physical rendering height */
      flex: 1;                /* Forces the 3 blocks to split form width equally */
      border-radius: 100px;   /* Smoothly rounds the element edges */
      background: #e2e8f0;    /* Baseline default cool gray color for empty bars */
      transition: background 0.3s cubic-bezier(0.16, 1, 0.3, 1); /* Smooth fluid color transition */
    }


    #reset-status-msg {
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 20px;
      text-align: left;
      display: none;
      line-height: 1.5;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(10, 31, 68, 0.1);
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(10, 31, 68, 0.15);
    }

    .trust-shield-container {
      margin-top: 32px;
      text-align: center;
    }

    .trust-shield-badge {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 100px;
      padding: 8px 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
    }

    .trust-shield-badge .secure-tag {
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .trust-shield-badge .secure-desc {
      color: var(--text-muted);
      font-weight: 500;
    }

    @keyframes fieldShake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
      40%, 60% { transform: translate3d(3px, 0, 0); }
    }

        /* Responsive Fluid Breaks */
    @media (max-width: 480px) {
      .login-card {
        padding: 32px 20px;    /* Optimizes breathing room inside tight screens */
        border-radius: 12px;   /* Softens card borders slightly on mobile */
      }
      
      h2 {
        font-size: 1.35rem;    /* Fluidly downsizes heading title text scale */
      }
      
      .view-desc {
        font-size: 0.825rem;   /* Calibrates sentence sizes for viewport flow */
        margin-bottom: 24px;
      }

      .password-wrapper input {
        font-size: 16px !important; /* 🔥 CRITICAL: Prevents iOS Safari from forcefully zooming in on input focus */
        padding: 12px 40px 12px 12px;
      }
    }

  </style>
</head>
<body>

  <div class="page-wrapper">
    <div class="login-card">
      
      <!-- Brand Logo Layer -->
      <div class="logo-container">
        <img src="images/logo.png" alt="filings4u logo">
      </div>
      
      <!-- Header Copy -->
      <h2 id="portal-view-title">Setup Security Password</h2>
      <p id="portal-view-desc" class="view-desc">Establish a permanent encryption access password to secure your compliance records.</p>
      
      <!-- Timeout Warning Frame -->
      <div id="timeout-warning-box" class="alert-box">
        <h4 class="alert-title">
          <i class="fa-solid fa-triangle-exclamation"></i> Secure Session Expired
        </h4>
        <p class="alert-desc">For your identity protection, this single-use activation panel has timed out after 10 minutes of inactivity.</p>
        <button type="button" id="triggerReverifyBtn" class="alert-btn">
          <i class="fa-solid fa-rotate"></i> Request New Verification Link
        </button>
      </div>
      <!-- Action Form Schema -->
      <form id="passwordResetCommitForm" novalidate>
        
        <!-- Input 1 -->
        <div class="form-group">
          <label class="form-label" for="portalUserPassword">New Secure Password</label>
          <div class="password-wrapper">
            <input type="password" id="portalUserPassword" required placeholder="Minimum 8 characters...">
            <i class="fa-solid fa-eye toggle-password-eye" data-target="portalUserPassword"></i>
          </div>
          <!-- Realtime Password Strength Bar Tracks -->
          <div class="strength-indicator">
            <div class="strength-bar" id="strength-1"></div>
            <div class="strength-bar" id="strength-2"></div>
            <div class="strength-bar" id="strength-3"></div>
          </div>
        </div>

        <!-- Input 2 -->
        <div class="form-group">
          <label class="form-label" for="portalUserPasswordConfirm">Confirm Secure Password</label>
          <div class="password-wrapper">
            <input type="password" id="portalUserPasswordConfirm" required placeholder="Re-type password...">
            <i class="fa-solid fa-eye toggle-password-eye" data-target="portalUserPasswordConfirm"></i>
          </div>
        </div>

        <!-- Dynamic Status Message Enclosure -->
        <div id="reset-status-msg"></div>

        <!-- Submission Trigger Button -->
        <button type="submit" class="btn-submit" id="resetSubmitBtn">Finalize Profile Registration</button>
      </form>
    </div>

    <!-- Secure Connection Cryptographic Shield -->
    <div class="trust-shield-container">
      <div class="trust-shield-badge">
        <i class="fa-solid fa-shield-halved" style="color: var(--accent);"></i>
        <span class="secure-tag">SECURE</span>
        <span class="secure-desc">256-bit SSL Encrypted Connection</span>
      </div>
    </div>
  </div>
  
  <!-- EXTERNAL LOGIC COMPONENT LAYER -->
  <script src="assets/js/password-reset-engine.js"></script>
</body>
</html>

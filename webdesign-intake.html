<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Website Design Intake | filings4u Portal</title>
    <link rel="icon" type="image/png" href="images/fav.png">
  <style>
:root {
  --bg-light: #f8fafc;
  --white: #ffffff;
  --border-color: #e2e8f0;
  --text-dark: #0f172a;
  --text-muted: #64748b;
  --staff-red: #c15254;
  --emerald: #10b981;
  --navy: #0a1f44;
}

body, html {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-light);
  color: var(--text-dark);
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
}

.master-portal-wrapper {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 40px 24px;
  box-sizing: border-box;
  flex: 1 0 auto;
}

.intake-card {
  background: var(--white);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 44px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.03);
  box-sizing: border-box;
  width: 100%;
}

.brand-logo img {
  height: 38px;
  width: auto;
  margin-bottom: 24px;
  display: block;
}

h1 {
  font-size: 1.6rem;
  font-weight: 800;
  margin: 0 0 8px 0;
  color: var(--text-dark);
  letter-spacing: -0.02em;
}

.subtitle-p {
  font-size: 0.88rem;
  color: var(--text-muted);
  margin: 0 0 36px 0;
  line-height: 1.6;
}

.blueprint-form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  column-gap: 32px;
  row-gap: 24px;
  margin-bottom: 36px;
  width: 100%;
  box-sizing: border-box;
}

.form-group {
  display: flex;
  flex-direction: column;
  width: 100%;
  box-sizing: border-box;
}
.full-bleed-span {
  grid-column: 1 / -1;
}

label {
  display: block;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  color: var(--text-dark);
}

input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 0.88rem;
  color: var(--text-dark);
  background: #f8fafc;
  outline: none;
  box-sizing: border-box;
  font-family: inherit;
  height: 44px;
  transition: background 0.15s ease, border-color 0.15s ease;
}

textarea {
  height: 120px !important;
  resize: vertical;
}

input:focus, select:focus, textarea:focus {
  background: var(--white);
  border-color: var(--staff-red);
  box-shadow: 0 0 0 4px rgba(193, 82, 84, 0.05);
}

.checkbox-matrix-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  padding: 14px;
  background: #f8fafc;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  box-sizing: border-box;
}

.checkbox-item-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.88rem;
  color: var(--text-dark);
  cursor: pointer;
}

.checkbox-item-wrapper input[type="checkbox"] {
  width: 18px;
  height: 18px;
  margin: 0;
  cursor: pointer;
  accent-color: var(--staff-red);
}

.submit-btn {
  padding: 0 32px;
  background: var(--text-dark);
  color: var(--white);
  border: none;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
  box-sizing: border-box;
  height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

.submit-btn:hover {
  background: #1e293b;
}

.submit-btn:active {
  transform: scale(0.99);
}

.action-row-footer {
  display: flex;
  justify-content: flex-end;
  width: 100%;
  box-sizing: border-box;
  margin-top: 12px;
}

.status-msg {
  display: none;
  font-size: 0.85rem;
  font-weight: 600;
  text-align: left;
  margin-top: 20px;
  padding: 12px;
  border-radius: 6px;
  line-height: 1.4;
}

/* 🛠 SYSTEM LAYOUT FOR CONDITIONAL HIDING/SHOWING */
.form-group-conditional.hidden {
  display: none !important;
}

@media screen and (max-width: 1024px) {
  .blueprint-form-grid {
    grid-template-columns: 1fr !important;
    row-gap: 20px !important;
    column-gap: 0px !important;
  }
  .blueprint-form-grid > div {
    grid-column: span 1 / auto !important;
  }
  .intake-card {
    padding: 28px;
  }
  .action-row-footer {
    justify-content: stretch;
  }
  .submit-btn {
    width: 100% !important;
  }
  .checkbox-matrix-container {
    grid-template-columns: 1fr;
  }
}
</style>

</head>
<body>

  
<!-- 💡 WRAPPER ADDED TO TRIGGER FOOTER INJECTION ENGINE --> 
<div class="portal-main" style="display: flex; flex-direction: column; min-height: 100vh; width: 100%;"> 
  <!-- MASTER OUTER WRAPPER CONTAINER PANE --> 
  <div class="master-portal-wrapper"> 
    <div class="intake-card"> 
      <div class="brand-logo"> 
        <img src="https://supabase.co" alt="filings4u Logo"> 
      </div> 
      <h1>Website Specification Design Intake</h1> 
      <p class="subtitle-p">Please supply your localized corporate business models, aesthetic preferences, functional workflows, and delivery scopes below to initialize immediate development queues.</p> 
      
      <form id="webIntakeForm" novalidate> 
        <div class="blueprint-form-grid"> 
          <div class="form-group"> 
            <label for="webBusinessName">Company / Business Name</label> 
            <input type="text" id="webBusinessName" required placeholder="e.g., Acme Corporation"> 
          </div> 
          <div class="form-group"> 
            <label for="webClientName">Your Name</label> 
            <input type="text" id="webClientName" required placeholder="e.g., Jane Doe"> 
          </div> 
          <div class="form-group"> 
            <label for="webEmailAddress">Email Address</label> 
            <input type="email" id="webEmailAddress" required placeholder="e.g., contact@business.com"> 
          </div> 
          <div class="form-group"> 
            <label for="webPhoneNumber">Phone Number</label> 
            <input type="tel" id="webPhoneNumber" required placeholder="e.g., (555) 019-2834"> 
          </div> 
          <div class="form-group"> 
            <label for="webCurrentUrl">Website / Current URL</label> 
            <input type="text" id="webCurrentUrl" placeholder="e.g., https://mycurrentsite.com"> 
          </div> 
          <div class="form-group"> 
            <label for="webSiteType">What kind of website do you need?</label> 
            <select id="webSiteType" required> 
              <option value="" disabled selected>Select a type...</option>
              <option value="New website">New website</option> 
              <option value="Website redesign">Website redesign</option> 
              <option value="Landing page">Landing page</option> 
              <option value="E-commerce site">E-commerce site</option> 
              <option value="Other">Other</option> 
            </select> 
          </div>

          <!-- CONDITIONAL: Website Type Explanation -->
          <div class="form-group form-group-conditional full-bleed-span" id="group-webSiteTypeOther" style="display: none !important;">
            <label for="webSiteTypeOther">Please specify your website type</label>
            <input type="text" id="webSiteTypeOther" placeholder="Describe the specific architecture you need...">
          </div>

          <div class="form-group full-bleed-span"> 
            <label for="webMainGoal">What is the main goal of the website?</label> 
            <textarea id="webMainGoal" required placeholder="Describe what actions you want users to take on your website..."></textarea> 
          </div> 
          <div class="form-group full-bleed-span"> 
            <label for="webTargetAudience">Who is your target audience?</label> 
            <textarea id="webTargetAudience" required placeholder="Describe your ideal customers or visitors..."></textarea> 
          </div> 
          <div class="form-group full-bleed-span"> 
            <label for="webContentScope">What services, products, or content should be included?</label> 
            <textarea id="webContentScope" required placeholder="List out specific pages, products, or functional overviews..."></textarea> 
          </div>

                    <div class="form-group"> 
            <label for="webBrandingStatus">Do you have existing branding?</label> 
            <select id="webBrandingStatus" required> 
              <option value="" disabled selected>Select an option...</option>
              <option value="Yes">Yes</option> 
              <option value="No">No</option> 
              <option value="In progress">In progress</option> 
            </select> 
          </div> 

          <!-- CONDITIONAL: Brand Assets (Only shown if Branding Status is 'Yes') -->
          <div class="form-group form-group-conditional" id="group-webBrandAssets" style="display: none !important;"> 
            <label for="webBrandAssets">Please share brand assets or links</label> 
            <input type="text" id="webBrandAssets" placeholder="Paste shared drive links or design links here..."> 
          </div> 

          <div class="form-group"> 
            <label for="webStyleDirection">What style do you want?</label> 
            <select id="webStyleDirection" required> 
              <option value="" disabled selected>Select a style...</option>
              <option value="Modern">Modern</option> 
              <option value="Minimal">Minimal</option> 
              <option value="Bold">Bold</option> 
              <option value="Professional">Professional</option> 
              <option value="Creative">Creative</option> 
              <option value="Luxury">Luxury</option> 
              <option value="Other">Other</option> 
            </select> 
          </div> 

          <!-- CONDITIONAL: Style Direction Explanation -->
          <div class="form-group form-group-conditional" id="group-webStyleDirectionOther" style="display: none !important;">
            <label for="webStyleDirectionOther">Please specify your preferred style</label>
            <input type="text" id="webStyleDirectionOther" placeholder="Describe the aesthetic direction...">
          </div>

          <div class="form-group"> 
            <label for="webAesthetic">Primary Brand Colors & Visual Tone Guidelines</label> 
            <input type="text" id="webAesthetic" required placeholder="e.g., Slate Dark Blue (#0A1F44) & Emerald Green (#10B981)"> 
          </div> 
          <div class="form-group full-bleed-span"> 
            <label for="webInspirationUrls">Any websites you like? Please share links.</label> 
            <textarea id="webInspirationUrls" placeholder="Paste links to design templates or competitor examples you prefer..."></textarea> 
          </div> 
          
          <!-- Section: Functional Feature Matrices --> 
          <div class="form-group full-bleed-span"> 
            <label>What features do you need?</label> 
            <div class="checkbox-matrix-container"> 
              <label class="checkbox-item-wrapper"><input type="checkbox" name="webFeatures" value="Contact form"> Contact form</label> 
              <label class="checkbox-item-wrapper"><input type="checkbox" name="webFeatures" value="Booking form"> Booking form</label> 
              <label class="checkbox-item-wrapper"><input type="checkbox" name="webFeatures" value="Blog"> Blog</label> 
              <label class="checkbox-item-wrapper"><input type="checkbox" name="webFeatures" value="E-commerce"> E-commerce</label> 
              <label class="checkbox-item-wrapper"><input type="checkbox" name="webFeatures" value="Gallery / portfolio"> Gallery / portfolio</label> 
              <label class="checkbox-item-wrapper"><input type="checkbox" name="webFeatures" value="Newsletter signup"> Newsletter signup</label> 
              <label class="checkbox-item-wrapper"><input type="checkbox" name="webFeatures" value="Live chat"> Live chat</label> 
              <label class="checkbox-item-wrapper"><input type="checkbox" name="webFeatures" value="Other"> Other Feature</label> 
            </div> 
          </div> 

          <!-- CONDITIONAL: Other Features Explanation -->
          <div class="form-group form-group-conditional full-bleed-span" id="group-webFeaturesOther" style="display: none !important;">
            <label for="webFeaturesOther">Please list your other required features</label>
            <input type="text" id="webFeaturesOther" placeholder="Describe specific integration details or apps needed...">
          </div>

          <div class="form-group"> 
            <label for="webPageCount">How many pages do you think you need?</label> 
            <input type="text" id="webPageCount" required placeholder="e.g., 5-7 pages, Single page landing"> 
          </div> 
          <div class="form-group"> 
            <label for="webCopyStatus">Do you already have website copy and images?</label> 
            <select id="webCopyStatus" required> 
              <option value="" disabled selected>Select an option...</option>
              <option value="Yes, both">Yes, both</option> 
              <option value="Copy only">Copy only</option> 
              <option value="Images only">Images only</option> 
              <option value="No, I need help with both">No, I need help with both</option> 
            </select> 
          </div> 
          <div class="form-group"> 
            <label for="webLogoStatus">Do you have a Logo?</label> 
            <select id="webLogoStatus" required> 
              <option value="" disabled selected>Select an option...</option>
              <option value="Yes">Yes, I have a logo</option> 
              <option value="No - Create one">No, please create one for us</option> 
              <option value="No - Do not create one">No, but we don't need one created</option> 
            </select> 
          </div> 

          <!-- CONDITIONAL: Logo Asset Link (Only shown if Logo Status is 'Yes') -->
          <div class="form-group form-group-conditional" id="group-webLogoUrl" style="display: none !important;"> 
            <label for="webLogoUrl">If yes, paste asset link / shared drive file path</label> 
            <input type="text" id="webLogoUrl" placeholder="Link to logo vector file or graphic asset..."> 
          </div> 

          <div class="form-group full-bleed-span"> 
            <label for="webNotes">Anything else we should know?</label> 
            <textarea id="webNotes" required placeholder="Log any additional operational requirements, external system configurations, integrations or layout preferences here..."></textarea> 
          </div> 
        </div> 

        <!-- LOWER RIGHT BUTTON ACTION BLOCK --> 
        <div class="action-row-footer"> 
          <button type="submit" class="submit-btn" id="submitBtn">Commit Web Specifications Matrix ➔</button> 
        </div> 
      </form> 
      <div id="status-msg" class="status-msg"></div> 
    </div> 
  </div> 
</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/client-footer.js"></script>


    
<script>
document.addEventListener("DOMContentLoaded", async () => {
  "use strict";

  const intakeForm = document.getElementById("webIntakeForm");
  const submitBtn = document.getElementById("submitBtn");
  const statusMsg = document.getElementById("status-msg");

  if (!intakeForm || !statusMsg || !submitBtn) {
    throw new Error("✕ Critical UI Error: Form wrapper tree elements are missing from the page canvas.");
  }

  // Pure script styling overrides hardcoded markup rules cleanly
  function toggleConditionalField(containerId, inputId, shouldShow) {
    const container = document.getElementById(containerId);
    const input = document.getElementById(inputId);
    if (container && input) {
      if (shouldShow) {
        container.style.setProperty("display", "flex", "important");
        input.setAttribute("required", "required");
      } else {
        container.style.setProperty("display", "none", "important");
        input.removeAttribute("required");
        input.value = ""; 
      }
    }
  }

  // Active runtime drop-down tracking events
  const siteTypeSelect = document.getElementById("webSiteType");
  if (siteTypeSelect) {
    siteTypeSelect.addEventListener("change", () => {
      toggleConditionalField("group-webSiteTypeOther", "webSiteTypeOther", siteTypeSelect.value === "Other");
    });
  }

  const brandingStatusSelect = document.getElementById("webBrandingStatus");
  if (brandingStatusSelect) {
    brandingStatusSelect.addEventListener("change", () => {
      toggleConditionalField("group-webBrandAssets", "webBrandAssets", brandingStatusSelect.value === "Yes");
    });
  }

  const styleDirectionSelect = document.getElementById("webStyleDirection");
  if (styleDirectionSelect) {
    styleDirectionSelect.addEventListener("change", () => {
      toggleConditionalField("group-webStyleDirectionOther", "webStyleDirectionOther", styleDirectionSelect.value === "Other");
    });
  }

  const logoStatusSelect = document.getElementById("webLogoStatus");
  if (logoStatusSelect) {
    logoStatusSelect.addEventListener("change", () => {
      toggleConditionalField("group-webLogoUrl", "webLogoUrl", logoStatusSelect.value === "Yes");
    });
  }

  // Real-time Event Listener for Matrix Feature Checkboxes
  intakeForm.addEventListener("change", (e) => {
    if (e.target && e.target.name === "webFeatures") {
      const otherCheckbox = Array.from(document.querySelectorAll('input[name="webFeatures"]'))
        .find(cb => cb.value === "Other");
      const isOtherChecked = otherCheckbox ? otherCheckbox.checked : false;
      toggleConditionalField("group-webFeaturesOther", "webFeaturesOther", isOtherChecked);
    }
  });
  // Extract configuration tokens
  const urlParams = new URLSearchParams(window.location.search);
  const trackingToken = urlParams.get("token") || localStorage.getItem("f4u_active_tracking_token") || "GUEST-INTAKE";

  const client = window.supabaseInstance || window.supabaseClient;
  if (!client || typeof client.from !== 'function') {
    statusMsg.style.display = "block";
    statusMsg.style.background = "#fef2f2";
    statusMsg.style.color = "#991b1b";
    statusMsg.textContent = "✕ System Error: Supabase client infrastructure missing.";
    throw new Error("✕ Initialization Error: Database connection reference unassigned.");
  }

  // Intercept the submission process
  intakeForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    statusMsg.style.display = "none";
    statusMsg.textContent = "";

    // 1. Enforce validation boundaries on all visible inputs
    if (!intakeForm.checkValidity()) {
      statusMsg.style.display = "block";
      statusMsg.style.background = "#fef2f2";
      statusMsg.style.color = "#991b1b";
      statusMsg.textContent = "✕ Validation Error: All visible required fields must be properly completed.";
      intakeForm.reportValidity();
      return;
    }

    // 2. Gather values from all field coordinates
    const featureSelectionArray = [];
    document.querySelectorAll('input[name="webFeatures"]:checked').forEach((checkbox) => {
      featureSelectionArray.push(checkbox.value);
    });

    const businessName = document.getElementById("webBusinessName").value.trim();
    const clientName = document.getElementById("webClientName").value.trim();
    const emailAddress = document.getElementById("webEmailAddress").value.trim();
    const phoneNumber = document.getElementById("webPhoneNumber").value.trim();
    const currentUrl = document.getElementById("webCurrentUrl").value.trim();
    
    const siteType = siteTypeSelect.value;
    const siteTypeOther = document.getElementById("webSiteTypeOther")?.value.trim() || "";
    
    const mainGoal = document.getElementById("webMainGoal").value.trim();
    const targetAudience = document.getElementById("webTargetAudience").value.trim();
    const contentScope = document.getElementById("webContentScope").value.trim();
    
    const brandingStatus = brandingStatusSelect.value;
    const brandAssets = document.getElementById("webBrandAssets")?.value.trim() || "";
    
    const styleDirection = styleDirectionSelect.value;
    const styleDirectionOther = document.getElementById("webStyleDirectionOther")?.value.trim() || "";
    
    const aesthetic = document.getElementById("webAesthetic").value.trim();
    const inspirationUrls = document.getElementById("webInspirationUrls").value.trim();
    const featuresOther = document.getElementById("webFeaturesOther")?.value.trim() || "";
    const pageCount = document.getElementById("webPageCount").value.trim();
    const copyStatus = document.getElementById("webCopyStatus").value;
    const logoStatus = logoStatusSelect.value;
    const logoUrl = document.getElementById("webLogoUrl")?.value.trim() || "";
    const notes = document.getElementById("webNotes").value.trim();

    // 3. Flatten layout choices out to match table column constraints
    const optimizedWebsiteType = siteType === "Other" && siteTypeOther ? `Other: ${siteTypeOther}` : siteType;
    const optimizedStylePreference = styleDirection === "Other" && styleDirectionOther ? `Other: ${styleDirectionOther}` : styleDirection;
    
    if (featuresOther) {
      featureSelectionArray.push(`Other Feature Detail: ${featuresOther}`);
    }
    
    const flatFeaturesString = featureSelectionArray.join(", ");

    const originalBtnText = submitBtn.textContent;
    submitBtn.textContent = "Processing Blueprint Records...";
    submitBtn.disabled = true;

    try {
      console.log(`📡 [Web Intake Engine] Syncing layout parameters for tracking code: [${trackingToken}]`);

      // 4. Run explicit insert using correct database keys
      const { error: insertError } = await client
        .from('web_intakes')
        .insert([
          {
            tracking_number: trackingToken,
            business_name: businessName,
            client_name: clientName,
            email_address: emailAddress,
            phone_number: phoneNumber,
            current_url: currentUrl,
            website_type: optimizedWebsiteType,
            main_goal: mainGoal,
            target_audience: targetAudience,
            content_scope: contentScope,
            branding_status: brandingStatus,
            brand_assets_links: brandAssets,
            style_preference: optimizedStylePreference,
            aesthetic_tone: aesthetic,
            design_inspiration_links: inspirationUrls,
            required_features: flatFeaturesString,
            estimated_page_count: pageCount,
            asset_copy_status: copyStatus,
            logo_status: logoStatus,
            logo_asset_url: logoUrl,
            architectural_notes: notes
          }
        ]);

      if (insertError) {
        throw new Error(`Postgres Transaction Failure [Code ${insertError.code}]: ${insertError.message}`);
      }

      console.log("✅ [Web Intake Engine] Specifications successfully logged into table architecture.");
      statusMsg.style.display = "block";
      statusMsg.style.background = "#ecfdf5";
      statusMsg.style.color = "#047857";
      statusMsg.textContent = "✓ Specifications Submitted! Our engineering staff will review your metrics and begin build phases instantly.";
      
      intakeForm.reset();
      
      // Close visibility wrapper groups on successful execution reset
      const conditionals = ["group-webSiteTypeOther", "group-webBrandAssets", "group-webStyleDirectionOther", "group-webFeaturesOther", "group-webLogoUrl"];
      conditionals.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.setProperty("display", "none", "important");
      });

    } catch (postFault) {
      console.error("✕ Web intake processing loop broke:", postFault.message);
      statusMsg.style.display = "block";
      statusMsg.style.background = "#fef2f2";
      statusMsg.style.color = "#991b1b";
      statusMsg.textContent = `✕ Submission Failed: ${postFault.message}`;
    } finally {
      submitBtn.textContent = originalBtnText;
      submitBtn.disabled = false;
    }
  });
});
</script>


</body>
</html>
